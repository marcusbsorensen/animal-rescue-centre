name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The animal sprites, gated. Two things can rot here and neither shows
      # up in a typecheck: the generated bounds table in
      # `apps/game/src/ui/animal-sprite-bounds.ts` going stale against the
      # art, which makes the sprite layer cut its frames from the wrong box;
      # and a newly installed sprite that is cropped, has a painted corner or
      # has a bowl left beside it. `tools/sprite-scale-known-failures.txt` is
      # the list of sprites that already fail and still need art — the gate
      # fails on anything else, and also when one of those starts passing, so
      # the list only ever shrinks.
      - name: Sprite scale and bounds
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          python3 tools/check-sprite-scale.py --gate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Playwright e2e is intentionally *not* run on CI — typecheck +
      # build + vitest already catch the class of bugs the smoke tests
      # would. Running headless Phaser in Linux CI has been flaky
      # enough that the noise outweighs the signal for a single-dev
      # project. Devs run `pnpm --filter @arc/game test:visual` locally
      # when visual-regression review is wanted.
