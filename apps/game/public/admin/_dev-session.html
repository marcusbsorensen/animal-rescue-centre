<!DOCTYPE html>
<!--
  THROWAWAY. Delete this file when the session that made it is done.

  Reaching real iOS WebKit without a build: serve the app with
  `vite --host 0.0.0.0`, then
  `xcrun simctl openurl <udid> "http://localhost:<port>/admin/_dev-session.html#<json>"`.
  This is same-origin with the game, so the arc_session it writes is the
  one the game reads. Mobile Safari on the simulator is the same engine as
  the app's WKWebView and it keeps HMR.

  The session arrives in the fragment, so nothing secret lives in the file
  — but it must still not ship: build-ios.mjs deliberately does not exclude
  public/admin/, so anything left here goes inside the app.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A.R.C. dev session</title>
  <style>
    body { font: 16px -apple-system, sans-serif; margin: 0; padding: 24px;
           background: #fef9ef; color: #4a3a2a; }
    code { word-break: break-all; font-size: 13px; }
  </style>
</head>
<body>
  <p id="status">Writing session…</p>
  <p><code id="detail"></code></p>
  <script>
    (function () {
      var status = document.getElementById('status');
      var detail = document.getElementById('detail');
      var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
      if (!raw) {
        status.textContent = 'No session in the fragment.';
        detail.textContent = 'Append #<url-encoded arc_session JSON> and reload.';
        return;
      }
      try {
        var session = JSON.parse(raw);
        localStorage.setItem('arc_session', JSON.stringify(session));
        localStorage.setItem('arc_skip_intro', 'true');
        localStorage.setItem('arc_intro_played', '1');
        status.textContent = 'Signed in as ' + session.username + '. Opening the game…';
        setTimeout(function () { location.replace('/'); }, 600);
      } catch (e) {
        status.textContent = 'Could not read the session.';
        detail.textContent = String(e);
      }
    })();
  </script>
</body>
</html>
