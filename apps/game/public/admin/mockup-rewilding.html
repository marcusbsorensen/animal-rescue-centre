<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Rewilding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&family=Kalam:wght@400;700&family=Gochi+Hand&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream-wash: #fef9ef;
    --garden-green: #2E8B57;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --trellis-brown: #7b5c3a;
    --ink: #3a3a3a;
    --ink-soft: #6b6b6b;
    --headline-font: 'Fredoka', system-ui, sans-serif;
    --body-font: 'Quicksand', system-ui, sans-serif;
    --sign-font: 'Chalkboard SE', 'Chalkboard', 'Kalam', 'Gochi Hand', 'Patrick Hand', var(--headline-font);
    --sign-title-font: 'Chalkboard SE', 'Chalkboard', 'Gochi Hand', 'Kalam', var(--headline-font);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #222; }
  body { font-family: var(--body-font); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; }
  body.embed { background: #fef9ef; }
  body.embed .vp-bar { display: none; }
  body.embed .device-frame { padding: 0; overflow: hidden; flex: 1; }
  body.embed .device {
    width: 100% !important; height: 100% !important;
    border-radius: 0 !important; box-shadow: none !important;
  }

  /* mock toolbar */
  .vp-bar {
    background: #2a2a2a; color: #fff;
    padding: 6px 12px; font-size: 11px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  .vp-bar button {
    background: #444; color: #fff; border: 1px solid #555;
    padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit;
  }
  .vp-bar button.on { background: var(--honey-amber); color: var(--ink); border-color: var(--honey-amber); }
  .vp-bar .hint { color: #aaa; margin-left: auto; font-style: italic; }
  .vp-bar a { color: #8fd3ff; margin-left: 12px; }

  .device-frame {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .device {
    background: var(--cream-wash);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
    transition: width 0.3s, height 0.3s;
    flex-shrink: 0;
  }
  .device[data-size="iphone"]    { width: 390px;  height: 844px; }
  .device[data-size="ipad-p"]    { width: 768px;  height: 1024px; }
  .device[data-size="ipad-l"]    { width: 1024px; height: 768px; }
  .device[data-size="desktop"]   { width: 1280px; height: 800px; }

  /* ── Rewilding cinematic takeover ── */
  .rewild {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
    container-type: size;
    container-name: rewild;
  }
  /* Wilderness background — warm saturation bump, not a dim wash. The new
     home should look inviting and luminous, not melancholy. */
  .rewild::before {
    content: ''; position: absolute; inset: 0;
    background-image: url('/assets/bg/garden-lawn-summer-evening.png');
    background-size: cover; background-position: center;
    filter: saturate(1.25) brightness(1.05) contrast(1.03);
    transform: scale(1.04);
    z-index: 0;
  }
  /* Soft golden-hour haze — adds depth without dimming. */
  .rewild::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255, 220, 140, 0.25) 0%, transparent 60%),
      linear-gradient(180deg, rgba(255, 200, 120, 0.10) 0%, transparent 40%, rgba(80, 50, 20, 0.12) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .rewild-inner {
    position: relative; z-index: 5;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.2cqh, 14px);
    padding: clamp(10px, 2cqh, 20px) clamp(16px, 4cqw, 34px);
    overflow: hidden;
  }

  /* ── Ambient: drifting leaves across the viewport ── */
  .leaf {
    position: absolute;
    font-size: clamp(18px, 2.6cqh, 28px);
    line-height: 1;
    opacity: 0.85;
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.2));
    will-change: transform;
  }
  @keyframes leafDrift {
    0%   { transform: translate(-6cqw, -10cqh) rotate(-20deg); opacity: 0; }
    8%   { opacity: 0.9; }
    50%  { transform: translate(40cqw, 50cqh) rotate(140deg); opacity: 0.85; }
    92%  { opacity: 0.7; }
    100% { transform: translate(110cqw, 110cqh) rotate(320deg); opacity: 0; }
  }
  .leaf-1 { top: -5%;  left: 10%; animation: leafDrift 16s linear infinite; animation-delay: 0s; }
  .leaf-2 { top: -8%;  left: 35%; animation: leafDrift 22s linear infinite; animation-delay: -4s; font-size: clamp(14px, 2cqh, 22px); }
  .leaf-3 { top: -10%; left: 60%; animation: leafDrift 19s linear infinite; animation-delay: -8s; }
  .leaf-4 { top: -6%;  left: 82%; animation: leafDrift 24s linear infinite; animation-delay: -2s; font-size: clamp(16px, 2.3cqh, 24px); }
  .leaf-5 { top: -12%; left: 5%;  animation: leafDrift 21s linear infinite; animation-delay: -11s; font-size: clamp(12px, 1.8cqh, 20px); }
  .leaf-6 { top: -7%;  left: 48%; animation: leafDrift 26s linear infinite; animation-delay: -14s; }

  /* Distant bird silhouettes */
  .bird {
    position: absolute;
    top: 18%;
    color: rgba(40, 28, 18, 0.55);
    font-family: var(--headline-font);
    font-size: clamp(10px, 1.4cqh, 14px);
    letter-spacing: -2px;
    z-index: 2;
    pointer-events: none;
    animation: birdGlide 30s linear infinite;
  }
  .bird-1 { left: 12%; top: 16%; animation-delay: 0s; }
  .bird-2 { left: 28%; top: 12%; animation-delay: -10s; opacity: 0.7; }
  .bird-3 { left: 46%; top: 18%; animation-delay: -20s; opacity: 0.6; }
  @keyframes birdGlide {
    0%   { transform: translateX(0) translateY(0); }
    50%  { transform: translateX(40cqw) translateY(-1cqh); }
    100% { transform: translateX(85cqw) translateY(0); }
  }

  /* ── Farewell plaque ── */
  .farewell-plaque {
    position: relative;
    width: min(92%, 480px);
    padding: clamp(18px, 3cqh, 28px) clamp(18px, 3cqw, 28px) clamp(22px, 3.4cqh, 32px);
    background:
      linear-gradient(180deg,
        transparent 0%, transparent 19%,
        rgba(0,0,0,0.32) 19.5%, rgba(0,0,0,0.32) 20%,
        rgba(255,240,210,0.18) 20.3%, transparent 20.8%,
        transparent 79%,
        rgba(0,0,0,0.32) 79.5%, rgba(0,0,0,0.32) 80%,
        rgba(255,240,210,0.18) 80.3%, transparent 80.8%,
        transparent 100%),
      linear-gradient(90deg,
        transparent 0%, transparent 24%,
        rgba(0,0,0,0.05) 25%, transparent 26%, transparent 49%,
        rgba(0,0,0,0.06) 50%, transparent 51%, transparent 74%,
        rgba(0,0,0,0.05) 75%, transparent 76%),
      linear-gradient(180deg, #c49464 0%, #a8723a 45%, #8b5822 100%);
    border: 3px solid #8a5a2a;
    border-radius: 12px;
    box-shadow:
      0 12px 28px rgba(0,0,0,0.5),
      inset 0 0 24px rgba(0,0,0,0.25),
      inset 0 3px 0 rgba(255,240,210,0.2);
    transform: rotate(-0.6deg);
    z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    animation: plaqueDrop 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes plaqueDrop {
    0%   { transform: translateY(-40px) rotate(-3deg); opacity: 0; }
    60%  { transform: translateY(4px)   rotate(0.5deg); opacity: 1; }
    100% { transform: translateY(0)     rotate(-0.6deg); opacity: 1; }
  }
  .farewell-plaque::before, .farewell-plaque::after {
    content: '';
    position: absolute; top: 10px;
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7b604a 0%, #3c2a18 70%, #1f140a 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .farewell-plaque::before { left: 12px; }
  .farewell-plaque::after  { right: 12px; }

  .farewell-title {
    font-family: var(--sign-title-font);
    font-weight: 700;
    font-size: clamp(26px, 4.4cqh, 38px);
    letter-spacing: 0.02em;
    text-align: center;
    background: linear-gradient(180deg, #ffe08a 0%, #f5b63a 55%, #c78c1a 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px rgba(45, 25, 8, 0.85);
    paint-order: stroke fill;
    filter: drop-shadow(1px 2px 0 rgba(45,25,8,0.5));
    line-height: 1.1;
    margin-bottom: clamp(4px, 0.8cqh, 8px);
  }
  .farewell-subtitle {
    font-family: 'Caveat', 'Kalam', cursive;
    font-style: italic;
    font-weight: 700;
    color: #fffbe8;
    font-size: clamp(18px, 2.6cqh, 24px);
    text-shadow: 1px 2px 0 rgba(0,0,0,0.45);
    text-align: center;
    margin-bottom: clamp(10px, 1.8cqh, 16px);
    line-height: 1.2;
  }

  /* Portrait frame — wooden border + drop shadow, same family as arc-snapshot */
  .portrait-wrap {
    display: flex; justify-content: center;
    padding: clamp(2px, 0.6cqh, 6px) 0 clamp(4px, 0.8cqh, 10px);
  }
  .portrait-frame {
    position: relative;
    width: 100%;
    max-width: clamp(200px, 48cqw, 320px);
    aspect-ratio: 4 / 3;
    border-radius: clamp(6px, 1cqh, 10px);
    border: clamp(3px, 0.5cqh, 5px) solid #7a4b15;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255,210,140,0.35) 0%, transparent 65%),
      linear-gradient(180deg, #f8e9c8 0%, #e6c893 55%, #c9a369 100%);
    box-shadow:
      0 6px 14px rgba(0,0,0,0.45),
      inset 0 2px 0 rgba(255,240,210,0.4),
      inset 0 0 0 2px rgba(120, 80, 30, 0.25);
    overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 8% 6%;
  }
  .portrait-frame::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 28%;
    background:
      linear-gradient(180deg, rgba(120,170,80,0.0) 0%, rgba(95,150,70,0.55) 70%, rgba(70,120,50,0.7) 100%);
  }
  .portrait-animal {
    position: relative;
    height: 78%;
    width: auto;
    filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.35));
    z-index: 2;
    animation: trotAway 3.2s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes trotAway {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-3px) rotate(1deg); }
  }

  /* Scroll card — cream paper, rotated, handwritten Caveat text */
  .scroll-card {
    position: relative;
    margin-top: clamp(8px, 1.4cqh, 14px);
    width: min(100%, 380px);
    padding: clamp(14px, 2.2cqh, 20px) clamp(18px, 3cqw, 26px) clamp(28px, 3.8cqh, 38px);
    background:
      radial-gradient(ellipse 30px 10px at 10% 96%, rgba(160,110,60,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 40px 12px at 92% 8%, rgba(160,110,60,0.2) 0%, transparent 70%),
      linear-gradient(180deg, #fff8e3 0%, #fbecc2 100%);
    border: 1px solid rgba(140, 100, 50, 0.35);
    border-radius: 4px;
    box-shadow:
      0 4px 10px rgba(0,0,0,0.35),
      inset 0 0 20px rgba(160,110,60,0.12);
    transform: rotate(-2.2deg);
    font-family: 'Caveat', 'Kalam', cursive;
    font-weight: 500;
    font-size: clamp(15px, 2.1cqh, 19px);
    line-height: 1.35;
    color: #4a2e14;
    text-align: left;
  }
  .scroll-card .scroll-sign {
    display: block;
    margin-top: clamp(4px, 0.8cqh, 8px);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-style: italic;
    color: #6b3a18;
    font-size: clamp(16px, 2.3cqh, 21px);
  }
  .scroll-card .paw-stamp {
    position: absolute;
    right: clamp(10px, 2cqw, 18px);
    bottom: clamp(4px, 0.8cqh, 10px);
    font-size: clamp(18px, 2.8cqh, 26px);
    opacity: 0.55;
    transform: rotate(14deg);
    color: #6b3a18;
    filter: sepia(0.6);
  }

  /* ── Bond panel ── */
  .bond-panel {
    width: min(92%, 420px);
    margin-top: 0;
    padding: clamp(10px, 1.8cqh, 16px) clamp(14px, 2.6cqw, 22px);
    background: linear-gradient(180deg, #fff2d0 0%, #f4dba0 60%, #d9b874 100%);
    border: 2px solid #8a5a2a;
    border-radius: 14px;
    box-shadow:
      0 5px 12px rgba(0,0,0,0.35),
      inset 0 2px 0 rgba(255,255,230,0.4),
      inset 0 -2px 0 rgba(120, 80, 30, 0.2);
    transform: rotate(0.5deg);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(4px, 0.7cqh, 8px);
    z-index: 18;
    position: relative;
  }
  .bond-row {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(8px, 1.4cqw, 12px);
    flex-wrap: wrap;
  }
  .bond-medal {
    font-size: clamp(28px, 4.2cqh, 38px);
    line-height: 1;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));
  }
  .bond-label {
    font-family: var(--sign-title-font);
    font-weight: 700;
    font-size: clamp(18px, 2.6cqh, 22px);
    color: #3a2618;
    text-shadow: 1px 1px 0 rgba(255,240,210,0.5);
  }
  .bond-remember {
    font-family: var(--sign-font);
    font-weight: 700;
    font-size: clamp(14px, 2cqh, 17px);
    color: #2f6a32;
    display: inline-flex; align-items: center; gap: 6px;
    text-shadow: 1px 1px 0 rgba(255,240,210,0.6);
  }
  .bond-visit {
    font-family: 'Caveat', 'Kalam', cursive;
    font-style: italic;
    font-size: clamp(13px, 1.8cqh, 16px);
    color: #6b4820;
    opacity: 0.92;
  }

  /* ── Primary release button ── */
  .release-wrap {
    width: min(92%, 480px);
    margin-top: 0;
    position: relative;
    z-index: 19;
  }
  .btn-primary {
    width: 100%;
    padding: clamp(14px, 2.6cqh, 22px) clamp(20px, 3.4cqw, 30px);
    font-family: var(--sign-title-font);
    font-size: clamp(18px, 3cqh, 26px); font-weight: 700;
    color: #fffbe8;
    text-shadow: 2px 3px 0 rgba(0,0,0,0.5);
    background:
      linear-gradient(180deg,
        transparent 0%, transparent 32%,
        rgba(0,0,0,0.32) 32.5%, rgba(0,0,0,0.32) 33%,
        rgba(255,240,210,0.2) 33.3%, transparent 33.9%,
        transparent 66%,
        rgba(0,0,0,0.32) 66.5%, rgba(0,0,0,0.32) 67%,
        rgba(255,240,210,0.2) 67.3%, transparent 67.9%,
        transparent 100%),
      linear-gradient(90deg,
        transparent 0%, transparent 32%,
        rgba(0,0,0,0.07) 33%, transparent 34%, transparent 65%,
        rgba(0,0,0,0.07) 66%, transparent 67%),
      linear-gradient(180deg, #e7a84a 0%, #c88436 50%, #a2651c 100%);
    border: clamp(2px, 0.3cqh, 3px) solid #9a6528;
    border-radius: clamp(6px, 0.8cqh, 10px);
    cursor: pointer;
    box-shadow:
      inset 0 0 clamp(14px, 2.5cqh, 24px) rgba(0,0,0,0.25),
      inset 0 clamp(2px, 0.4cqh, 3px) 0 rgba(255,240,210,0.25),
      0 clamp(5px, 1cqh, 10px) clamp(10px, 2cqh, 16px) rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 1.8cqw, 16px);
    transition: transform 0.1s;
    transform: rotate(0.6deg);
    position: relative;
    letter-spacing: 0.02em;
  }
  .btn-primary::before, .btn-primary::after {
    content: '';
    position: absolute;
    width: clamp(7px, 1.2cqh, 10px);
    height: clamp(7px, 1.2cqh, 10px);
    background: radial-gradient(circle at 30% 30%, #7b604a 0%, #3c2a18 70%, #1f140a 100%);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .btn-primary::before { top: clamp(6px, 1cqh, 9px); left: clamp(8px, 1.2cqw, 12px); }
  .btn-primary::after  { top: clamp(6px, 1cqh, 9px); right: clamp(8px, 1.2cqw, 12px); }
  .btn-primary .leaf-flank {
    font-size: clamp(28px, 4.6cqh, 40px);
    line-height: 1;
    text-shadow: none;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.35));
    display: inline-block;
    transform-origin: bottom center;
  }
  .btn-primary .leaf-left  { transform: rotate(-14deg); }
  .btn-primary .leaf-right { transform: rotate(14deg) scaleX(-1); }
  .btn-primary:hover .leaf-left,
  .btn-primary.fluttering .leaf-left  { animation: leafFlutterL 0.45s ease-in-out infinite alternate; }
  .btn-primary:hover .leaf-right,
  .btn-primary.fluttering .leaf-right { animation: leafFlutterR 0.45s ease-in-out infinite alternate; }
  @keyframes leafFlutterL {
    0%   { transform: rotate(-14deg) translateY(0); }
    100% { transform: rotate(-4deg)  translateY(-6px); }
  }
  @keyframes leafFlutterR {
    0%   { transform: rotate(14deg)  scaleX(-1) translateY(0); }
    100% { transform: rotate(4deg)   scaleX(-1) translateY(-6px); }
  }
  .btn-primary:active { transform: rotate(0.6deg) translateY(2px); }

  /* Secondary "Not yet" pill */
  .secondary-row {
    margin-top: 0;
    display: flex; justify-content: center;
    z-index: 19; position: relative;
  }
  .link-btn {
    position: relative;
    cursor: pointer;
    font-family: var(--sign-font);
    font-weight: 700;
    font-size: clamp(13px, 1.8cqh, 17px);
    color: #fffbe8;
    text-shadow: 1px 2px 0 rgba(0,0,0,0.5);
    text-decoration: none;
    border-radius: 999px;
    padding: clamp(8px, 1.4cqh, 12px) clamp(18px, 3cqw, 28px);
    box-shadow:
      inset 0 0 clamp(8px, 1.4cqh, 14px) rgba(0,0,0,0.22),
      inset 0 clamp(1px, 0.3cqh, 2px) 0 rgba(255,240,210,0.22),
      0 clamp(3px, 0.6cqh, 6px) clamp(6px, 1.2cqh, 10px) rgba(0,0,0,0.28);
    border: clamp(2px, 0.35cqh, 3px) solid #3c5238;
    background:
      linear-gradient(90deg,
        transparent 0%, transparent 28%,
        rgba(0,0,0,0.08) 29%, transparent 30%, transparent 57%,
        rgba(0,0,0,0.07) 58%, transparent 59%, transparent 82%,
        rgba(0,0,0,0.08) 83%, transparent 84%),
      radial-gradient(ellipse 12px 7px at 72% 30%, rgba(145,100,55,0.75) 0%, transparent 70%),
      radial-gradient(ellipse 10px 6px at 30% 78%, rgba(145,100,55,0.7) 0%, transparent 70%),
      linear-gradient(180deg, #7ea063 0%, #5d7f4a 50%, #3f5d32 100%);
  }
  .link-btn::before,
  .link-btn::after {
    content: '';
    position: absolute;
    top: 50%;
    width: clamp(5px, 0.9cqw, 7px);
    height: clamp(5px, 0.9cqw, 7px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #6b6b6b 0%, #2a2a2a 70%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.15), inset -1px -1px 1px rgba(0,0,0,0.4);
    transform: translateY(-50%);
  }
  .link-btn::before { left: clamp(8px, 1.4cqw, 12px); }
  .link-btn::after  { right: clamp(8px, 1.4cqw, 12px); }

  /* Wide layout — desktop / iPad L */
  @container rewild (min-width: 900px) {
    .farewell-plaque { width: min(620px, 80%); }
    .bond-panel { width: min(520px, 70%); }
    .release-wrap { width: min(520px, 70%); }
  }

  /* Narrow layout — iPhone */
  @container rewild (max-width: 420px) {
    .rewild-inner { gap: clamp(6px, 1.2cqh, 10px); padding: 10px; }
    .farewell-title { font-size: clamp(22px, 3.8cqh, 28px); }
    .portrait-frame { max-width: clamp(180px, 56cqw, 240px); }
  }
</style>
</head>
<body>

<div class="vp-bar">
  <strong>Rewilding ceremony v1</strong>
  <span>·</span>
  <button data-size="iphone">📱 iPhone (390×844)</button>
  <button data-size="ipad-p" class="on">📱 iPad P (768×1024)</button>
  <button data-size="ipad-l">📱 iPad L (1024×768)</button>
  <button data-size="desktop">🖥 Desktop (1280×800)</button>
  <a href="/admin/mockup-conflict.html">→ Conflict popup</a>
  <span class="hint">(cinematic release — love means letting go)</span>
</div>

<div class="device-frame">
  <div class="device" id="device" data-size="ipad-p">
    <div class="rewild">

      <!-- Distant birds -->
      <span class="bird bird-1" aria-hidden="true">✦ ✦</span>
      <span class="bird bird-2" aria-hidden="true">✦ ✦</span>
      <span class="bird bird-3" aria-hidden="true">✦</span>

      <!-- Drifting leaves -->
      <span class="leaf leaf-1" aria-hidden="true">🍃</span>
      <span class="leaf leaf-2" aria-hidden="true">🍃</span>
      <span class="leaf leaf-3" aria-hidden="true">🍃</span>
      <span class="leaf leaf-4" aria-hidden="true">🍃</span>
      <span class="leaf leaf-5" aria-hidden="true">🍃</span>
      <span class="leaf leaf-6" aria-hidden="true">🍃</span>

      <div class="rewild-inner">

        <div class="farewell-plaque" role="dialog" aria-labelledby="farewell-title">
          <div class="farewell-title" id="farewell-title">Farewell, Luna</div>
          <div class="farewell-subtitle">A wild heart ready for wild skies</div>

          <div class="portrait-wrap">
            <div class="portrait-frame">
              <img class="portrait-animal" src="/assets/animals/fox-red-walking.png" alt="Luna the red fox trotting off into the wild">
            </div>
          </div>

          <div class="scroll-card">
            <span id="scroll-body"></span>
            <span class="scroll-sign" id="scroll-sign"></span>
            <span class="paw-stamp" aria-hidden="true">🐾</span>
          </div>
        </div>

        <div class="bond-panel">
          <div class="bond-row">
            <span class="bond-medal" aria-hidden="true">🏆</span>
            <span class="bond-label">Bond: Champion</span>
          </div>
          <div class="bond-remember">
            Luna will remember you
            <span aria-hidden="true">💚</span>
          </div>
          <div class="bond-visit">Visit her wild home any time</div>
        </div>

        <div class="release-wrap">
          <button class="btn-primary" id="release-btn" type="button">
            <span class="leaf-flank leaf-left" aria-hidden="true">🌿</span>
            <span>RELEASE HER TO THE WILD</span>
            <span class="leaf-flank leaf-right" aria-hidden="true">🌿</span>
          </button>
        </div>

        <div class="secondary-row">
          <button class="link-btn" id="not-yet-btn" type="button">← Not yet</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  // Populate scroll text via textContent — no innerHTML with untrusted strings.
  (function fillScroll() {
    const body = document.getElementById('scroll-body');
    const sign = document.getElementById('scroll-sign');
    if (body) {
      body.textContent =
        "Dear Lily, thank you for teaching me to trust people again. " +
        "I'll come running if you visit my meadow.";
    }
    if (sign) {
      sign.textContent = "Your friend always — Luna";
    }
  })();

  // Viewport size switcher
  const device = document.getElementById('device');
  for (const btn of document.querySelectorAll('.vp-bar button[data-size]')) {
    btn.addEventListener('click', () => {
      for (const b of document.querySelectorAll('.vp-bar button[data-size]')) b.classList.remove('on');
      btn.classList.add('on');
      device.dataset.size = btn.dataset.size;
    });
  }

  // Embed mode — postMessage up to the host scene.
  const params = new URLSearchParams(location.search);
  const isEmbed = params.has('embed');
  if (isEmbed) document.body.classList.add('embed');

  const send = (type, payload) => {
    try {
      parent.postMessage(
        Object.assign({ source: 'arc-rewild', type }, payload || {}),
        '*'
      );
    } catch (_) {}
  };

  const releaseBtn = document.getElementById('release-btn');
  const notYetBtn  = document.getElementById('not-yet-btn');

  releaseBtn?.addEventListener('click', () => {
    releaseBtn.classList.add('fluttering');
    setTimeout(() => releaseBtn.classList.remove('fluttering'), 1400);
    if (isEmbed) send('rewild-confirm', { animalId: 'luna-1' });
  });

  notYetBtn?.addEventListener('click', () => {
    if (isEmbed) send('rewild-cancel');
  });
</script>
</body>
</html>
