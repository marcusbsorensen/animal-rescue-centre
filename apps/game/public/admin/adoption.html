<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Adoption</title>
<script>
  // Iframe-context detection — flips html.iframed before first paint
  // so the design-preview chrome (vp-bar) is hidden in-game even if
  // the embed-mode JS toggle hasn't run yet.
  if (window.top !== window.self) document.documentElement.classList.add('iframed');
</script>
    <link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    --cream-wash: #fef9ef;
    --garden-green: #2E8B57;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --trellis-brown: #7b5c3a;
    --ink: #3a3a3a;
    --ink-soft: #6b6b6b;
    --headline-font: 'Fredoka', system-ui, sans-serif;
    --body-font: 'Quicksand', system-ui, sans-serif;
    --sign-font: 'Kalam', 'Gochi Hand', var(--headline-font);
    --sign-title-font: 'Gochi Hand', 'Kalam', var(--headline-font);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #222; }
  body { font-family: var(--body-font); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; }
  body.embed { background: #fef9ef; }
  body.embed .vp-bar { display: none; }
  body.embed .device-frame { padding: 0; overflow: hidden; flex: 1; }
  body.embed .device {
    width: 100% !important; height: 100% !important;
    border-radius: 0 !important; box-shadow: none !important;
  }
  /* Belt-and-braces: when iframed, hide design-preview chrome
     unconditionally regardless of script readiness. */
  html.iframed body .vp-bar { display: none !important; }
  html.iframed body { background: #fef9ef !important; }
  html.iframed body .device-frame { padding: 0 !important; overflow: hidden !important; flex: 1 !important; }
  html.iframed body .device {
    width: 100% !important; height: 100% !important;
    border-radius: 0 !important; box-shadow: none !important;
  }


  /* mock toolbar */
  .vp-bar {
    background: #2a2a2a; color: #fff;
    padding: 6px 12px; font-size: 11px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-family: ui-monospace, Menlo, monospace;
  }
  .vp-bar button {
    background: #444; color: #fff; border: 1px solid #555;
    padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: inherit;
  }
  .vp-bar button.on { background: var(--honey-amber); color: var(--ink); border-color: var(--honey-amber); }
  .vp-bar .hint { color: #aaa; margin-left: auto; font-style: italic; }
  .vp-bar a { color: #8fd3ff; margin-left: 12px; }

  .device-frame {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow: auto;
  }
  .device {
    background: var(--cream-wash);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
    transition: width 0.3s, height 0.3s;
    flex-shrink: 0;
  }
  .device[data-size="iphone"]    { width: 390px;  height: 844px; }
  .device[data-size="ipad-p"]    { width: 768px;  height: 1024px; }
  .device[data-size="ipad-l"]    { width: 1024px; height: 768px; }
  .device[data-size="desktop"]   { width: 1280px; height: 800px; }

  /* ── Adoption cinematic takeover ── */
  .adopt {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
    container-type: size;
    container-name: adopt;
  }
  .adopt::before {
    content: ''; position: absolute; inset: 0;
    background-image: url('/assets/bg/garden-lawn-summer-morning.png');
    background-size: cover; background-position: center;
    filter: saturate(1.35) brightness(1.1) contrast(1.04);
    transform: scale(1.04);
    z-index: 0;
  }
  .adopt::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 25%, rgba(255, 230, 240, 0.30) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(255, 220, 200, 0.22) 0%, transparent 55%),
      linear-gradient(180deg, rgba(255, 240, 220, 0.12) 0%, transparent 40%, rgba(60, 40, 70, 0.08) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .adopt-inner {
    position: relative; z-index: 5;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.2cqh, 14px);
    padding: clamp(10px, 2cqh, 20px) clamp(16px, 4cqw, 34px);
    overflow: hidden;
  }

  /* ── Ambient: drifting petals + sparkles ── */
  .petal, .sparkle {
    position: absolute;
    line-height: 1;
    pointer-events: none;
    z-index: 3;
    will-change: transform;
  }
  .petal {
    font-size: clamp(18px, 2.6cqh, 28px);
    opacity: 0.85;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15));
  }
  .sparkle {
    font-size: clamp(14px, 2.2cqh, 22px);
    opacity: 0.9;
    filter: drop-shadow(0 0 6px rgba(255,220,140,0.6));
  }
  @keyframes petalDrift {
    0%   { transform: translate(-4cqw, -10cqh) rotate(-20deg); opacity: 0; }
    8%   { opacity: 0.9; }
    50%  { transform: translate(30cqw, 55cqh) rotate(120deg); opacity: 0.85; }
    92%  { opacity: 0.6; }
    100% { transform: translate(95cqw, 115cqh) rotate(280deg); opacity: 0; }
  }
  @keyframes sparkleFloat {
    0%   { transform: translate(0, 0) scale(0.7); opacity: 0; }
    15%  { opacity: 1; transform: translate(2cqw, -4cqh) scale(1); }
    50%  { opacity: 0.95; transform: translate(-3cqw, -20cqh) scale(1.15); }
    85%  { opacity: 0.8; }
    100% { transform: translate(4cqw, -40cqh) scale(0.6); opacity: 0; }
  }
  .petal-1 { top: -6%;  left: 14%; animation: petalDrift 18s linear infinite; animation-delay: 0s; }
  .petal-2 { top: -9%;  left: 42%; animation: petalDrift 23s linear infinite; animation-delay: -5s; font-size: clamp(14px, 2cqh, 22px); }
  .petal-3 { top: -11%; left: 66%; animation: petalDrift 20s linear infinite; animation-delay: -10s; }
  .petal-4 { top: -7%;  left: 85%; animation: petalDrift 26s linear infinite; animation-delay: -3s; font-size: clamp(16px, 2.3cqh, 24px); }

  .sparkle-1 { top: 78%; left: 12%; animation: sparkleFloat 6s ease-in-out infinite; animation-delay: 0s; }
  .sparkle-2 { top: 82%; left: 32%; animation: sparkleFloat 7.5s ease-in-out infinite; animation-delay: -1.2s; }
  .sparkle-3 { top: 74%; left: 55%; animation: sparkleFloat 5.5s ease-in-out infinite; animation-delay: -2.4s; }
  .sparkle-4 { top: 80%; left: 72%; animation: sparkleFloat 8s ease-in-out infinite; animation-delay: -3.5s; }
  .sparkle-5 { top: 86%; left: 88%; animation: sparkleFloat 6.5s ease-in-out infinite; animation-delay: -4.8s; }
  .sparkle-6 { top: 70%; left: 44%; animation: sparkleFloat 7s ease-in-out infinite; animation-delay: -0.6s; }

  /* ── Adoption plaque ── */
  .adopt-plaque {
    position: relative;
    width: min(94%, 540px);
    padding: clamp(18px, 3cqh, 28px) clamp(18px, 3cqw, 28px) clamp(22px, 3.4cqh, 32px);
    background:
      linear-gradient(180deg,
        transparent 0%, transparent 19%,
        rgba(0,0,0,0.32) 19.5%, rgba(0,0,0,0.32) 20%,
        rgba(255,240,210,0.18) 20.3%, transparent 20.8%,
        transparent 79%,
        rgba(0,0,0,0.32) 79.5%, rgba(0,0,0,0.32) 80%,
        rgba(255,240,210,0.18) 80.3%, transparent 80.8%,
        transparent 100%),
      linear-gradient(90deg,
        transparent 0%, transparent 24%,
        rgba(0,0,0,0.05) 25%, transparent 26%, transparent 49%,
        rgba(0,0,0,0.06) 50%, transparent 51%, transparent 74%,
        rgba(0,0,0,0.05) 75%, transparent 76%),
      linear-gradient(180deg, #c49464 0%, #a8723a 45%, #8b5822 100%);
    border: 3px solid #8a5a2a;
    border-radius: 12px;
    box-shadow:
      0 12px 28px rgba(0,0,0,0.5),
      inset 0 0 24px rgba(0,0,0,0.25),
      inset 0 3px 0 rgba(255,240,210,0.2);
    transform: rotate(-0.6deg);
    z-index: 20;
    display: flex; flex-direction: column; align-items: center;
    animation: plaqueDrop 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes plaqueDrop {
    0%   { transform: translateY(-40px) rotate(-3deg); opacity: 0; }
    60%  { transform: translateY(4px)   rotate(0.5deg); opacity: 1; }
    100% { transform: translateY(0)     rotate(-0.6deg); opacity: 1; }
  }
  .adopt-plaque::before, .adopt-plaque::after {
    content: '';
    position: absolute; top: 10px;
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7b604a 0%, #3c2a18 70%, #1f140a 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .adopt-plaque::before { left: 12px; }
  .adopt-plaque::after  { right: 12px; }

  .adopt-title {
    font-family: var(--sign-title-font);
    font-weight: 700;
    font-size: clamp(26px, 4.4cqh, 38px);
    letter-spacing: 0.02em;
    text-align: center;
    background: linear-gradient(180deg, #ffe08a 0%, #f5b63a 55%, #c78c1a 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px rgba(45, 25, 8, 0.85);
    paint-order: stroke fill;
    filter: drop-shadow(1px 2px 0 rgba(45,25,8,0.5));
    line-height: 1.1;
    margin-bottom: clamp(4px, 0.8cqh, 8px);
  }
  .adopt-subtitle {
    font-family: 'Caveat', 'Kalam', cursive;
    font-style: italic;
    font-weight: 700;
    color: #fffbe8;
    font-size: clamp(18px, 2.6cqh, 24px);
    text-shadow: 1px 2px 0 rgba(0,0,0,0.45);
    text-align: center;
    margin-bottom: clamp(10px, 1.8cqh, 16px);
    line-height: 1.2;
  }

  /* Side-by-side portrait row */
  .portrait-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.4cqw, 14px);
    width: 100%;
    padding: clamp(2px, 0.6cqh, 6px) 0 clamp(4px, 0.8cqh, 10px);
  }
  .portrait-frame {
    position: relative;
    flex: 1 1 0;
    max-width: clamp(140px, 34cqw, 220px);
    aspect-ratio: 4 / 3;
    border-radius: clamp(6px, 1cqh, 10px);
    border: clamp(3px, 0.5cqh, 5px) solid #7a4b15;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255,210,140,0.35) 0%, transparent 65%),
      linear-gradient(180deg, #f8e9c8 0%, #e6c893 55%, #c9a369 100%);
    box-shadow:
      0 6px 14px rgba(0,0,0,0.45),
      inset 0 2px 0 rgba(255,240,210,0.4),
      inset 0 0 0 2px rgba(120, 80, 30, 0.25);
    overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 8% 6%;
  }
  .portrait-frame::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 28%;
    background:
      linear-gradient(180deg, rgba(180,210,150,0.0) 0%, rgba(140,190,120,0.5) 70%, rgba(100,160,90,0.65) 100%);
  }
  .portrait-animal {
    position: relative;
    height: 82%;
    width: auto;
    filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.35));
    z-index: 2;
    animation: bounceHappy 2.4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes bounceHappy {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-4px) rotate(1.5deg); }
  }
  .portrait-family { padding: 0; }
  .portrait-family .portrait-animal {
    animation: sway 3.6s ease-in-out infinite;
    height: 100%;
    width: 100%;
    object-fit: cover;
  }
  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(0.6deg); }
    50%      { transform: translateY(-2px) rotate(-0.6deg); }
  }
  .family-fallback {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Quicksand', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.15px;
    color: #4a2e14;
    font-size: clamp(14px, 1.7cqh, 16px);
    line-height: 1.25;
    padding: 8% 10%;
  }
  .family-fallback .ff-emoji { font-size: clamp(24px, 3.6cqh, 34px); display: block; margin-bottom: 4px; }

  /* Meet-in-the-middle connector */
  .meet-connector {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    flex: 0 0 auto;
    min-width: clamp(60px, 14cqw, 110px);
  }
  .meet-spark {
    font-size: clamp(22px, 3.4cqh, 32px);
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(255,220,140,0.8));
    animation: sparkPulse 1.8s ease-in-out infinite;
  }
  @keyframes sparkPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.25); opacity: 1; }
  }
  .meet-label {
    font-family: 'Quicksand', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.2px;
    color: #fffbe8;
    font-size: clamp(14px, 1.7cqh, 15px);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    text-align: center;
    line-height: 1.2;
  }

  /* Scroll card */
  .scroll-card {
    position: relative;
    margin-top: clamp(8px, 1.4cqh, 14px);
    width: min(100%, 420px);
    padding: clamp(14px, 2.2cqh, 20px) clamp(18px, 3cqw, 26px) clamp(28px, 3.8cqh, 38px);
    background:
      radial-gradient(ellipse 30px 10px at 10% 96%, rgba(160,110,60,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 40px 12px at 92% 8%, rgba(160,110,60,0.2) 0%, transparent 70%),
      linear-gradient(180deg, #fff8e3 0%, #fbecc2 100%);
    border: 1px solid rgba(140, 100, 50, 0.35);
    border-radius: 4px;
    box-shadow:
      0 4px 10px rgba(0,0,0,0.35),
      inset 0 0 20px rgba(160,110,60,0.12);
    transform: rotate(-2.2deg);
    font-family: 'Caveat', 'Kalam', cursive;
    font-weight: 500;
    font-size: clamp(15px, 2.1cqh, 19px);
    line-height: 1.35;
    color: #4a2e14;
    text-align: left;
  }
  .scroll-card .scroll-sign {
    display: block;
    margin-top: clamp(4px, 0.8cqh, 8px);
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-style: italic;
    color: #6b3a18;
    font-size: clamp(16px, 2.3cqh, 21px);
  }
  .scroll-card .paw-stamp {
    position: absolute;
    right: clamp(10px, 2cqw, 18px);
    bottom: clamp(4px, 0.8cqh, 10px);
    font-size: clamp(18px, 2.8cqh, 26px);
    opacity: 0.55;
    transform: rotate(14deg);
    color: #6b3a18;
    filter: sepia(0.6);
  }

  /* ── Thank-you gifts panel ── */
  .gifts-panel {
    width: min(92%, 480px);
    margin-top: 0;
    padding: clamp(10px, 1.8cqh, 16px) clamp(14px, 2.6cqw, 22px);
    background: linear-gradient(180deg, #fff2d0 0%, #f4dba0 60%, #d9b874 100%);
    border: 2px solid #8a5a2a;
    border-radius: 14px;
    box-shadow:
      0 5px 12px rgba(0,0,0,0.35),
      inset 0 2px 0 rgba(255,255,230,0.4),
      inset 0 -2px 0 rgba(120, 80, 30, 0.2);
    transform: rotate(0.5deg);
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(6px, 1cqh, 10px);
    z-index: 18;
    position: relative;
  }
  .gifts-title {
    font-family: var(--sign-title-font);
    font-weight: 700;
    font-size: clamp(15px, 2.2cqh, 19px);
    color: #3a2618;
    text-shadow: 1px 1px 0 rgba(255,240,210,0.5);
  }
  .gifts-row {
    display: flex; align-items: flex-start; justify-content: center;
    gap: clamp(10px, 2cqw, 20px);
    flex-wrap: nowrap;
  }
  .gift {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(4px, 0.6cqh, 6px);
    flex: 1 1 0;
    min-width: 0;
  }
  .gift-disc {
    width: clamp(44px, 6.4cqh, 58px);
    height: clamp(44px, 6.4cqh, 58px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff8e3 0%, #f4dba0 70%, #d9b874 100%);
    border: clamp(2px, 0.35cqh, 3px) solid #8a5a2a;
    box-shadow:
      0 3px 6px rgba(0,0,0,0.3),
      inset 0 2px 0 rgba(255,255,230,0.5),
      inset 0 -2px 0 rgba(120, 80, 30, 0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 3.4cqh, 30px);
    line-height: 1;
  }
  .gift-label {
    font-family: 'Quicksand', system-ui, sans-serif;
    font-weight: 600;
    letter-spacing: 0.15px;
    font-size: clamp(14px, 1.7cqh, 15px);
    color: #4a2e14;
    text-align: center;
    line-height: 1.2;
    max-width: clamp(80px, 16cqw, 120px);
  }

  /* ── Primary wave-off button ── */
  .wave-wrap {
    width: min(92%, 480px);
    margin-top: 0;
    position: relative;
    z-index: 19;
  }
  .btn-primary {
    width: 100%;
    padding: clamp(14px, 2.6cqh, 22px) clamp(20px, 3.4cqw, 30px);
    font-family: var(--sign-title-font);
    font-size: clamp(18px, 3cqh, 26px); font-weight: 700;
    color: #fffbe8;
    text-shadow: 2px 3px 0 rgba(0,0,0,0.5);
    background:
      linear-gradient(180deg,
        transparent 0%, transparent 32%,
        rgba(0,0,0,0.32) 32.5%, rgba(0,0,0,0.32) 33%,
        rgba(255,240,210,0.2) 33.3%, transparent 33.9%,
        transparent 66%,
        rgba(0,0,0,0.32) 66.5%, rgba(0,0,0,0.32) 67%,
        rgba(255,240,210,0.2) 67.3%, transparent 67.9%,
        transparent 100%),
      linear-gradient(90deg,
        transparent 0%, transparent 32%,
        rgba(0,0,0,0.07) 33%, transparent 34%, transparent 65%,
        rgba(0,0,0,0.07) 66%, transparent 67%),
      linear-gradient(180deg, #e7a84a 0%, #c88436 50%, #a2651c 100%);
    border: clamp(2px, 0.3cqh, 3px) solid #9a6528;
    border-radius: clamp(6px, 0.8cqh, 10px);
    cursor: pointer;
    box-shadow:
      inset 0 0 clamp(14px, 2.5cqh, 24px) rgba(0,0,0,0.25),
      inset 0 clamp(2px, 0.4cqh, 3px) 0 rgba(255,240,210,0.25),
      0 clamp(5px, 1cqh, 10px) clamp(10px, 2cqh, 16px) rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 1.8cqw, 16px);
    transition: transform 0.1s;
    transform: rotate(0.6deg);
    position: relative;
    letter-spacing: 0.02em;
  }
  .btn-primary::before, .btn-primary::after {
    content: '';
    position: absolute;
    width: clamp(7px, 1.2cqh, 10px);
    height: clamp(7px, 1.2cqh, 10px);
    background: radial-gradient(circle at 30% 30%, #7b604a 0%, #3c2a18 70%, #1f140a 100%);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .btn-primary::before { top: clamp(6px, 1cqh, 9px); left: clamp(8px, 1.2cqw, 12px); }
  .btn-primary::after  { top: clamp(6px, 1cqh, 9px); right: clamp(8px, 1.2cqw, 12px); }
  .btn-primary .flower-flank {
    font-size: clamp(28px, 4.6cqh, 40px);
    line-height: 1;
    text-shadow: none;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.35));
    display: inline-block;
    transform-origin: bottom center;
  }
  .btn-primary .flower-left  { transform: rotate(-10deg); }
  .btn-primary .flower-right { transform: rotate(10deg); }
  .btn-primary:hover .flower-left,
  .btn-primary.wobbling .flower-left  { animation: flowerWobbleL 0.5s ease-in-out infinite alternate; }
  .btn-primary:hover .flower-right,
  .btn-primary.wobbling .flower-right { animation: flowerWobbleR 0.5s ease-in-out infinite alternate; }
  .btn-primary:hover,
  .btn-primary.wobbling { animation: btnWobble 0.42s ease-in-out infinite alternate; }
  @keyframes flowerWobbleL {
    0%   { transform: rotate(-10deg) translateY(0) scale(1); }
    100% { transform: rotate(6deg)   translateY(-5px) scale(1.1); }
  }
  @keyframes flowerWobbleR {
    0%   { transform: rotate(10deg)  translateY(0) scale(1); }
    100% { transform: rotate(-6deg)  translateY(-5px) scale(1.1); }
  }
  @keyframes btnWobble {
    0%   { transform: rotate(0.6deg) translateY(0); }
    100% { transform: rotate(-0.4deg) translateY(-2px); }
  }
  .btn-primary:active { transform: rotate(0.6deg) translateY(2px); }

  /* Secondary "Not yet" pill */
  .secondary-row {
    margin-top: 0;
    display: flex; justify-content: center;
    z-index: 19; position: relative;
  }
  .link-btn {
    position: relative;
    cursor: pointer;
    font-family: var(--sign-font);
    font-weight: 700;
    font-size: clamp(14px, 1.8cqh, 17px);
    color: #fffbe8;
    text-shadow: 1px 2px 0 rgba(0,0,0,0.5);
    text-decoration: none;
    border-radius: 999px;
    padding: clamp(8px, 1.4cqh, 12px) clamp(18px, 3cqw, 28px);
    box-shadow:
      inset 0 0 clamp(8px, 1.4cqh, 14px) rgba(0,0,0,0.22),
      inset 0 clamp(1px, 0.3cqh, 2px) 0 rgba(255,240,210,0.22),
      0 clamp(3px, 0.6cqh, 6px) clamp(6px, 1.2cqh, 10px) rgba(0,0,0,0.28);
    border: clamp(2px, 0.35cqh, 3px) solid #3c5238;
    background:
      linear-gradient(90deg,
        transparent 0%, transparent 28%,
        rgba(0,0,0,0.08) 29%, transparent 30%, transparent 57%,
        rgba(0,0,0,0.07) 58%, transparent 59%, transparent 82%,
        rgba(0,0,0,0.08) 83%, transparent 84%),
      radial-gradient(ellipse 12px 7px at 72% 30%, rgba(145,100,55,0.75) 0%, transparent 70%),
      radial-gradient(ellipse 10px 6px at 30% 78%, rgba(145,100,55,0.7) 0%, transparent 70%),
      linear-gradient(180deg, #7ea063 0%, #5d7f4a 50%, #3f5d32 100%);
  }
  .link-btn::before,
  .link-btn::after {
    content: '';
    position: absolute;
    top: 50%;
    width: clamp(5px, 0.9cqw, 7px);
    height: clamp(5px, 0.9cqw, 7px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #6b6b6b 0%, #2a2a2a 70%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.15), inset -1px -1px 1px rgba(0,0,0,0.4);
    transform: translateY(-50%);
  }
  .link-btn::before { left: clamp(8px, 1.4cqw, 12px); }
  .link-btn::after  { right: clamp(8px, 1.4cqw, 12px); }

  /* Hover lift + slight tilt — gives every plank a subtle interactive
     wobble matching the painted-storybook feel. */
  .link-btn { transition: transform 0.2s ease; }
  .link-btn:hover { transform: translateY(-2px) rotate(-1.5deg); }
  .link-btn.plank-sage:hover { transform: translateY(-2px) rotate(1.5deg); }
  /* Wide layout — desktop / iPad L */
  @container adopt (min-width: 900px) {
    .adopt-plaque { width: min(680px, 80%); }
    .gifts-panel { width: min(560px, 72%); }
    .wave-wrap { width: min(560px, 72%); }
    .portrait-frame { max-width: clamp(180px, 28cqw, 260px); }
  }

  /* Narrow layout — iPhone */
  @container adopt (max-width: 420px) {
    .adopt-inner { gap: clamp(6px, 1.2cqh, 10px); padding: 10px; }
    .adopt-title { font-size: clamp(22px, 3.8cqh, 28px); }
    .portrait-frame { max-width: clamp(110px, 32cqw, 160px); }
    .meet-connector { min-width: clamp(44px, 12cqw, 70px); }
    .gift-label { font-size: clamp(14px, 1.6cqh, 14px); }
  }  /* Vertical scroll on desktop + iPad L — content stack is taller than
     the device's viewport on these landscape sizes; allow the user to
     scroll to see the bottom (grass tuft, bunny, fox, credits). */
  .device[data-size="desktop"] .welcome,
  .device[data-size="desktop"] .adopt,
  .device[data-size="desktop"] .conflict,
  .device[data-size="desktop"] .arrival,
  .device[data-size="desktop"] .vet,
  .device[data-size="desktop"] .menu,
  .device[data-size="desktop"] .news,
  .device[data-size="desktop"] .friends,
  .device[data-size="desktop"] .paths,
  .device[data-size="desktop"] .rewilding,
  .device[data-size="desktop"] .badge,
  .device[data-size="desktop"] .visitor,
  .device[data-size="ipad-l"] .welcome,
  .device[data-size="ipad-l"] .adopt,
  .device[data-size="ipad-l"] .conflict,
  .device[data-size="ipad-l"] .arrival,
  .device[data-size="ipad-l"] .vet,
  .device[data-size="ipad-l"] .menu,
  .device[data-size="ipad-l"] .news,
  .device[data-size="ipad-l"] .friends,
  .device[data-size="ipad-l"] .paths,
  .device[data-size="ipad-l"] .rewilding,
  .device[data-size="ipad-l"] .badge,
  .device[data-size="ipad-l"] .visitor {
    overflow-y: auto !important;
  }


  /* Embed mode stretches .device to the real viewport, so data-size no longer
     describes the space available and the desktop/ipad-l rule above never
     matches. Without this, any screen taller than the actual device is
     unreachable: on a landscape phone that hides the only way out of the
     adoption ceremony and the Paths screen's only Back button. */
  body.embed .device > *,
  html.iframed .device > * {
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }
  /* The screens wrap their content in a fixed-height *-inner flex box that
     clips with overflow:hidden, so the scroll container above would have
     nothing to scroll. Let the inner grow to its content instead. */
  body.embed .device > * > [class$="-inner"],
  html.iframed .device > * > [class$="-inner"] {
    height: auto !important;
    min-height: 100% !important;
    overflow: visible !important;
  }

  /* Touch targets: 36x36 audio buttons and 32px-tall text links are below
     the 48px floor the rest of the game uses. Children aim less precisely
     than adults, and a control that needs three attempts teaches them the
     game is unreliable. Padding keeps the visual size; only the hit area
     grows. */
  .audio-btn, .audio-toggle, .btn-audio,
  .back-link, .menu-link, .link-btn, .secondary-row button {
    min-width: 48px;
    min-height: 48px;
  }
</style>
<link rel="stylesheet" href="/admin/_short-landscape.css">
</head>
<body>

<div class="vp-bar">
  <strong>Adoption ceremony v1</strong>
  <span>·</span>
  <button data-size="iphone">📱 iPhone (390×844)</button>
  <button data-size="ipad-p" class="on">📱 iPad P (768×1024)</button>
  <button data-size="ipad-l">📱 iPad L (1024×768)</button>
  <button data-size="desktop">🖥 Desktop (1280×800)</button>
  <a href="/admin/rewilding.html">→ Rewilding ceremony</a>
  <span class="hint">(cinematic adoption — a forever home)</span>
</div>

<div class="device-frame">
  <div class="device" id="device" data-size="ipad-p">
    <div class="adopt">

      <!-- Drifting cherry-blossom petals -->
      <span class="petal petal-1" aria-hidden="true">🌸</span>
      <span class="petal petal-2" aria-hidden="true">🌸</span>
      <span class="petal petal-3" aria-hidden="true">🌸</span>
      <span class="petal petal-4" aria-hidden="true">🌸</span>

      <!-- Sparkles rising from below -->
      <span class="sparkle sparkle-1" aria-hidden="true">✨</span>
      <span class="sparkle sparkle-2" aria-hidden="true">✨</span>
      <span class="sparkle sparkle-3" aria-hidden="true">✨</span>
      <span class="sparkle sparkle-4" aria-hidden="true">✨</span>
      <span class="sparkle sparkle-5" aria-hidden="true">✨</span>
      <span class="sparkle sparkle-6" aria-hidden="true">✨</span>

      <div class="adopt-inner">

        <div class="adopt-plaque" role="dialog" aria-labelledby="adopt-title">
          <!-- Defaults here are deliberately GENERIC, not sample data. The
               real animal, family and player arrive in the 'init' message
               below. This markup used to name "Luna" and "Theo, Kofi and
               Zuri", and because the page had no message listener at all,
               every adoption in the game showed those names whoever the
               child had actually rehomed. If init is ever missed again, a
               vague sentence is recoverable; a confident wrong name is not. -->
          <div class="adopt-title" id="adopt-title">A forever home!</div>
          <div class="adopt-subtitle" id="adopt-subtitle">Your friend is going home today</div>

          <div class="portrait-row">
            <div class="portrait-frame">
              <img class="portrait-animal" id="animal-portrait" src="/assets/animals/dog-collie-sheltered.png" alt="">
            </div>

            <div class="meet-connector" aria-hidden="true">
              <span class="meet-spark">✨</span>
              <span class="meet-label">going home<br>together</span>
              <span class="meet-spark">✨</span>
            </div>

            <div class="portrait-frame portrait-family">
              <!-- src is a placeholder until init supplies the real
                   household portrait; alt is set from the real family name
                   by renderCeremony, and must not name a family here. -->
              <img class="portrait-animal" id="family-portrait"
                   src="/admin/scene-assets/cast/14-theo-grandkids.png"
                   alt="">
            </div>
          </div>

          <div class="scroll-card">
            <span id="scroll-body"></span>
            <span class="scroll-sign" id="scroll-sign"></span>
            <span class="paw-stamp" aria-hidden="true">🐾</span>
          </div>
        </div>

        <div class="gifts-panel">
          <div class="gifts-title">Thank-you gifts from the family</div>
          <div class="gifts-row">
            <div class="gift">
              <div class="gift-disc" aria-hidden="true">🧸</div>
              <div class="gift-label">Toys for the next rescue</div>
            </div>
            <div class="gift">
              <div class="gift-disc" aria-hidden="true">🥫</div>
              <div class="gift-label">A bag of food</div>
            </div>
            <div class="gift">
              <div class="gift-disc" aria-hidden="true">💚</div>
              <div class="gift-label">Kind words</div>
            </div>
          </div>
        </div>

        <div class="wave-wrap">
          <button class="btn-primary" id="wave-btn" type="button">
            <span class="flower-flank flower-left" aria-hidden="true">🌸</span>
            <span>WAVE THEM OFF!</span>
            <span class="flower-flank flower-right" aria-hidden="true">🌸</span>
          </button>
        </div>

        <div class="secondary-row">
          <button class="link-btn" id="not-yet-btn" type="button">← Not yet, let me hug her first</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  // Populate scroll text via textContent — no innerHTML with untrusted strings.
  //
  // Everything player-specific is rendered from the 'init' payload. Before
  // it lands (and if it never does) the copy stays generic: "your friend",
  // "your new family". The previous version hardcoded "Dear Lily … loving
  // Luna" at parse time and there was no listener to correct it, so the
  // most emotionally loaded screen in the game named the wrong child and
  // the wrong animal on every single adoption.
  function renderCeremony(p) {
    const animal = (p && typeof p.animalName === 'string' && p.animalName.trim())
      ? p.animalName.trim() : 'your friend';
    const family = (p && typeof p.householdName === 'string' && p.householdName.trim())
      ? p.householdName.trim() : 'your new family';
    const player = (p && typeof p.playerName === 'string' && p.playerName.trim())
      ? p.playerName.trim() : null;

    const titleEl = document.getElementById('adopt-title');
    if (titleEl) titleEl.textContent = `A forever home for ${animal}`;

    const subEl = document.getElementById('adopt-subtitle');
    if (subEl) subEl.textContent = `${family} are here to take ${animal} home`;

    const animalImg = document.getElementById('animal-portrait');
    if (animalImg && p && typeof p.animalSpriteSrc === 'string') {
      animalImg.src = p.animalSpriteSrc;
      animalImg.alt = animal;
    }

    const familyImg = document.getElementById('family-portrait');
    if (familyImg) {
      // alt is set unconditionally — familyFallback() below reads it to
      // caption the card when the portrait file is missing.
      familyImg.alt = family;
      if (p && typeof p.householdAvatarSrc === 'string') familyImg.src = p.householdAvatarSrc;
    }

    const body = document.getElementById('scroll-body');
    if (body) {
      body.textContent =
        `${player ? `Dear ${player}, thank you` : 'Thank you'} for loving ${animal} ` +
        `so much while ${animal} waited. We're going to be so happy together — ` +
        "lots of walks, a cosy bed, and we've been practising gentle hands. " +
        "We'll send you photos every week so you can see how it's going.";
    }

    const sign = document.getElementById('scroll-sign');
    if (sign) sign.textContent = `With love, ${family} (+ ${animal} 🐾)`;
  }

  renderCeremony(null);

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.source !== 'arc-game-host' || msg.type !== 'init') return;
    renderCeremony(msg.payload || {});
  });

  // Family-portrait fallback — if the image file isn't present, swap in a
  // hand-lettered description. Built with createElement + textContent.
  (function familyFallback() {
    const img = document.getElementById('family-portrait');
    if (!img) return;
    const swap = () => {
      const parent = img.parentElement;
      if (!parent) return;
      img.remove();
      const card = document.createElement('div');
      card.className = 'family-fallback';
      const emoji = document.createElement('span');
      emoji.className = 'ff-emoji';
      emoji.textContent = '🏡';
      card.appendChild(emoji);
      const line = document.createElement('span');
      // Read the real family off alt, which renderCeremony always sets.
      // This used to describe "Grandpa Theo … Kofi … Zuri" in detail, so a
      // single missing portrait file put a fictional family into a real
      // child's adoption.
      line.textContent = img.alt && img.alt.trim() ? img.alt.trim() : 'Your new family';
      card.appendChild(line);
      parent.appendChild(card);
    };
    img.addEventListener('error', swap, { once: true });
    if (img.complete && img.naturalWidth === 0) swap();
  })();

  // Viewport size switcher
  const device = document.getElementById('device');
  for (const btn of document.querySelectorAll('.vp-bar button[data-size]')) {
    btn.addEventListener('click', () => {
      for (const b of document.querySelectorAll('.vp-bar button[data-size]')) b.classList.remove('on');
      btn.classList.add('on');
      device.dataset.size = btn.dataset.size;
    });
  }

  // Embed mode — postMessage up to the host scene.
  const params = new URLSearchParams(location.search);
  const isEmbed = params.has('embed');
  if (isEmbed) document.body.classList.add('embed');

  const send = (type, payload) => {
    try {
      parent.postMessage(
        Object.assign({ source: 'arc-adoption', type }, payload || {}),
        '*'
      );
    } catch (_) {}
  };

  const waveBtn   = document.getElementById('wave-btn');
  const notYetBtn = document.getElementById('not-yet-btn');

  waveBtn?.addEventListener('click', () => {
    waveBtn.classList.add('wobbling');
    setTimeout(() => waveBtn.classList.remove('wobbling'), 1400);
    if (isEmbed) send('adoption-confirm', { animalId: 'luna-1', householdId: '14-theo-grandkids' });
  });

  notYetBtn?.addEventListener('click', () => {
    if (isEmbed) send('adoption-cancel');
  });
</script>
</body>
</html>
