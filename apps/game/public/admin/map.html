<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Birchie world map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<!--
  A.R.C. world map - v3 renderer.

  Two views, switchable by tab:
    1. World - OSM-derived Birchie geography (real road network) +
       stylised east extension (Wyx Park, Westgate Golf Club). The
       A.R.C. plot has the painted main-building stamp dropped in at
       its real OSM position, plus a clickable label.
    2. A.R.C. site - zoom into the plot, painted ground tiles fill
       the gardens / scrub / forecourt zones, painted main building +
       trees + viewing domes layered on top per the master site plan.

  Architecture (Rule 7 in docs/manus-sprite-rules.md):
    - Ground = top-down painted texture tiles (single-fill per region).
    - Stamps = front-elevation painted PNGs positioned by percentage.
    - All composited in HTML/CSS over the OSM SVG base.
-->
<style>
  :root {
    --cream-wash: #fef9ef;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --trellis-brown: #7b5c3a;
    --ink: #3a3a3a;
    --ink-soft: #6b6b6b;
    --paper-tan: #f1e3c5;
    --bay-line: rgba(255,247,224,0.82);   /* warm chalky white for parking-bay markings */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: #2a2622;
    color: var(--cream-wash);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 100vh;
  }

  .tabs {
    display: flex; gap: 8px;
    padding: 12px 18px;
    background: rgba(0,0,0,0.25);
    border-bottom: 2px dashed rgba(123,92,58,0.35);
    flex-shrink: 0;
  }
  .tab {
    background: var(--paper-tan);
    border: 2px solid #d3bf94;
    border-radius: 14px;
    padding: 6px 18px;
    cursor: pointer; user-select: none;
    font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 14px;
    color: var(--ink-soft);
  }
  .tab.active {
    background: var(--honey-amber);
    border-color: var(--honey-shadow);
    color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
  }
  .tabs .right { margin-left: auto; font-size: 12px; opacity: 0.6; align-self: center; }

  /* Overlay mode (URL param ?overlay=1) — used when this map is
     iframed into the tunnel mini-game as the spatial overlay.
     Hide all chrome + tree stamps + parking (so the kid sees
     only the patches + building + viewing domes ghosted, with
     the building aligned to the bottom of the overlay frame). */
  html.overlay-mode .tabs,
  html.overlay-mode #arc-stage .season-strip,
  html.overlay-mode #arc-stage .arc-title,
  html.overlay-mode #arc-stage .back-button,
  html.overlay-mode #arc-stage .stamp-tree,
  html.overlay-mode #arc-stage .region-label,
  html.overlay-mode #arc-stage .region-parking,
  html.overlay-mode #arc-stage .region-parking-deep {
    display: none !important;
  }
  html.overlay-mode body { background: transparent; }
  html.overlay-mode .stage { background: transparent; }
  html.overlay-mode #arc-stage .arc-frame {
    background-color: transparent;
    background-image: none;
  }
  /* Slide the building down so it sits flush at the BOTTOM of the
     frame (since parking is hidden). Default bottom:11% is the
     parking-strip gap; in overlay mode we want bottom:0. The
     building stays FULLY OPAQUE while everything else in the frame
     dims to 30% — kid sees the painted ARC building underneath the
     tunnel start tile clearly (Marcus 2026-05-04). */
  html.overlay-mode #arc-stage .stamp-building {
    /* Tile-pegged size + position (Marcus 2026-05-04 alignment fix).
       --site-tile is set by tunnel.html via postMessage and matches
       the puzzle grid's tileSize exactly. Building spans 5 tiles
       wide centred on tunnel column 5; sits 1 tile below the grid
       bottom so its roof clears the tunnel start tile at row 9. */
    width: calc(var(--site-tile, 1px) * 5);
    /* Centre on grid column 5 (= 0-indexed col 5 of 9). Painted
       building image has door at ~52% from left; offset so the door
       lands roughly on the trunk axis. */
    left: calc(var(--site-tile, 1px) * 2.7);
    bottom: calc(var(--site-tile, 1px) * -1);
    opacity: 1 !important;
    z-index: 5;
  }
  html.overlay-mode #arc-stage .arc-frame > *:not(.stamp-building):not(.tree-root) {
    opacity: 0.30;
  }
  /* Tree-root indicators — hidden by default, only visible when
     this map is iframed into the tunnel mini-game (overlay-mode).
     Sized in TILE units (Marcus 2026-05-04: was 6% × 14% which
     looked weed-like — narrow vertical wisps. Now: dense
     horizontally-spreading mass, ~2.5 tiles wide × 1 tile tall). */
  #arc-stage .tree-root {
    display: none;
    position: absolute;
    width: calc(var(--site-tile, 1px) * 2.5);
    height: calc(var(--site-tile, 1px) * 1);
    transform: translate(-50%, 0);
    pointer-events: none;
    opacity: 0.85;
  }
  html.overlay-mode #arc-stage .tree-root { display: block; }

  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1a1612;
  }
  .stage:not(.active) { display: none; }

  /* Town stage: SVG uses preserveAspectRatio="meet" (contain) so the
     A.R.C. plot is always visible regardless of viewport aspect.
     Where the SVG letterboxes, we show a sharp split — the top half
     in the SVG's own sea blue, the bottom half in its land tan —
     so letterbox bands read as 'more sea above / more countryside
     below' rather than a void. */
  #world-stage {
    background: linear-gradient(to bottom, #bfdde3 0%, #bfdde3 50%, #dec98a 50%, #dec98a 100%);
  }

  /* World view */
  #world-stage .map-canvas {
    position: absolute; inset: 0;
    display: block;
  }
  #world-stage .osm-svg {
    width: 100%; height: 100%;
    display: block;
  }
  #world-stage .pin-layer {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #world-stage .pin {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
  }
  #world-stage .pin-arc-building {
    width: 6%;
    transform: translate(-50%, -85%);
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
    transition: transform 200ms ease;
  }
  #world-stage .pin-arc-building:hover {
    transform: translate(-50%, -90%) scale(1.06);
  }
  #world-stage .pin-arc-label {
    position: absolute;
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 14px;
    padding: 3px 12px;
    font-family: 'Kalam', cursive;
    font-weight: 700; font-size: 14px;
    color: var(--ink);
    transform: translate(-50%, 0);
    box-shadow: 1px 2px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
  }
  #world-stage .pin-arc-label:hover { transform: translate(-50%, -1px); }

  /* A.R.C. detail view.
     Background: a custom fine-grain noise gravel texture
     (texture-gravel-fine.png) — generated by sampling the actual
     pixels of the painted forecourt in front of the A.R.C. door,
     then synthesising a seamless 256×256 noise tile in the same
     palette with darker pebble specks for variety. Tiled at 90px
     so the grain reads as fine without looking like a repeating
     pattern. */
  #arc-stage .arc-frame {
    position: relative;
    width: min(100%, 600px);
    height: 100%;
    margin: 0 auto;
    background-color: #c4b189;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/texture-gravel-fine.png');
    background-size: 90px 90px;
    background-repeat: repeat;
  }
  #arc-stage .arc-region {
    position: absolute;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  /* Plot orientation FLIPPED 2026-05-03 — building at SOUTH (bottom)
     so kid arrives from Bay Road (south) facing the entrance; gardens
     + small-mammal zone + fox/skunk pens stretch NORTH behind toward
     the sea. Region positions reordered top→bottom:
       fox/skunk (top, north)
       hedgehog/raccoon + path (middle)
       lawn/quiet gardens (lower-middle)
       building (bottom, south)
       parking (bottommost, south of building) */
  /* Undeveloped zones use a SEASONAL painted texture (set via the
     CSS variable --undeveloped-tile, which JS swaps based on the
     current in-game season — spring/summer/autumn/winter). The
     dashed outline communicates "this is reserved for future
     development". When the player unlocks a tier (T2 hedgehog,
     T3 raccoon, T6 fox, etc), the zone swaps to its developed
     style + adds the painted enclosure / habitat stamp. */
  #arc-stage .region-undeveloped {
    background-image: var(--undeveloped-tile);
    background-size: cover;
    background-position: center;
    border: 1.5px dashed rgba(123,92,58,0.55);
    border-radius: 4px;
    /* NB: do NOT set position:relative here — it would override the
       position:absolute inherited from .arc-region, dropping the
       region back into document flow and stacking all undeveloped
       patches in a column. The ::after badge below positions
       correctly against absolute parents too. */
  }
  #arc-stage .region-undeveloped::after {
    content: attr(data-future);
    position: absolute;
    bottom: 4px; right: 6px;
    font-family: 'Kalam', cursive;
    font-size: 9px;
    color: rgba(58,58,58,0.55);
    background: rgba(255,249,239,0.7);
    padding: 1px 6px;
    border-radius: 8px;
    pointer-events: none;
  }
  /* Future-habitat undeveloped tiles — sized to the actual pen
     footprints (Marcus 2026-05-03), not full-width strips. The
     grass background of arc-frame shows through around each pen
     so the unbuilt zones look like "patches of unkempt land within
     a wider grass paddock", not a wall-to-wall placeholder.

     Pen footprints (rough painted-storybook scale, will be refined
     when each habitat lands):
       - Fox pen (T6):       upper-left,  ~26% × 12%
       - Skunk pen (future): upper-right, ~26% × 12%
       - Hedgehog/Squirrel zone (T2): mid-left, ~30% × 22%
       - Raccoon pen (T3):   mid-right, ~30% × 22%
     Central path strip remains, narrower and shorter so it
     connects the lawn/quiet gardens to the small-mammal zone. */
  /* Master-plan revision 3 (Marcus 2026-05-03):
       - Lawn garden moved to a tall VERTICAL strip on the right
         (y:44%-78%, between quiet's bottom and the canopy's top).
       - Quiet garden moved to a thin HORIZONTAL strip just above
         the building, ending level with lawn's top edge.
       - That frees vertical space on the upper-left → fox + skunk
         habitats extended significantly (h:10% → h:18%).
       - A small empty buffer is preserved at the very top of the
         plot ("back") for future animals.
       - Hedgehog + raccoon row tightened slightly to make room. */

  /* Top buffer (y:0%-4%) intentionally empty — reserved for future
     "back of the plot" animals beyond fox + skunk. */

  #arc-stage .region-fox {
    left: 6%; top: 4%; width: 54.67%; height: 18%;
  }
  #arc-stage .region-skunk {
    left: 66.67%; top: 4%; width: 27.33%; height: 18%;
  }
  #arc-stage .region-hedgehog {
    left: 6%; top: 24%; width: 54.67%; height: 12%;
  }
  #arc-stage .region-raccoon {
    left: 66.67%; top: 24%; width: 27.33%; height: 12%;
  }
  /* Central vertical path: from north edge (y:0) down to the back
     of the building (y:~44%). Path lands at the fox/skunk
     2/3-1/3 boundary at x = 60.67%-66.67%. */
  #arc-stage .region-path {
    left: 60.67%; top: 0%; width: 6%; height: 44%;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/texture-gravel-fine.png');
    background-size: 60px 60px;
    border-left: 1px solid rgba(123,92,58,0.5);
    border-right: 1px solid rgba(123,92,58,0.5);
  }
  /* Horizontal "grid" paths between rows of patches. Same fine
     gravel as the central vertical path so they read as a
     coherent path network. */
  #arc-stage .region-path-h {
    left: 6%; width: 88%;
    height: 2%;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/texture-gravel-fine.png');
    background-size: 60px 60px;
    border-top: 1px solid rgba(123,92,58,0.5);
    border-bottom: 1px solid rgba(123,92,58,0.5);
    position: absolute;
  }
  .region-path-h.path-h-1 { top: 23%; }    /* between fox/skunk and hedgehog/raccoon */
  .region-path-h.path-h-2 { top: 37%; }    /* between hedgehog/raccoon and gardens (quiet+lawn) */
  .region-path-h.path-h-3 { top: 76%; }    /* between lawn garden and long-bay canopy */
  /* Quiet garden — HORIZONTAL strip behind the building. Doubled
     in height (h:14%, was h:7%) per Marcus 2026-05-03. Top moved
     down to y:39% to leave room for path-h-2 between the
     hedgehog row and the garden row. Bottom at y:53%.
     Background swaps with the season via --quiet-bg CSS var
     (set by JS in applySeason). 8 painted variants — 4 seasons. */
  #arc-stage .region-quiet {
    left: 6%; top: 39%; width: 54.67%; height: 14%;
    background-image: var(--quiet-bg);
    background-size: 100% 100%;             /* fill the patch exactly */
    background-repeat: no-repeat;
    border: 1.5px solid #5a7a4a;
    border-radius: 4px;
  }
  /* Lawn garden — tall VERTICAL strip on the right, aligned in
     the same column as Skunk + Raccoon + Bea + Big Tilly
     (stage 66.67%-94%). Establishes a continuous vertical grid
     line through the whole site.
     Background swaps with the season via --lawn-bg CSS var
     (set by JS in applySeason). 4 painted variants. */
  #arc-stage .region-lawn {
    left: 66.67%; top: 39%; width: 27.33%; height: 37%;
    background-image: var(--lawn-bg);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border: 1.5px solid #5a8a4f;
    border-radius: 4px;
  }
  /* ── Parking + depot ──────────────────────────────────────────
     Layout (Marcus 2026-05-03, third revision):
       - All vehicles enter from the FRONT (south).
       - Front strip is full-width: stage 6%–94%.
       - Big Tilly is FLUSH RIGHT against the strip's right edge.
       - Bea sits immediately to its left.
       - Bea + Big Tilly together fit EAST of the building's right
         wall (stage 82%–94%) so the long-bay canopy doesn't
         overlap the building at all.
       - The other three depot bays (Trikey, Henry, Spark) fill
         the area between the walkway and Bea (stage 55%–82%).
       - Walkway is centred under the front door (stage 45%–55%).
       - Visitor bays (3) fill the western half (stage 6%–45%).
       - Bay markings = thick painted line dividers, NOT rectangles.

     Geometry breakdown (stage-X percentages — building shrunk
     to width:65% / left:1.67%, door at stage 34.17%. Bea + Big
     Tilly + Lawn + Canopy now all align with the Skunk/Raccoon
     column at stage 66.67%-94%):
        6   – 13.72 visitor 1   (7.72%)
       13.72– 21.45 visitor 2   (7.72%)
       21.45– 29.17 visitor 3   (7.72%)
       29.17– 39.17 walkway     (10%, under door @ 34.17%)
       39.17– 44.67 Trikey ½    (5.5%)
       44.67– 55.67 Henry       (11%)
       55.67– 66.67 Spark       (11%)
       66.67– 78.81 Bea LONG    (12.14%)
       78.81– 94    Big Tilly LONG (15.19%, flush right edge)
     Strip-relative percentages = (stage − 6) ÷ 88 × 100. */

  /* Front parking strip — visitor + walkway + Trikey/Henry/Spark.
     Stops at stage 66.67% (the site's vertical grid line) so
     the long-vehicle piece can sit as its own SEPARATE,
     square-ish tarmac block to its right. Avoids the 'chopped
     in the middle' look of an L-shape. */
  #arc-stage .region-parking {
    left: 6%; top: 87%; width: 60.67%; height: 11%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.10)),
      #3b3a37;
    border: 1.5px solid rgba(35,32,28,0.6);
    border-radius: 4px;
    overflow: visible;
  }

  /* Long parking piece — Bea + Big Tilly, rendered as a SEPARATE
     square-ish block of tarmac (stage 66.67-94% × y 76-98%).
     Adjoins the front strip on its left edge, shares the same
     south kerb at y:98%, but is its own visually-distinct piece
     so neither looks chopped. Holds 2 long-vehicle bays. */
  #arc-stage .region-parking-deep {
    position: absolute;
    left: 66.67%; top: 76%; width: 27.33%; height: 22%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.10)),
      #3b3a37;
    border: 1.5px solid rgba(35,32,28,0.6);
    border-radius: 4px;
    overflow: visible;
    box-shadow: 1px 2px 6px rgba(0,0,0,0.18);
  }
  /* Long-parking-piece divider styled below alongside the bay
     glyphs (search for .region-parking-deep .bay-divider). */

  /* ── Standard bay dividers (front strip) ────────────────────
     Thick brushed-on lines BETWEEN bays only. Positions are in
     % of the parking strip's inner width (88% of stage). */
  #arc-stage .region-parking .bay-divider {
    position: absolute;
    top: 8%; height: 84%;
    width: 0;
    border-left: 4px solid var(--bay-line);
    border-radius: 3px;
    box-shadow: 0 0 5px rgba(0,0,0,0.22);
  }

  /* Visitor side — 3 bays from strip 0%–38.19% (stage 6%–29.17%).
     Strip-relative widths re-anchored to the strip's new 60.67%
     stage width (= (stage−6)÷60.67×100). */
  .bay-divider.vis-2 { left: 12.73%; }   /* V1 ↔ V2  (stage 13.72) */
  .bay-divider.vis-3 { left: 25.46%; }   /* V2 ↔ V3  (stage 21.45) */
  .bay-divider.vis-4 { left: 38.19%; }   /* V3 ↔ walkway (stage 29.17)*/

  /* Walkway — strip 38.19%–54.67% (stage 29.17%–39.17%) under
     the front door of the building (door at stage 34.17%). */
  #arc-stage .region-parking .walkway {
    position: absolute;
    left: 38.19%; top: 0; width: 16.48%; height: 100%;
    background: repeating-linear-gradient(
      180deg,
      rgba(255,247,224,0.55) 0,
      rgba(255,247,224,0.55) 6px,
      transparent 6px,
      transparent 14px
    );
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0%, transparent 12%,
      #000 22%, #000 78%, transparent 88%, transparent 100%);
            mask-image: linear-gradient(90deg,
      transparent 0%, transparent 12%,
      #000 22%, #000 78%, transparent 88%, transparent 100%);
  }

  /* ── Depot bays (right of walkway, INSIDE the front strip) ──
     Strip now ends at stage 66.67% (Spark's east edge IS the
     strip's east border, no dep-4 dividing line needed).
     Bea + Big Tilly are in the SEPARATE long-parking piece.
       Trikey   ½u    stage 39.17–44.67   (5.5%)
       Henry    1u    stage 44.67–55.67   (11%)
       Spark    1u    stage 55.67–66.67   (11%)
     Strip-relative widths re-anchored to the strip's new width
     (60.67% of stage). Strip-relative = (stage − 6) ÷ 60.67 × 100. */
  .bay-divider.dep-1 { left: 54.67%; }  /* walkway / Trikey  (stage 39.17) */
  .bay-divider.dep-2 { left: 63.74%; }  /* Trikey / Henry    (stage 44.67) */
  .bay-divider.dep-3 { left: 81.87%; }  /* Henry / Spark     (stage 55.67) */

  /* Vehicle name labels — all 5 in the front strip, written
     bottom-to-top via writing-mode:sideways-lr. First character
     sits at the south kerb; text reads upward into the bay. */
  #arc-stage .region-parking .bay-glyph.kerb {
    position: absolute;
    bottom: 8%;
    writing-mode: sideways-lr;
    transform: translateX(-50%);
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 14px;                     /* bumped from 11px for readability */
    color: var(--bay-line);
    text-shadow: 0 0 4px rgba(0,0,0,0.55);
    pointer-events: none;
    white-space: nowrap;
    line-height: 1;
  }
  /* Per-bay horizontal anchor for FRONT STRIP bays (Trikey,
     Henry, Spark — strip-relative to the new 60.67%-wide strip). */
  .bay-glyph.gly-trikey   { left: 59.21%; }   /* mid Trikey  (stage 41.92) */
  .bay-glyph.gly-henry    { left: 72.81%; }   /* mid Henry   (stage 50.17) */
  .bay-glyph.gly-spark    { left: 90.94%; }   /* mid Spark   (stage 61.17) */
  /* Bea + Big Tilly glyphs live INSIDE the long-parking piece —
     positions are relative to that piece (27.33% wide). */
  #arc-stage .region-parking-deep .bay-glyph.kerb {
    position: absolute;
    bottom: 4%;
    writing-mode: sideways-lr;
    transform: translateX(-50%);
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 14px;
    color: var(--bay-line);
    text-shadow: 0 0 4px rgba(0,0,0,0.55);
    pointer-events: none;
    white-space: nowrap;
    line-height: 1;
  }
  #arc-stage .region-parking-deep .bay-glyph.gly-bea       { left: 22.21%; }
  #arc-stage .region-parking-deep .bay-glyph.gly-big-tilly { left: 72.20%; }
  /* Single internal divider in the long-parking piece, splitting
     Bea from Big Tilly at 44.42% of the piece's width. */
  #arc-stage .region-parking-deep .bay-divider {
    position: absolute;
    top: 6%; height: 88%;
    width: 0;
    border-left: 4px solid var(--bay-line);
    border-radius: 3px;
    box-shadow: 0 0 5px rgba(0,0,0,0.22);
  }
  #arc-stage .region-parking-deep .bay-divider.long-1 { left: 44.42%; }
  #arc-stage .stamp {
    position: absolute;
    pointer-events: none;
  }
  /* Building stamp at the BOTTOM of the plot. Width:65% (was 70%
     — moved further left, slightly narrower so its right edge
     sits at stage 66.67%, exactly where the Skunk/Raccoon column
     starts. Establishes a vertical grid line that runs through
     the whole site: Skunk/Raccoon/Lawn/Bea+BT all align here.
     Door now at stage 34.17%. */
  #arc-stage .stamp-building {
    left: 1.67%; bottom: 11%;
    width: 65%;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.18));
  }
  #arc-stage .stamp-tree {
    width: 20.8%;            /* Marcus 2026-05-03: 13% × 1.6 */
    filter: drop-shadow(1px 3px 3px rgba(0,0,0,0.2));
  }
  /* Mirror a tree horizontally for variety (e.g. lawn oak flipped). */
  #arc-stage .stamp-tree.flip-x { transform: scaleX(-1); }
  #arc-stage .stamp-dome {
    width: 5%;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
    transform: translate(-50%, -50%);
  }

  /* Garden-tunnel mouth — small painted hatch on the central path. */
  #arc-stage .tunnel-mouth {
    position: absolute;
    width: 4%; aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 3;
    transition: transform 0.15s ease, filter 0.15s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  #arc-stage .tunnel-mouth:hover {
    transform: translate(-50%, -50%) scale(1.15);
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
  }
  #arc-stage .tunnel-mouth svg { width: 100%; height: 100%; display: block; }

  #arc-stage .region-label {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(123,92,58,0.4);
    border-radius: 10px;
    padding: 2px 8px;
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 11px;
    color: var(--ink);
    pointer-events: none;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  #arc-stage .region-label.tier-future {
    background: rgba(255,255,255,0.6);
    color: var(--ink-soft);
    font-style: italic;
  }

  #arc-stage .arc-title {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 18px;
    padding: 4px 16px;
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px;
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
    z-index: 10;
  }

  #arc-stage .back-button {
    position: absolute;
    top: 14px; left: 14px;
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 22px;
    padding: 6px 14px 6px 8px;
    cursor: pointer; user-select: none;
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px;
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.12);
    transform: rotate(-3deg);
    display: inline-flex; align-items: center; gap: 6px;
    z-index: 10;
  }
  .back-button svg { width: 16px; height: 16px; }

  /* Season selector — admin design preview. In the live in-game view,
     the season is set automatically from store.calendar.currentSeason
     and these buttons are hidden (driven by ?embed=1 + a host-message). */
  #arc-stage .season-strip {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; gap: 4px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid var(--honey-shadow);
    border-radius: 18px;
    padding: 3px;
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
  }
  #arc-stage .season-strip button {
    background: transparent;
    border: 0;
    border-radius: 14px;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: 600;
    color: var(--ink-soft);
  }
  #arc-stage .season-strip button.active {
    background: var(--honey-amber);
    color: var(--ink);
  }
  html.iframed #arc-stage .season-strip { display: none; }
</style>
</head>
<body>

<div class="tabs">

    <svg class="tree-root" data-for="lawn-hc1"     style="left: 85%;   top: 76%;" viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M50,0 Q42,6 28,14 Q16,18 4,24 M50,0 Q46,10 38,20 Q30,28 22,36 M50,0 Q49,12 47,22 Q45,30 44,38 M50,0 Q51,12 53,22 Q55,30 56,38 M50,0 Q54,10 62,20 Q70,28 78,36 M50,0 Q58,6 72,14 Q84,18 96,24 M50,0 Q40,4 22,8 M50,0 Q60,4 78,8" stroke="#5a3a18" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.95"/></svg>

    <!-- Viewing domes on the central axis (x:63.67%) — one per

    <img class="stamp stamp-dome" src="scene-assets/reference/arc-site-tier1-2026-04-29/viewing-dome-stamp.png" style="left: 63.67%; top: 31%;" alt="Viewing dome"/>
    <img class="stamp stamp-dome" src="scene-assets/reference/arc-site-tier1-2026-04-29/viewing-dome-stamp.png" style="left: 63.67%; top: 46%;" alt="Viewing dome"/>

    <!-- Long-parking piece — Bea + Big Tilly. Separate square-ish
         tarmac block adjoining the front strip's east edge. -->

      <div class="bay-divider long-1"></div>

      <div class="bay-glyph kerb gly-big-tilly">Big Tilly</div>

</div>

<script type="module">
  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  const stages = document.querySelectorAll('.stage');
  function showStage(name) {
    stages.forEach(s => s.classList.toggle('active', s.id === name + '-stage'));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.stage === name));
    if (name === 'world') setTimeout(placePins, 30);
  }
  tabs.forEach(t => t.addEventListener('click', () => showStage(t.dataset.stage)));
  document.querySelectorAll('[data-back]').forEach(b =>
    b.addEventListener('click', () => showStage(b.dataset.back))
  );

  // Overlay mode (?stage=arc&overlay=1) — used by tunnel.html to
  // embed the actual arc-frame as the spatial-overlay layer.
  // Auto-jumps to arc-stage, hides chrome (tabs, season strip,
  // back button, building stamp, tree stamps, dome stamps) so
  // only the patches + paths + parking show through.
  //
  // Receives `--site-tile` (px) from the parent tunnel.html via
  // postMessage so building + tree-roots can be sized in TILE units
  // (matching the puzzle grid exactly), giving stable cross-screen
  // alignment instead of % drift.
  (() => {
    const p = new URLSearchParams(location.search);
    if (p.get('stage') === 'arc') showStage('arc');
    if (p.get('overlay') === '1') {
      document.documentElement.classList.add('overlay-mode');
    }
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.source === 'arc-tunnel-host' && d.type === 'tile-size' && Number.isFinite(d.size)) {
        document.documentElement.style.setProperty('--site-tile', d.size + 'px');
      }
    });
  })();

  // ── Seasonal undeveloped-tile renderer ───────────────────────────────
  // Picks the right painted texture for the future-development zones
  // based on the current in-game season. Sources:
  //   - Live game: parent posts {type:'season', payload:{season}} on init
  //   - URL param: ?season=summer for design preview
  //   - Default:   inferred from real-world calendar month (UK)
  // Designers can also click the season-strip buttons to preview each.

  const SEASON_TEXTURES = {
    spring: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-spring.png',
    summer: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-summer.png',
    autumn: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-autumn.png',
    winter: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-winter.png',
  };

  function inferSeasonFromRealMonth() {
    // Northern-hemisphere meteorological seasons (UK convention)
    const m = new Date().getMonth() + 1; // 1..12
    if (m >= 3 && m <= 5)  return 'spring';
    if (m >= 6 && m <= 8)  return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }

  // Map the in-game Season enum (from packages/game-logic/src/calendar.ts)
  // to our 4 simple season keys. The in-game ones have the same names
  // with a flavour-suffix; this normaliser strips the suffix.
  function normaliseSeason(s) {
    if (typeof s !== 'string') return null;
    const lower = s.toLowerCase();
    if (lower.startsWith('spring')) return 'spring';
    if (lower.startsWith('summer')) return 'summer';
    if (lower.startsWith('autumn') || lower.startsWith('fall')) return 'autumn';
    if (lower.startsWith('winter')) return 'winter';
    return null;
  }

  // Tree sprites: 12 painted variants (3 species × 4 seasons),
  // delivered by Manus 2026-05-03. Each tree img in the markup
  // carries a data-tree-species attribute; this swaps the src
  // when the season changes.
  const TREE_BASE = 'scene-assets/reference/arc-site-tier1-2026-04-29';
  function treeSrc(species, season) {
    return `${TREE_BASE}/arc-tree-${species}-${season}.png`;
  }

  // Garden backgrounds: 8 painted variants (2 gardens × 4 seasons),
  // each at the patch's exact aspect ratio (no tiling, no stretch).
  const GARDEN_BG_BASE = 'scene-assets/reference/garden-bgs-2026-05-03';
  function gardenBg(garden, season) {
    return `url('${GARDEN_BG_BASE}/${garden}-garden-${season}.png')`;
  }

  function applySeason(season) {
    if (!SEASON_TEXTURES[season]) return;
    const root = document.documentElement.style;
    root.setProperty('--undeveloped-tile', `url('${SEASON_TEXTURES[season]}')`);
    root.setProperty('--lawn-bg',  gardenBg('lawn',  season));
    root.setProperty('--quiet-bg', gardenBg('quiet', season));
    // Swap each tree sprite to its seasonal variant.
    document.querySelectorAll('img.stamp-tree[data-tree-species]').forEach((img) => {
      img.src = treeSrc(img.dataset.treeSpecies, season);
    });
    // Update season-strip active state
    document.querySelectorAll('.season-strip button').forEach((b) => {
      b.classList.toggle('active', b.dataset.season === season);
    });
  }

  // Initial season: URL param > inferred from real-world month
  const params = new URLSearchParams(location.search);
  const initialSeason = normaliseSeason(params.get('season')) || inferSeasonFromRealMonth();
  applySeason(initialSeason);

  // Wire season-strip buttons (admin design preview)
  document.querySelectorAll('.season-strip button').forEach((btn) => {
    btn.addEventListener('click', () => applySeason(btn.dataset.season));
  });

  // Live-game integration: when iframed by InGameOverlay, the host
  // posts {source:'arc-game-host', type:'season', payload:{season}}
  // to update the rendered season as the in-game calendar ticks.
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.source !== 'arc-game-host') return;
    if (m.type === 'season' && m.payload) {
      const s = normaliseSeason(m.payload.season);
      if (s) applySeason(s);
    }
  });

  // World-view: position pins relative to OSM SVG canvas.
  // 2026-05-03: bounds widened to (51.355..51.390, 1.270..1.360) so
  // the canvas now covers Birchington + Westgate + Quex Park + south
  // countryside. Aspect is ~1.6:1 (1800×1121) — much more square.
  const SVG_VIEW_W = 1800;
  const SVG_VIEW_H = 1121;
  // ARC plot south-edge anchor (so the building stamp's -85% y-translate
  // lands on the plot). Computed from the real OSM plot polygon centre.
  const ARC_PLOT_SVG_X = 326;
  const ARC_PLOT_SVG_Y = 397;

  function clearChildren(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function computeSvgRect() {
    const obj = document.getElementById('osm-svg');
    const r = obj.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return null;
    // Match the SVG's preserveAspectRatio="xMidYMid meet" — contain,
    // not cover. Use min so pins follow the letterboxed rendering and
    // the A.R.C. plot stays in-view regardless of viewport aspect.
    const scale = Math.min(r.width / SVG_VIEW_W, r.height / SVG_VIEW_H);
    const renderedW = SVG_VIEW_W * scale;
    const renderedH = SVG_VIEW_H * scale;
    const stageRect = document.getElementById('world-stage').getBoundingClientRect();
    const offsetX = (r.left - stageRect.left) + (r.width - renderedW) / 2;
    const offsetY = (r.top - stageRect.top) + (r.height - renderedH) / 2;
    return { offsetX, offsetY, scale };
  }

  function svgToScreen(svgX, svgY) {
    const rect = computeSvgRect();
    if (!rect) return null;
    return {
      x: rect.offsetX + svgX * rect.scale,
      y: rect.offsetY + svgY * rect.scale,
    };
  }

  function placePins() {
    const layer = document.getElementById('pin-layer');
    if (!layer) return;
    clearChildren(layer);
    const pos = svgToScreen(ARC_PLOT_SVG_X, ARC_PLOT_SVG_Y);
    if (!pos) return;

    const img = document.createElement('img');
    img.className = 'pin pin-arc-building';
    img.src = 'scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png';
    img.alt = 'A.R.C.';
    img.title = 'Click to open the rescue centre';
    img.style.left = pos.x + 'px';
    img.style.top = pos.y + 'px';
    img.addEventListener('click', () => showStage('arc'));
    layer.appendChild(img);

    const label = document.createElement('div');
    label.className = 'pin-arc-label';
    label.textContent = 'A.R.C.';
    label.style.left = pos.x + 'px';
    label.style.top = (pos.y + 10) + 'px';
    label.addEventListener('click', () => showStage('arc'));
    layer.appendChild(label);
  }

  document.getElementById('osm-svg').addEventListener('load', placePins);
  window.addEventListener('resize', placePins);
  setTimeout(placePins, 200);
  setTimeout(placePins, 600);

  // Garden-tunnel mouth — tap to open the tunnel mini-game.
  // The host (GameScene) watches for { source: 'arc-map', type: 'open-tunnel' }
  // and unmounts the map before mounting the tunnel overlay.
  const tunnelMouth = document.getElementById('tunnel-mouth');
  if (tunnelMouth) {
    tunnelMouth.addEventListener('click', () => {
      try {
        window.parent?.postMessage({ source: 'arc-map', type: 'open-tunnel' }, '*');
      } catch (_) { /* iframe-less preview — ignore */ }
    });
  }
</script>

</body>
