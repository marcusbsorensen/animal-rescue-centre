<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Birchie world map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<!--
  A.R.C. world map - v3 renderer.

  Two views, switchable by tab:
    1. World - OSM-derived Birchie geography (real road network) +
       stylised east extension (Wyx Park, Westgate Golf Club). The
       A.R.C. plot has the painted main-building stamp dropped in at
       its real OSM position, plus a clickable label.
    2. A.R.C. site - zoom into the plot, painted ground tiles fill
       the gardens / scrub / forecourt zones, painted main building +
       trees + viewing domes layered on top per the master site plan.

  Architecture (Rule 7 in docs/manus-sprite-rules.md):
    - Ground = top-down painted texture tiles (single-fill per region).
    - Stamps = front-elevation painted PNGs positioned by percentage.
    - All composited in HTML/CSS over the OSM SVG base.
-->
<style>
  :root {
    --cream-wash: #fef9ef;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --trellis-brown: #7b5c3a;
    --ink: #3a3a3a;
    --ink-soft: #6b6b6b;
    --paper-tan: #f1e3c5;
    --bay-line: rgba(255,247,224,0.82);   /* warm chalky white for parking-bay markings */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: #2a2622;
    color: var(--cream-wash);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 100vh;
  }

  .tabs {
    display: flex; gap: 8px;
    padding: 12px 18px;
    background: rgba(0,0,0,0.25);
    border-bottom: 2px dashed rgba(123,92,58,0.35);
    flex-shrink: 0;
  }
  .tab {
    background: var(--paper-tan);
    border: 2px solid #d3bf94;
    border-radius: 14px;
    padding: 6px 18px;
    cursor: pointer; user-select: none;
    font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 14px;
    color: var(--ink-soft);
  }
  .tab.active {
    background: var(--honey-amber);
    border-color: var(--honey-shadow);
    color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
  }
  .tabs .right { margin-left: auto; font-size: 12px; opacity: 0.6; align-self: center; }

  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1a1612;
  }
  .stage:not(.active) { display: none; }

  /* World stage: when the SVG letterboxes vertically (its 2400×721
     aspect rarely matches the viewport), the gaps need to look like
     more sea/land, not a black void. Use the same sea blue as the
     SVG's sea-bg rect so the letterbox blends seamlessly. */
  #world-stage { background: #bfdde3; }

  /* World view */
  #world-stage .map-canvas {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #world-stage .osm-svg {
    width: 100%; height: 100%;
    display: block;
  }
  #world-stage .pin-layer {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #world-stage .pin {
    position: absolute;
    pointer-events: auto;
    cursor: pointer;
  }
  #world-stage .pin-arc-building {
    width: 6%;
    transform: translate(-50%, -85%);
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
    transition: transform 200ms ease;
  }
  #world-stage .pin-arc-building:hover {
    transform: translate(-50%, -90%) scale(1.06);
  }
  #world-stage .pin-arc-label {
    position: absolute;
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 14px;
    padding: 3px 12px;
    font-family: 'Kalam', cursive;
    font-weight: 700; font-size: 14px;
    color: var(--ink);
    transform: translate(-50%, 0);
    box-shadow: 1px 2px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    pointer-events: auto;
    white-space: nowrap;
  }
  #world-stage .pin-arc-label:hover { transform: translate(-50%, -1px); }

  /* A.R.C. detail view */
  #arc-stage .arc-frame {
    position: relative;
    width: min(100%, 600px);
    height: 100%;
    margin: 0 auto;
    background-color: #c9b884;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/seamless/texture-grass.png');
    background-size: 200px 200px;
    background-repeat: repeat;
  }
  #arc-stage .arc-region {
    position: absolute;
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  /* Plot orientation FLIPPED 2026-05-03 — building at SOUTH (bottom)
     so kid arrives from Bay Road (south) facing the entrance; gardens
     + small-mammal zone + fox/skunk pens stretch NORTH behind toward
     the sea. Region positions reordered top→bottom:
       fox/skunk (top, north)
       hedgehog/raccoon + path (middle)
       lawn/quiet gardens (lower-middle)
       building (bottom, south)
       parking (bottommost, south of building) */
  /* Undeveloped zones use a SEASONAL painted texture (set via the
     CSS variable --undeveloped-tile, which JS swaps based on the
     current in-game season — spring/summer/autumn/winter). The
     dashed outline communicates "this is reserved for future
     development". When the player unlocks a tier (T2 hedgehog,
     T3 raccoon, T6 fox, etc), the zone swaps to its developed
     style + adds the painted enclosure / habitat stamp. */
  #arc-stage .region-undeveloped {
    background-image: var(--undeveloped-tile);
    background-size: cover;
    background-position: center;
    border: 1.5px dashed rgba(123,92,58,0.55);
    border-radius: 4px;
    position: relative;
  }
  #arc-stage .region-undeveloped::after {
    content: attr(data-future);
    position: absolute;
    bottom: 4px; right: 6px;
    font-family: 'Kalam', cursive;
    font-size: 9px;
    color: rgba(58,58,58,0.55);
    background: rgba(255,249,239,0.7);
    padding: 1px 6px;
    border-radius: 8px;
    pointer-events: none;
  }
  #arc-stage .region-fox-skunk {
    left: 6%; top: 1.5%; width: 88%; height: 17%;
  }
  #arc-stage .region-hedgehog {
    left: 6%; top: 22%; width: 41%; height: 28%;
  }
  #arc-stage .region-raccoon {
    right: 6%; top: 22%; width: 41%; height: 28%;
  }
  #arc-stage .region-path {
    left: 47%; top: 22%; width: 6%; height: 28%;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/seamless/texture-gravel.png');
    border-left: 1px solid rgba(123,92,58,0.5);
    border-right: 1px solid rgba(123,92,58,0.5);
  }
  #arc-stage .region-lawn {
    left: 6%; top: 53%; width: 41%; height: 14%;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/seamless/texture-lawn-garden.png');
    border: 1.5px solid #5a8a4f;
    border-radius: 4px;
  }
  #arc-stage .region-quiet {
    right: 6%; top: 53%; width: 41%; height: 14%;
    background-image: url('scene-assets/reference/arc-site-tier1-2026-04-29/seamless/texture-quiet-garden.png');
    border: 1.5px solid #5a7a4a;
    border-radius: 4px;
  }
  /* ── Parking + depot apron + side driveway ──────────────────────
     Layout (Marcus 2026-05-03):
       - Front parking strip = visitor (left of door) + depot front row
         (right of door). Bay markings = thick painted line dividers
         only, NOT full rectangles.
       - Walkway sits dead-centre under the building's front door (50%).
       - Depot apron extends UP the right side of the building as an
         L-shape; 2 back-row bays (Bea + Big Tilly) live there.
       - Side driveway curves in from the EAST edge so long vehicles
         enter the depot without crossing visitor parking.

     All tarmac surfaces share the same painted-asphalt fill. */

  #arc-stage .region-parking {
    left: 6%; top: 87%; width: 88%; height: 11%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.10)),
      #3b3a37;
    border: 1.5px solid rgba(35,32,28,0.6);
    overflow: visible;     /* allow apron + driveway to overflow upward + east */
  }

  /* Bay dividers — thick brushed-on lines BETWEEN bays only.
     Each divider is a tall narrow rectangle. Positions are in
     percent of the parking strip's inner width.
     Strip spans stage-x 6%–94% (88% wide). Building spans 18%–82%
     (= parking-strip-relative 13.6%–86.4%). Door at stage 50% =
     parking-strip-relative 50%. Walkway = central 12% of strip
     under the door (stage 44%–56% → strip 43.2%–56.8%). */
  #arc-stage .region-parking .bay-divider {
    position: absolute;
    top: 8%; height: 84%;
    width: 0;            /* render as a chunky border instead of a fill */
    border-left: 4px solid var(--bay-line);
    border-radius: 3px;
    box-shadow: 0 0 5px rgba(0,0,0,0.22);
  }

  /* Visitor side — 3 bays from strip 13.6% to 43.2%
     (4 dividers ⇒ 3 bays of 9.85% each). */
  .bay-divider.vis-1 { left: 13.6%; }
  .bay-divider.vis-2 { left: 23.5%; }
  .bay-divider.vis-3 { left: 33.3%; }
  .bay-divider.vis-4 { left: 43.2%; }

  /* Walkway — strip 43.2% to 56.8% under the door. Faint zebra
     pedestrian markings, masked to a centre band. */
  #arc-stage .region-parking .walkway {
    position: absolute;
    left: 43.2%; top: 0; width: 13.6%; height: 100%;
    background: repeating-linear-gradient(
      180deg,
      rgba(255,247,224,0.55) 0,
      rgba(255,247,224,0.55) 6px,
      transparent 6px,
      transparent 14px
    );
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0%, transparent 12%,
      #000 22%, #000 78%, transparent 88%, transparent 100%);
            mask-image: linear-gradient(90deg,
      transparent 0%, transparent 12%,
      #000 22%, #000 78%, transparent 88%, transparent 100%);
  }

  /* Depot front row — strip 56.8% to 86.4% (29.6% wide).
     3 vehicles totalling 2.5 units (Trikey 0.5×, Henry 1×, Spark 1×)
     ⇒ 1 unit = 11.84% strip-relative. Dividers at:
        56.8%  (strip→walkway boundary, doubles as 1st depot divider)
        62.7%  (Trikey/Henry — Trikey is half-width so this comes after 5.92%)
        74.6%  (Henry/Spark)
        86.4%  (Spark/strip end) */
  .bay-divider.dep-1 { left: 56.8%; }
  .bay-divider.dep-2 { left: 62.7%; }
  .bay-divider.dep-3 { left: 74.6%; }
  .bay-divider.dep-4 { left: 86.4%; }

  /* Tiny painted glyphs in front-row depot bays so the role reads
     even before the kid unlocks the vehicle. */
  #arc-stage .region-parking .bay-glyph {
    position: absolute;
    top: 50%; transform: translate(-50%, -50%);
    font-family: 'Kalam', cursive;
    font-size: 9px;
    color: var(--bay-line);
    text-align: center;
    line-height: 1;
    text-shadow: 0 0 4px rgba(0,0,0,0.55);
    pointer-events: none;
    white-space: nowrap;
  }
  .bay-glyph.gly-trikey { left: 59.75%; }   /* mid of Trikey bay */
  .bay-glyph.gly-henry  { left: 68.65%; }
  .bay-glyph.gly-spark  { left: 80.5%; }

  /* ── Depot back-row apron — L-shape extending UP the right side
        of the building. Sits behind / east-of the front strip and
        joins the side driveway on its east edge. ─────────────────── */
  #arc-stage .region-depot-apron {
    position: absolute;
    /* Right of building (building right edge = stage 82%). Park apron
       runs from stage 76% to 94% wide, vertical 70% to 87%. The 76%
       overlap with the building wall is intentional — the building
       stamp sits ON TOP of this layer (lower z-index here), so the
       apron only shows where the building doesn't. */
    left: 76%; top: 70%; width: 18%; height: 17%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.10)),
      #3b3a37;
    border: 1.5px solid rgba(35,32,28,0.6);
    border-radius: 4px 4px 0 0;
    /* No explicit z-index — relies on DOM order. Apron sits BEFORE
       stamps in markup so the building stamp will always overpaint it. */
    overflow: visible;
  }
  /* Back-row bay dividers — 2 long bays (Bea + Big Tilly) parked
     parallel to the side driveway. Painted as horizontal divider
     lines splitting the apron into 2 stacked rectangles. */
  #arc-stage .region-depot-apron .apron-divider {
    position: absolute;
    left: 6%; right: 6%; height: 0;
    border-top: 4px solid var(--bay-line);
    border-radius: 3px;
    box-shadow: 0 0 5px rgba(0,0,0,0.22);
  }
  .apron-divider.bot { top: 50%; }       /* between Bea (top) and Big Tilly (bottom) */
  /* Top + bottom edges of apron act as the outer dividers
     (the apron's own border draws those — no extra elements needed). */

  #arc-stage .region-depot-apron .apron-glyph {
    position: absolute;
    left: 50%; transform: translate(-50%, -50%);
    font-family: 'Kalam', cursive;
    font-size: 9px;
    color: var(--bay-line);
    text-shadow: 0 0 4px rgba(0,0,0,0.55);
    pointer-events: none;
    white-space: nowrap;
  }
  .apron-glyph.gly-bea       { top: 25%; }
  .apron-glyph.gly-big-tilly { top: 75%; }

  /* ── Side driveway — curved tarmac patch joining the east edge
        of the stage to the depot apron. SVG path so the curve
        reads as a real drive-in. ──────────────────────────────── */
  #arc-stage .side-driveway {
    position: absolute;
    /* Spans from east edge (right: 0%) inward to the apron's east edge
       (stage x = 94%). Vertical span chosen so the curve is gentle
       enough for a lorry to enter. */
    right: 0; top: 75%; width: 14%; height: 12%;
    pointer-events: none;
    /* No explicit z-index — DOM order keeps stamps on top. */
  }
  #arc-stage .side-driveway svg { width: 100%; height: 100%; display: block; }
  /* Small "ENTRY" label so the role reads at-a-glance. */
  #arc-stage .driveway-label {
    position: absolute;
    right: 0.5%; top: 86.5%;
    font-family: 'Kalam', cursive;
    font-size: 9px;
    color: rgba(58,58,58,0.85);
    background: rgba(255,249,239,0.85);
    padding: 1px 6px;
    border-radius: 8px;
    border: 1px solid rgba(123,92,58,0.4);
    z-index: 4;
    pointer-events: none;
    white-space: nowrap;
  }
  #arc-stage .stamp {
    position: absolute;
    pointer-events: none;
  }
  /* Building stamp at the BOTTOM (south end, facing kid arriving from
     Bay Road). Plot orientation flipped 2026-05-03. */
  #arc-stage .stamp-building {
    left: 18%; bottom: 11%;
    width: 64%;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.18));
  }
  #arc-stage .stamp-tree {
    width: 13%;
    filter: drop-shadow(1px 3px 3px rgba(0,0,0,0.2));
  }
  #arc-stage .stamp-dome {
    width: 5%;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.25));
    transform: translate(-50%, -50%);
  }

  #arc-stage .region-label {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(123,92,58,0.4);
    border-radius: 10px;
    padding: 2px 8px;
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 11px;
    color: var(--ink);
    pointer-events: none;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  #arc-stage .region-label.tier-future {
    background: rgba(255,255,255,0.6);
    color: var(--ink-soft);
    font-style: italic;
  }

  #arc-stage .arc-title {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 18px;
    padding: 4px 16px;
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px;
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.15);
    z-index: 10;
  }

  #arc-stage .back-button {
    position: absolute;
    top: 14px; left: 14px;
    background: var(--honey-amber);
    border: 2px solid var(--honey-shadow);
    border-radius: 22px;
    padding: 6px 14px 6px 8px;
    cursor: pointer; user-select: none;
    font-family: 'Kalam', cursive; font-weight: 700; font-size: 14px;
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(0,0,0,0.12);
    transform: rotate(-3deg);
    display: inline-flex; align-items: center; gap: 6px;
    z-index: 10;
  }
  .back-button svg { width: 16px; height: 16px; }

  /* Season selector — admin design preview. In the live in-game view,
     the season is set automatically from store.calendar.currentSeason
     and these buttons are hidden (driven by ?embed=1 + a host-message). */
  #arc-stage .season-strip {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; gap: 4px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid var(--honey-shadow);
    border-radius: 18px;
    padding: 3px;
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
  }
  #arc-stage .season-strip button {
    background: transparent;
    border: 0;
    border-radius: 14px;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: 600;
    color: var(--ink-soft);
  }
  #arc-stage .season-strip button.active {
    background: var(--honey-amber);
    color: var(--ink);
  }
  html.iframed #arc-stage .season-strip { display: none; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" data-stage="world">World map</button>
  <button class="tab" data-stage="arc">A.R.C. site</button>
  <span class="right">v3 renderer · Tier 1 assets · OSM ground truth</span>
</div>

<div class="stage active" id="world-stage">
  <div class="map-canvas">
    <object class="osm-svg" id="osm-svg" data="scene-assets/birchie-map/birchie-roads.svg" type="image/svg+xml"></object>
    <div class="pin-layer" id="pin-layer"></div>
  </div>
</div>

<div class="stage" id="arc-stage">
  <button class="back-button" data-back="world">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
    </svg>
    Back to map
  </button>
  <div class="arc-title">A.R.C. — Animal Rescue Centre</div>
  <div class="season-strip" id="season-strip">
    <button data-season="spring">🌱 Spring</button>
    <button data-season="summer">☀️ Summer</button>
    <button data-season="autumn">🍂 Autumn</button>
    <button data-season="winter">❄️ Winter</button>
  </div>

  <div class="arc-frame">
    <div class="arc-region region-parking">
      <!-- Visitor side: 3 bays defined by 4 dividers -->
      <div class="bay-divider vis-1"></div>
      <div class="bay-divider vis-2"></div>
      <div class="bay-divider vis-3"></div>
      <div class="bay-divider vis-4"></div>
      <!-- Pedestrian walkway under the front door -->
      <div class="walkway" aria-hidden="true"></div>
      <!-- Depot front row: Trikey (½), Henry, Spark+⚡ — 4 dividers -->
      <div class="bay-divider dep-1"></div>
      <div class="bay-divider dep-2"></div>
      <div class="bay-divider dep-3"></div>
      <div class="bay-divider dep-4"></div>
      <!-- Painted glyphs naming the depot bays -->
      <div class="bay-glyph gly-trikey">🚲<br>Trikey</div>
      <div class="bay-glyph gly-henry">Henry</div>
      <div class="bay-glyph gly-spark">⚡ Spark</div>
    </div>

    <!-- Depot back-row apron (L-shape, right of building) -->
    <div class="arc-region region-depot-apron">
      <div class="apron-divider bot"></div>
      <div class="apron-glyph gly-bea">Bea</div>
      <div class="apron-glyph gly-big-tilly">Big Tilly</div>
    </div>

    <!-- Side driveway curving in from the east edge -->
    <div class="side-driveway" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <!-- Tarmac fill: gentle curve from east edge into the apron.
             Path is a wedge: enters at the east (x=100), curves left
             and down into the apron's east edge (x=0 at top). -->
        <path d="M 100 0 L 100 100 Q 60 100 30 60 Q 10 30 0 10 L 0 0 Z"
              fill="#3b3a37" stroke="rgba(35,32,28,0.6)" stroke-width="0.8"/>
        <!-- Faint sheen overlay -->
        <path d="M 100 0 L 100 100 Q 60 100 30 60 Q 10 30 0 10 L 0 0 Z"
              fill="url(#drv-sheen)" />
        <defs>
          <linearGradient id="drv-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="driveway-label">↘ depot entry</div>
    <div class="arc-region region-lawn"></div>
    <div class="arc-region region-quiet"></div>
    <div class="arc-region region-path"></div>
    <div class="arc-region region-undeveloped region-hedgehog" data-future="future: T2 hedgehog/squirrel"></div>
    <div class="arc-region region-undeveloped region-raccoon" data-future="future: T3 raccoon"></div>
    <div class="arc-region region-undeveloped region-fox-skunk" data-future="future: T6 fox + skunk"></div>

    <!-- Region labels — positions match the FLIPPED orientation
         (fox/skunk at top, gardens lower-middle, building at bottom). -->
    <div class="region-label tier-future" style="left: 27%; top: 10%;">Fox (T6)</div>
    <div class="region-label tier-future" style="left: 73%; top: 10%;">Skunk (future)</div>
    <div class="region-label tier-future" style="left: 27%; top: 28%;">Hedgehog + Squirrel (T2)</div>
    <div class="region-label tier-future" style="left: 73%; top: 28%;">Raccoon (T3)</div>
    <div class="region-label" style="left: 27%; top: 60%;">Lawn garden</div>
    <div class="region-label" style="left: 73%; top: 60%;">Quiet garden</div>

    <!-- Building at the SOUTH end (bottom — entrance facing kid arriving from Bay Road) -->
    <img class="stamp stamp-building" src="scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2" alt="A.R.C. main building"/>

    <!-- Trees in the hedgehog/squirrel left zone (now upper-middle of canvas
         since fox/skunk moved to the top). -->
    <img class="stamp stamp-tree" src="scene-assets/reference/arc-site-tier1-2026-04-29/arc-tree-oak.png" style="left: 9%; top: 22%;" alt="Oak"/>
    <img class="stamp stamp-tree" src="scene-assets/reference/arc-site-tier1-2026-04-29/arc-tree-ash.png" style="left: 28%; top: 26%;" alt="Ash"/>
    <img class="stamp stamp-tree" src="scene-assets/reference/arc-site-tier1-2026-04-29/arc-tree-horse-chestnut.png" style="left: 13%; top: 42%;" alt="Horse chestnut"/>

    <!-- Viewing domes along the central path (top:22%-50% of canvas, the small-mammal zone). -->
    <img class="stamp stamp-dome" src="scene-assets/reference/arc-site-tier1-2026-04-29/viewing-dome-stamp.png" style="left: 50%; top: 28%;" alt="Viewing dome"/>
    <img class="stamp stamp-dome" src="scene-assets/reference/arc-site-tier1-2026-04-29/viewing-dome-stamp.png" style="left: 50%; top: 36%;" alt="Viewing dome"/>
    <img class="stamp stamp-dome" src="scene-assets/reference/arc-site-tier1-2026-04-29/viewing-dome-stamp.png" style="left: 50%; top: 44%;" alt="Viewing dome"/>
  </div>
</div>

<script type="module">
  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  const stages = document.querySelectorAll('.stage');
  function showStage(name) {
    stages.forEach(s => s.classList.toggle('active', s.id === name + '-stage'));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.stage === name));
    if (name === 'world') setTimeout(placePins, 30);
  }
  tabs.forEach(t => t.addEventListener('click', () => showStage(t.dataset.stage)));
  document.querySelectorAll('[data-back]').forEach(b =>
    b.addEventListener('click', () => showStage(b.dataset.back))
  );

  // ── Seasonal undeveloped-tile renderer ───────────────────────────────
  // Picks the right painted texture for the future-development zones
  // based on the current in-game season. Sources:
  //   - Live game: parent posts {type:'season', payload:{season}} on init
  //   - URL param: ?season=summer for design preview
  //   - Default:   inferred from real-world calendar month (UK)
  // Designers can also click the season-strip buttons to preview each.

  const SEASON_TEXTURES = {
    spring: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-spring.png',
    summer: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-summer.png',
    autumn: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-autumn.png',
    winter: 'scene-assets/reference/undeveloped-tiles-2026-05-03/texture-undeveloped-winter.png',
  };

  function inferSeasonFromRealMonth() {
    // Northern-hemisphere meteorological seasons (UK convention)
    const m = new Date().getMonth() + 1; // 1..12
    if (m >= 3 && m <= 5)  return 'spring';
    if (m >= 6 && m <= 8)  return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }

  // Map the in-game Season enum (from packages/game-logic/src/calendar.ts)
  // to our 4 simple season keys. The in-game ones have the same names
  // with a flavour-suffix; this normaliser strips the suffix.
  function normaliseSeason(s) {
    if (typeof s !== 'string') return null;
    const lower = s.toLowerCase();
    if (lower.startsWith('spring')) return 'spring';
    if (lower.startsWith('summer')) return 'summer';
    if (lower.startsWith('autumn') || lower.startsWith('fall')) return 'autumn';
    if (lower.startsWith('winter')) return 'winter';
    return null;
  }

  function applySeason(season) {
    if (!SEASON_TEXTURES[season]) return;
    document.documentElement.style.setProperty(
      '--undeveloped-tile',
      `url('${SEASON_TEXTURES[season]}')`,
    );
    // Update season-strip active state
    document.querySelectorAll('.season-strip button').forEach((b) => {
      b.classList.toggle('active', b.dataset.season === season);
    });
  }

  // Initial season: URL param > inferred from real-world month
  const params = new URLSearchParams(location.search);
  const initialSeason = normaliseSeason(params.get('season')) || inferSeasonFromRealMonth();
  applySeason(initialSeason);

  // Wire season-strip buttons (admin design preview)
  document.querySelectorAll('.season-strip button').forEach((btn) => {
    btn.addEventListener('click', () => applySeason(btn.dataset.season));
  });

  // Live-game integration: when iframed by InGameOverlay, the host
  // posts {source:'arc-game-host', type:'season', payload:{season}}
  // to update the rendered season as the in-game calendar ticks.
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.source !== 'arc-game-host') return;
    if (m.type === 'season' && m.payload) {
      const s = normaliseSeason(m.payload.season);
      if (s) applySeason(s);
    }
  });

  // World-view: position pins relative to OSM SVG canvas
  const SVG_VIEW_W = 2400;
  const SVG_VIEW_H = 721;
  // Plot polygon is at ~(339-427, 491-599); we anchor the building
  // pin to the SOUTH end of the plot so its rendered bottom edge
  // (translate -50%, -85%) sits on the plot. Earlier (524, 348) was
  // way north of the actual plot — that's why the building was floating
  // up by the cliff edge with the dashed plot stranded south of it.
  const ARC_PLOT_SVG_X = 383;
  const ARC_PLOT_SVG_Y = 580;

  function clearChildren(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function computeSvgRect() {
    const obj = document.getElementById('osm-svg');
    const r = obj.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return null;
    const scale = Math.min(r.width / SVG_VIEW_W, r.height / SVG_VIEW_H);
    const renderedW = SVG_VIEW_W * scale;
    const renderedH = SVG_VIEW_H * scale;
    const stageRect = document.getElementById('world-stage').getBoundingClientRect();
    const offsetX = (r.left - stageRect.left) + (r.width - renderedW) / 2;
    const offsetY = (r.top - stageRect.top) + (r.height - renderedH) / 2;
    return { offsetX, offsetY, scale };
  }

  function svgToScreen(svgX, svgY) {
    const rect = computeSvgRect();
    if (!rect) return null;
    return {
      x: rect.offsetX + svgX * rect.scale,
      y: rect.offsetY + svgY * rect.scale,
    };
  }

  function placePins() {
    const layer = document.getElementById('pin-layer');
    if (!layer) return;
    clearChildren(layer);
    const pos = svgToScreen(ARC_PLOT_SVG_X, ARC_PLOT_SVG_Y);
    if (!pos) return;

    const img = document.createElement('img');
    img.className = 'pin pin-arc-building';
    img.src = 'scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png';
    img.alt = 'A.R.C.';
    img.title = 'Click to open the rescue centre';
    img.style.left = pos.x + 'px';
    img.style.top = pos.y + 'px';
    img.addEventListener('click', () => showStage('arc'));
    layer.appendChild(img);

    const label = document.createElement('div');
    label.className = 'pin-arc-label';
    label.textContent = 'A.R.C.';
    label.style.left = pos.x + 'px';
    label.style.top = (pos.y + 10) + 'px';
    label.addEventListener('click', () => showStage('arc'));
    layer.appendChild(label);
  }

  document.getElementById('osm-svg').addEventListener('load', placePins);
  window.addEventListener('resize', placePins);
  setTimeout(placePins, 200);
  setTimeout(placePins, 600);
</script>

</body>
</html>
