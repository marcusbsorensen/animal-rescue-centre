<!DOCTYPE html>
<!--
  drive-spike.html — the rotating-world driving model, before it touches the game.

  Why it exists: the driving scene draws a straight corridor and scrolls rows of
  it towards you. The model Lily's game uses instead pins the vehicle to one spot
  on screen and rotates the whole world underneath it, so a bend is the world
  turning rather than the van steering. That is a different renderer, not a
  tweak, and it is cheaper to prove here on a plain canvas than inside a 3,600
  line Phaser scene.

  What it proves, and nothing else:
    - the real Birchie graph (937 nodes) drives the geometry, so the roads here
      are the roads the child sees on the map
    - the camera rotates to the route's heading and the van never moves
    - the scale: a lane is 110px on a 390pt phone, the van 53px across, against
      28px and 16px in the game today
    - hold-to-go, gears, handbrake, and swerving between lanes (a finger, the
      mouse button or a touchpad press held on the road is go; Space or B
      held is the handbrake; see "input" below)
    - the gears, handbrake and horn on the van's own dashboard, a strip
      below the van, with a live speedometer, GPS and cargo-comfort gauge
      (drive-spike/dashboard.js)
    - the guide line, and what the screen looks like with it switched off:
      a brass switch on the dashboard beside the GPS, on by default and
      remembered (Marcus, 2026-10-11: the game has no settings screen)

  Open it at /admin/drive-spike.html with the dev server running.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>A.R.C. — driving spike</title>
<style>
  :root { color-scheme: light; --sab: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2c2c2c;
    font-family: "Nunito", system-ui, -apple-system, sans-serif; }
  #wrap { position: relative; height: 100%; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; background: #8fbf6a; }
  /* The chips, and under them the grown-up's tools, folded behind "dev" so
     the child's controls are only the dashboard's. */
  #top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
    flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
  #hud { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; font-size: 13px; }
  .chip { background: rgba(255,252,246,.92); border-radius: 14px; padding: 6px 10px;
    font-weight: 700; color: #3a3226; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  #panel { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; font-size: 11px; }
  #devTools { display: contents; }
  #devTools[hidden] { display: none; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 11px;
    padding: 5px 9px; background: rgba(255,252,246,.85); color: #3a3226;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  button[aria-pressed="true"] { background: #4b8b3b; color: #fff; }
  /* The chips give way while the look-ahead window covers them. */
  #top { transition: opacity .2s; }
  #top.away { opacity: 0; }
  #top.away #panel { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #top { transition: none; } }
  #note { color: #fffcf6; font-size: 11px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  /* Placed by toast() below the van, or beside it held sideways: never over
     the road ahead. A cream paper label, like the chips, so it reads on
     tarmac, grass or snow without a heavy shadow. */
  #toast { position: absolute; top: 70%; left: 0; width: 100%; display: flex;
    justify-content: center; align-items: center; pointer-events: none;
    transform: translateY(-50%); opacity: 0; transition: opacity .25s; }
  #toast span { max-width: calc(100% - 24px); padding: 7px 16px 8px; border-radius: 18px;
    background: rgba(255,250,238,.95); border: 2px solid #e6cf9f; color: #3a3226;
    font-size: 21px; font-weight: 900; line-height: 1.2; text-align: center;
    box-shadow: 0 2px 8px rgba(40,30,20,.22); }
  #toast.on { opacity: 1; }
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="top">
    <div id="hud">
      <div class="chip" id="gearChip">P</div>
      <div class="chip" id="speedChip">0 mph</div>
      <div class="chip" id="laneChip">left lane</div>
      <div class="chip" id="roadChip">—</div>
    </div>
    <div id="panel">
      <button id="devBtn" aria-pressed="false">dev</button>
      <span id="devTools" hidden>
        <button id="routeBtn">new route</button>
        <button id="trunkBtn">to big road</button>
        <button id="a28Btn">to A28 town</button>
      </span>
    </div>
    <div id="note" hidden>hold the road (finger, mouse button or touchpad press) to go · swipe right or hold → to look out, further to overtake · swipe left or ← to come back · space or B = handbrake · 1–3 gears · H = horn · G = guide line</div>
  </div>
  <div id="toast"></div>
</div>

<script type="module">
// Scenery and traffic live in their own modules so each can be built without
// touching this file. Their contracts are documented at the top of each.
import * as scenery from './drive-spike/scenery.js';
import * as traffic from './drive-spike/traffic.js';
import * as crossings from './drive-spike/crossings.js';
import * as look from './drive-spike/vehicle-look.js';
import * as roadPaint from './drive-spike/road-paint.js';   // ?road=0|1|2
// The gears, handbrake and horn, in a strip along the bottom styled as the
// van's own dashboard (Marcus, 2026-10-11). The road view is the canvas above
// that strip.
import * as dashboard from './drive-spike/dashboard.js';
// The look-ahead window over the top of the road view while she pokes out
// to look (Lily and Marcus, 2026-10-12).
import * as lookAhead from './drive-spike/look-ahead.js';
// The trip strip up the left edge, with the sights on the way and their signs
// at the roadside (Lily, 2026-10-12).
import * as tripStrip from './drive-spike/trip-strip.js';

// ---------------------------------------------------------------- the world

/** The map is 1800x1121 over roughly 6.2km x 3.9km, so one unit of fy is this
 *  many metres and fx is scaled by the aspect to match. Same convention as
 *  road-router.ts, which is why a route computed there lands here unchanged. */
const ASPECT = 1800 / 1121;
const METRES_PER_UNIT = 3900;

/** Pixels per metre. Chosen so a 5m lane draws 110px wide on a 390pt phone —
 *  the reference game gives its car about half a lane and we match that. */
const PPM = 22;

/** Road widths in metres by OSM class. A trunk road gets two lanes each way,
 *  everything else one each way; a track is single and unmarked. */
const ROAD_M = { secondary: 10, tertiary: 10, unclassified: 9, residential: 8, track: 5 };
const LANE_M = 5;

/** The dual carriageway keeps its true width, 21.6m, which at PPM would fill
 *  a 390pt phone edge to edge. So the camera eases out to BIG_ROAD_ZOOM as the
 *  van approaches one: the van shrinks a little and she sees further ahead at
 *  the road's top speed. Marcus chose this on 2026-10-11 over narrowing the
 *  big road's lanes, which would have made them narrower than a country
 *  road's — the kind of mismatch a child spots. */
const BIG_ROAD_ZOOM = 0.62;
const TRUNK_LANE_M = 5;
const RESERVATION_M = 1.6;   // the grass strip between the two carriageways
const TRUNK_M = 4 * TRUNK_LANE_M + RESERVATION_M;

/** The A28 as it really is (docs/driving-rebuild-2026-10-11.md, 17A/18A):
 *  only its 1.7 km west of Brooksend is the dual carriageway above. A
 *  'divided' stretch is two one-way carriageways at 30-40 mph that the graph
 *  draws as one line, so it is drawn as a two-way road split by a narrow
 *  kerbed island, with the data's lanes each way; a 'single' stretch is an
 *  ordinary two-way A-road with a centre line, as wide as the other main
 *  roads. cw is the edge's carriageway record, or null for a dual without
 *  one (the data not loaded). */
const ISLAND_M = 1.2;
function roadWidth(cls, cw) {
  if (cls !== 'trunk') return ROAD_M[cls] ?? 8;
  if (!cw || cw.kind === 'dual') return TRUNK_M;
  if (cw.kind === 'divided') return 2 * Math.max(1, cw.lanes) * LANE_M + ISLAND_M;
  return ROAD_M.secondary;
}
let zoom = 1;

/** Where the van sits across the screen, measured off Lily's game: 53.5%
 *  across in every frame of 35 seconds. */
const VAN_SX = 0.535;

/** View parameters for comparing layouts, not settings: ?full=1 drops the
 *  430px width cap (to see landscape), ?pin= moves the van's height on screen
 *  (a fraction of the road view, as below), ?zoomx= scales every zoom. */
const VIEW_Q = new URLSearchParams(location.search);
const FULL_WIDTH = VIEW_Q.get('full') === '1';

/** How far down the road view the van sits. The reference game has it 59%
 *  down; Lily, 2026-10-12: "it would be better for the vehicle we are
 *  driving to be a bit further down / back on the road so we have more open
 *  road ahead to be seen, as we don't ever reverse". So upright it sits 75%
 *  down, which gives the road ahead about a quarter more of the screen, and
 *  held sideways, where there was least road ahead, 86%. Held sideways the
 *  camera also pulls back (Marcus, 2026-10-11). */
const VAN_PIN = { port: 0.75, land: 0.86 };
function vanSY(w, h) { return Number(VIEW_Q.get('pin')) || (w > h ? VAN_PIN.land : VAN_PIN.port); }
function zoomX(w, h) { return Number(VIEW_Q.get('zoomx')) || (w > h ? 0.75 : 1); }

/** Road kept in view behind the van's tail, in CSS px, so it never looks
 *  parked on the dashboard. */
const BEHIND_PX = 16;

/** The van's height on screen: the pin is a fraction of the road view above
 *  the dashboard, not of the whole screen, so the strip covers only road
 *  already driven. Pulled up close at a gate, or held sideways, the pin
 *  would put the van's tail under the dashboard, so then it rises just
 *  enough to keep the whole van and a strip of road behind it in view. w and
 *  h are the screen's, which decide upright or sideways. */
function vanScreenY(w, h, roadH, ppm) {
  const halfLen = (car.length || VAN_W_M * 2) * ppm / 2;
  return Math.min(roadH * vanSY(w, h), roadH - halfLen - BEHIND_PX);
}

/** Every vehicle at its true width relative to Henry, and Henry at the size
 *  measured against the reference (13.5% of a phone's width), Marcus's choice
 *  of 2026-10-11. Real widths from `fleet-art.ts` VEHICLE_WIDTH_M. ?van= picks
 *  the vehicle, ?vanw= overrides the width for comparisons. */
const VAN_ID = VIEW_Q.get('van') || 'henry';
const REAL_W_M = { trikey: 0.75, henry: 1.75, bea: 1.80, spark: 2.00, 'big-tilly': 2.30 };
const HENRY_DRAWN_M = 2.4;
const VAN_W_M = Number(VIEW_Q.get('vanw'))
  || (REAL_W_M[VAN_ID] ?? REAL_W_M.henry) * HENRY_DRAWN_M / REAL_W_M.henry;

const GEARS = { 1: 7, 2: 13, 3: 20 };   // metres per second
const ACCEL = 9, BRAKE = 14, HANDBRAKE = 34;  // m/s^2

/** Which gears suit which road, and what it costs to get it wrong. The point
 *  of the gearbox is choosing a speed for the circumstances, so the graph's
 *  own road class is the teacher: third on a farm track throws up dust the
 *  animals breathe, first on the dual carriageway has a queue behind you
 *  beeping. The graph already carries the class on every edge, so this is a
 *  lookup rather than new content. */
const ROAD_NAME = {
  trunk: 'dual carriageway', secondary: 'main road', tertiary: 'country road',
  unclassified: 'lane', residential: 'houses', track: 'farm track',
};
const GEAR_OK = {
  trunk: [2, 3], secondary: [1, 2, 3], tertiary: [1, 2, 3],
  unclassified: [1, 2], residential: [1, 2], track: [1],
};
const TOO_FAST = { track: 'dust!', unclassified: 'too fast', residential: 'slow down' };
const TOO_SLOW = { trunk: 'beeping' };

/** Every gear works on every road (Marcus, 2026-10-12, 30A): "Any gear is
 *  available in any car at any time, but that doesn't mean that it's correct
 *  for the road that one is on. The same with bicycle gears." The gear sets
 *  the top speed on every road; the lists above are what suits the road, the
 *  knob prompt asks for the road's best (its top suiting gear, because what
 *  she feels is the speed), and a wrong gear costs what the doc's 'Getting it
 *  wrong' column says (see gearCosts in step()).
 *
 *  The A28 is not one road (trunk-carriageways.json, road-gears.ts): on a
 *  trunk edge whose carriageway is known, the gears whose speed is within its
 *  limit suit it, and on the real dual carriageway not first, where traffic
 *  queues behind. So third is fine at 50 mph west of Brooksend and too fast
 *  at 30 mph through The Square. A trunk edge with no record is a dual. */
const MPS_PER_MPH = 0.44704;
function gearsFor(cls, cw) {
  if (cls === 'trunk' && cw) {
    const within = [1, 2, 3].filter(g => GEARS[g] <= cw.maxspeedMph * MPS_PER_MPH);
    return cw.kind === 'dual' ? within.filter(g => GEAR_OK.trunk.includes(g)) : within;
  }
  return GEAR_OK[cls] ?? [1, 2, 3];
}
/** The chip's name: a divided or single stretch of the A28 is a main road. */
function roadNameFor(cls, cw) {
  if (cls === 'trunk' && cw && cw.kind !== 'dual') return 'main road';
  return ROAD_NAME[cls] ?? cls;
}
/** road-gears.ts's gearVerdict: null when the gear suits the road (or the
 *  van is barely moving: pulling away in third on a lane is not speeding),
 *  else 'fast' or 'slow'. */
function gearVerdict(cls, cw, gear, v) {
  const ok = gearsFor(cls, cw);
  if (ok.includes(gear) || v < 1) return null;
  return gear > Math.max(...ok) ? 'fast' : 'slow';
}
const gearBest = (cls, cw) => Math.max(...gearsFor(cls, cw));

/** Changing down while holding go, the van slows to the new gear's speed at
 *  this rate rather than braking: the engine is holding her back, not her
 *  foot, so the animals do not feel it. */
const ENGINE_EASE = 4;   // m/s^2

/** Too fast for the road. The speed camera flashes once per stretch of road
 *  (a stretch is a run of one class, and on the A28 one carriageway kind);
 *  under reduced motion a toast says so instead of the white flash (port
 *  plan section 5, Q5 and Q7). While it lasts the animals are jostled
 *  harder, the comfort gauge falling at this many points a second on top of
 *  its settling, and on a farm track the van throws up a dust cloud they
 *  breathe. The van's own hard stops for traffic and crossing animals come
 *  sooner at speed by themselves, and each one counts as rough driving. */
const SPEEDING_JOSTLE = { track: 11, default: 8 };   // per second, against 6 settling
const FLASH_S = 0.18, CAMERA_MARK_S = 1.6;

/** The last few m/s before the gear's top come on slowly, so holding go in
 *  first on a main road is a needle that leans and stops, not one that snaps
 *  to 15 mph: she feels the gear holding the van back. */
const TOP_OUT = 3.5;   // m/s over which the pull fades
const TOP_PULL = 0.18; // what is left of it at the very top

/** The prompt waits this long after the road changes before glowing, so a
 *  short stretch of another class at a junction does not flicker the knobs. */
const HINT_DELAY = 0.6;   // seconds

/** A gear change lurches the van in the frame: back a little on an up-change,
 *  forward on a down-change, over LURCH_S. Not under reduced motion. */
const LURCH_M = 0.14, LURCH_S = 0.2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

/** The gear lever. Every gear is always there, and picking one that suits
 *  the road is what stops the prompt (gearHint): it stays her choice, and
 *  so is ignoring it. */
function setGear(n) {
  if (n === car.gear) return;
  const dir = Math.sign(n - car.gear);
  car.gear = n;
  car.lurch = { at: performance.now(), dir };
  if (dash) dashboard.clunk(dash, dir);
}

/** Which knob glows: only while the gear she is in does not suit the road
 *  (33A, Marcus, 2026-10-12), and then the road's best gear, once it has
 *  wanted that knob for HINT_DELAY. In any suiting gear nothing glows, so
 *  in second on a main road, where every gear suits, no knob does. It is a
 *  hint she may ignore. road-gears.ts's stepGearHint. */
function gearHint(dt) {
  const suits = gearsFor(car.road, car.cw).includes(car.gear);
  const want = car.arrived || suits ? 0 : gearBest(car.road, car.cw);
  car.hintT = want && want === car.hintWant ? (car.hintT ?? 0) + dt : 0;
  car.hintWant = want;
  return car.hintT >= HINT_DELAY ? want : 0;
}

/** Metres the van sits off its pin in the frame, along its length: positive
 *  is back down the screen. */
function lurchM() {
  if (!car.lurch || reduceMotion.matches) return 0;
  const t = (performance.now() - car.lurch.at) / 1000 / LURCH_S;
  return t >= 1 ? 0 : car.lurch.dir * LURCH_M * Math.sin(Math.PI * t);
}

/** What the gear she is in costs on this road, this frame. Returns whether
 *  she is going faster than the road's best gear would take her in a gear
 *  too fast for it. Too slow (first on the dual carriageway) is
 *  traffic.js's: the traffic behind queues and beeps. */
function gearCosts() {
  car.verdict = gearVerdict(car.road, car.cw, car.gear, car.v);
  const fast = car.verdict === 'fast';
  if (fast && car.cameraStretch !== stretchAtS(car.s)) {
    car.cameraStretch = stretchAtS(car.s);
    car.cameraAt = performance.now();
    car.cameras = (car.cameras ?? 0) + 1;   // for a test
    if (reduceMotion.matches) toast('camera');
  }
  // The camera goes by the gear, as road-gears.ts's speedCameraFires does;
  // the jostle and the dust go by the speed itself, so crawling behind a
  // tractor in third rattles no one.
  return fast && car.v > GEARS[gearBest(car.road, car.cw)] + 0.5;
}

/** The dust cloud on a farm track: puffs left behind the van's tail in the
 *  world, so they stay where they were thrown up and the van drives out of
 *  them, swelling and thinning over DUST_LIFE. */
const DUST_LIFE = 1.8, DUST_RATE = 26;   // seconds; puffs a second
const dust = [];
let dustDue = 0;
function stepDust(dt, raising, pos) {
  for (const d of dust) d.age += dt;
  while (dust.length && dust[0].age > DUST_LIFE) dust.shift();
  if (!raising) { dustDue = 0; return; }
  dustDue += dt * DUST_RATE * Math.min(1, car.v / GEARS[2]);
  const back = (car.length || 4.8) / 2 + 0.4;
  const cx = car.x - Math.cos(pos.h) * back, cy = car.y - Math.sin(pos.h) * back;
  const nx = -Math.sin(pos.h), ny = Math.cos(pos.h);
  for (; dustDue >= 1; dustDue--) {
    const side = (Math.random() - 0.5) * VAN_W_M * 1.1;
    dust.push({
      x: cx + nx * side, y: cy + ny * side, age: 0, r: 0.6 + Math.random() * 0.5,
      vx: nx * side * 0.5 - Math.cos(pos.h) * 1.2, vy: ny * side * 0.5 - Math.sin(pos.h) * 1.2,
    });
  }
}
function drawDust() {
  const col = { spring: '200,184,146', summer: '214,196,152', autumn: '176,152,112', winter: '160,152,140' }[SEASON];
  for (const d of dust) {
    const f = d.age / DUST_LIFE;
    const x = d.x + d.vx * d.age, y = d.y + d.vy * d.age, r = d.r + 3.2 * Math.sqrt(f);
    ctx.fillStyle = `rgba(${col},${(0.68 * (1 - f) ** 1.3).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

/** The speed camera going off: a brief white flash over the road (not under
 *  reduced motion, where gearCosts toasts instead) and a small camera mark
 *  at the top right of the road view, held a moment and faded. */
function drawSpeedCamera(w, roadH, win) {
  if (!car.cameraAt) return;
  const t = (performance.now() - car.cameraAt) / 1000;
  if (t < FLASH_S && !reduceMotion.matches) {
    ctx.fillStyle = `rgba(255,255,255,${(0.7 * (1 - t / FLASH_S)).toFixed(3)})`;
    ctx.fillRect(0, 0, w, roadH);
  }
  if (t >= CAMERA_MARK_S) return;
  const a = Math.min(1, (CAMERA_MARK_S - t) / 0.4);
  // Below the look-ahead window while it is open.
  const x = w - 46, y = Math.max(Math.min(96, roadH * 0.25), win ? win.y + win.h + 10 : 0);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,252,246,.94)';
  ctx.beginPath(); ctx.roundRect(x - 4, y - 4, 40, 30, 9); ctx.fill();
  ctx.fillStyle = '#3a3226';
  ctx.beginPath(); ctx.roundRect(x + 3, y + 5, 26, 15, 3); ctx.fill();   // body
  ctx.fillRect(x + 8, y + 1.5, 8, 4);                                     // top
  ctx.fillStyle = '#f2d36b';
  ctx.beginPath(); ctx.arc(x + 17, y + 12.5, 4.6, 0, Math.PI * 2); ctx.fill();   // lens
  ctx.fillStyle = '#fffcf6';
  ctx.beginPath(); ctx.arc(x + 25.5, y + 8.5, 1.6, 0, Math.PI * 2); ctx.fill();  // flash
  ctx.restore();
}

/** One pixel of the child's map (birchie-roads.svg, 1800 x 1121) in metres,
 *  the same on both axes. Graph node (fx, fy) is map pixel (fx*1800, fy*1121). */
const METRES_PER_MAP_PX = METRES_PER_UNIT / 1121;
function mapToWorld(px, py) { return { x: px * METRES_PER_MAP_PX, y: py * METRES_PER_MAP_PX }; }

/** Where shadows fall, in world metres per metre of height. Fixed in the
 *  world, so when the camera turns every shadow — the van's included — swings
 *  round on screen together, as a real sun would. */
const SUN = { x: 0.45, y: 0.3 };

/** The season follows the real date (docs/world-coherence-rule-2026-10-11.md
 *  section 7), on the British meteorological calendar. ?season= overrides it
 *  so each can be looked at. */
const SEASON = (() => {
  const q = new URLSearchParams(location.search).get('season');
  if (['spring', 'summer', 'autumn', 'winter'].includes(q)) return q;
  const m = new Date().getMonth() + 1;
  return m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
})();

/** How hard the van stops itself when the child has not braked for something
 *  ahead. There is never an accident; this stop is the cost, felt by whoever
 *  is in the back. */
const EMERGENCY = 26;  // m/s^2
const FELT_S = 0.1;    // s: how long a stop takes to be felt

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let graph = null, adj = null, route = [], routeLen = 0;
let vanImg = null;
let scn = null, trf = null, xing = null;
let dash = null, roads = null;   // the dashboard, and every road in metres for its GPS
const la = lookAhead.create({ atDistance, laneOffset, length: () => routeLen });

// -------------------------------------------------------------- graph + route

/** OSM class of the edge between two nodes, either way round. The route knows
 *  which edges it uses, so its road class is a lookup, not a nearest-edge
 *  search that can flicker between two roads at a junction. */
const edgeCls = new Map();
const edgeKey = (i, j) => i * 4096 + j;

/** What each A28 (trunk) edge really is, from trunk-carriageways.json, keyed
 *  like edgeCls: { kind: 'dual'|'divided'|'single', maxspeedMph, lanes }.
 *  Without the file every trunk edge is a dual carriageway, as before. */
const edgeCw = new Map();
const cwByEdge = new Map();   // graph edge index -> record
function loadCarriageways(json) {
  for (const c of json?.edges ?? []) {
    const e = graph.edges[c.edge];
    if (!e || e[2] !== 'trunk' || e[0] !== c.nodes[0] || e[1] !== c.nodes[1]) continue;   // a stale file
    const rec = { kind: c.kind, maxspeedMph: c.maxspeedMph, lanes: c.lanes };

/** Node path to a world-space polyline in metres, with cumulative distance. */
function toPolyline(path) {

    pts[i].cls = edgeCls.get(edgeKey(path[i - 1], path[i])) ?? 'tertiary';

/** The index of the route point ending the segment s falls on. */

function atDistance(s) {

/** The destinations' own names, as `packages/game-logic/src/destinations.ts`
 *  labels them, keyed by the graph's anchor ids. */
const PLACE_NAME = {
  'arc': 'A.R.C.', 'vet': 'Bay Road Vets', 'village-hall': 'Village Hall',
  'bramble-farm': 'Bramble Farm', 'cove-harbour': 'Cove Harbour',
  'pinebark-medical': 'Pinebark Medical', 'goose-end-farm': 'Goose End Farm',
  'bay-chapel': 'Bay Chapel', 'moorland': 'Moorland', 'woodland': 'Woodland',
  'sea-cliffs': 'Sea Cliffs', 'deep-forest': 'Deep Forest', 'wetlands': 'Wetlands',
  'hog-hospital': "Freckle's Little Hog Hospital", 'wilderwood': 'Wilderwood',

/** A route between two destinations. From `fromId` when given, so that after

    const aId = fromId ?? ids[(Math.random() * ids.length) | 0];
    const bId = ids[(Math.random() * ids.length) | 0];
    if (aId === bId) continue;
    const path = shortestPath(graph.anchors[aId], graph.anchors[bId]);
    if (!path || path.length < 12) continue;

    roadHalfAt: s => roadWidth(classAtS(s), cwAtS(s)) / 2,

  window.__trf = trf;     // and see why the overtaking lane is refused (__trf.last.unsafe)

// ---------------------------------------------------------------- the driving

const car = { s: 0, lane: 0, laneT: 0, base: null, laneWant: 0, v: 0, gear: 2, road: 'tertiary', jostle: 0,
  ask: 0, peek: true, peekT: 0, peekSafe: false, returning: false };

/** Poking out to look before overtaking (Marcus, 2026-10-12, 37A). Her
 *  swipe towards the middle of the road (or how long she holds →) is
 *  car.ask, 0 to 1. Up to halfway the van eases out that share of PEEK_T
 *  across, to look past what is in front; let go before halfway and it
 *  eases back. Past halfway it overtakes, but only when traffic.js says
 *  the road allows it: otherwise it stays at the look, and eases back when
 *  she lets go. The look never goes further than traffic.js's peekMax,
 *  which keeps it clear of anything coming the other way. A sign by the
 *  centre line ahead of the van says wait or go while she looks. */
const PEEK_T = 0.38;          // the furthest look: her offside wheels just over the centre line

function peekStep(dt, t) {

  else if (prevWant === 1) car.returning = true;           // coming back in from an overtake
  if (car.returning && car.laneT <= 0.001) car.returning = false;

/** The camera's own heading, which is NOT the route's. The route is straight
 *  segments between graph nodes, so its tangent snaps by up to 55 degrees at a
 *  corner — measured, and it is exactly the jerkiness the corridor renderer was
 *  blamed for. Two things fix it: aim at a point some way ahead rather than at
 *  the current segment, and ease towards that aim instead of jumping to it.
 *
 *  Drawing the van at the difference between its own heading and the camera's
 *  is what gives the reference game its look: the world swings through a bend
 *  while the car turns only a little in the frame. */
let camH = null;
const LOOKAHEAD_M = 20, LOOKAHEAD_MAX_M = 28;
const CAM_EASE = 3.4;       // per second

/** How close the camera sits, by speed and by place. Marcus, 2026-10-11:
 *  going fast is for overview, seeing far ahead; going slowly, on the small
 *  lanes and pulling up at a farm or a rewilding site, is for detail — a
 *  small animal crossing the road. So the zoom is set by how fast the van is
 *  going, sits closer on the small roads, closer still at the destination,
 *  and never closer than the dual carriageway's width allows. 1 is the scale
 *  measured against the reference: van 13.6% of the screen's width. */
const ZOOM_FAST = 0.66;                          // at top speed
const ZOOM_STILL = { lane: 1.35, road: 1.15 };   // standing, small road / other
const ZOOM_ARRIVE = 1.6;                         // pulled up at the gate
const ARRIVE_ZOOM_M = 120;                       // how far out the arrival zoom begins
const SMALL_ROADS = new Set(['residential', 'unclassified', 'track']);
const PULL_UP = 2.5;          // m/s^2, the gentle stop at the destination
const STOP_SHORT_M = 6;       // stop this far before the anchor node
const ARRIVED_WAIT_MS = 3500; // then set off for somewhere new

function zoomTarget(bigAhead, toGo) {

  const f = Math.min(1, car.v / GEARS[3]);

let throttle = false, handbrake = false;

/** The guide line's switch is on the dashboard (Marcus, 2026-10-11, answer
 *  11C: the game has no settings screen). On by default, because a younger
 *  child cannot read the road fast enough without it. The choice is kept in
 *  localStorage under the key and the 'off' marker the game's own
 *  `lib/guide-line-preference.ts` uses, so the port inherits it; only the

let showGuide = (() => {

})();
function setGuide(on) {

function step(dt) {

  // and never counted, because following the road is not rough driving.

  // already framed when the van arrives. Out is quicker than in: seeing

  const bigAhead = bigRoadAt(car.s) || bigRoadAt(car.s + 40);

  // 20 metres, or further when the view shows more road ahead (the van sits
  // low, and pulled out at speed), so the road up the screen stays in view

  const aimM = Math.min(LOOKAHEAD_MAX_M, Math.max(LOOKAHEAD_M, 0.7 * (car.view?.ahead ?? 0)));

/** How far up the road the window looks when nothing makes it unsafe:

const LOOK_CLEAR_M = 100;

// ------------------------------------------------------------------ rendering

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  const w = FULL_WIDTH || landscape ? window.innerWidth : Math.min(window.innerWidth, 430), h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw() {
  // The canvas's own CSS size: resize() caps its pixel ratio at 2, so
  // dividing by devicePixelRatio came out short on a 3x phone.
  const w = parseFloat(canvas.style.width) || canvas.width;
  const h = parseFloat(canvas.style.height) || canvas.height;
  const pos = atDistance(car.s);

  // The van rides at a lateral offset from the route's centreline, so the
  // camera still follows the route and only the van moves between lanes.
  const nx = Math.cos(pos.h + Math.PI / 2), ny = Math.sin(pos.h + Math.PI / 2);
  const camX = pos.x + nx * car.lane, camY = pos.y + ny * car.lane;

  // The road view is the canvas above the dashboard; the van's spot is
  // measured within it.
  const stripH = dash ? dashboard.height(dash, w, h) : 0;
  const roadH = h - stripH;
  const ppm = PPM * zoom * zoomX(w, h);
  const vanY = vanScreenY(w, h, roadH, ppm);

  ctx.save();
  ctx.fillStyle = '#8fbf6a';
  ctx.fillRect(0, 0, w, h);

  // Rotate the world so the route's heading points up the screen, and place
  // the van's world position at its fixed spot.
  ctx.translate(w * VAN_SX, vanY);
  ctx.rotate(-(camH ?? pos.h) - Math.PI / 2);
  ctx.scale(ppm, ppm);
  ctx.translate(-camX, -camY);

  const view = {
    cx: camX, cy: camY, radius: Math.hypot(w, h) / ppm, camH: camH ?? pos.h,
    ppm, season: SEASON, sun: SUN,
  };
  look.nextFrame();
  drawWorld(view, Math.max(w, h) / ppm, false);
  ctx.restore();

  drawVan(w, vanY, ppm);
  drawPeekSign(w, vanY, ppm);
  const vanTop = vanY - (car.length || 4.8) * ppm / 2;
  const win = drawLookAhead(w, h, vanTop, pos);
  drawSpeedCamera(w, roadH, win);
  if (dash) {
    dashboard.draw(ctx, dash, w, h, {
      v: car.v, gear: car.gear, tooFast: car.verdict === 'fast', gearHint: car.gearHint,
      handbrake, guide: showGuide, jostle: car.jostle,
      x: car.x, y: car.y, camH: camH ?? pos.h, route, s: car.s, roads,
    });
  }
  // What a test needs to measure the view: metres of road ahead of the van.
  car.view = { stripH, roadH, vanY, ppm, ahead: vanY / ppm, guide: showGuide,
    look: win && { ...win, q: la.q, ppm: la.drawn?.ppm } };
  updateHud(win);
}

/** Everything in the world, under a transform the caller has set: the road
 *  view's, or the look-ahead window's (inWindow), which also draws the van
 *  itself in the world, as the road view draws it on its pin. */
function drawWorld(view, roadR, inWindow) {
  if (scn) scenery.drawGround(ctx, scn, view);
  drawRoads(view.cx, view.cy, roadR);
  if (scn) scenery.drawObjects(ctx, scn, view);
  tripStrip.drawSigns(ctx, strip, view);
  if (showGuide) drawGuide();
  if (trf) traffic.draw(ctx, trf, view);
  if (xing) crossings.draw(ctx, xing, view);
  if (inWindow) drawVanInWorld();
  else if (dust.length) drawDust();
}

/** The look-ahead window (look-ahead.js), while she pokes out. Returns its
 *  outside on screen, or null while it is shut. */
function drawLookAhead(w, h, vanTop, pos) {
  if (la.q <= 0) return null;
  return lookAhead.draw(ctx, la, w, h, {
    camH: camH ?? pos.h,
    van: { s: car.s, x: car.x, y: car.y, front: car.s + (car.length || 4.8) / 2 },
    reason: lookReason(), horizon: car.s + LOOK_CLEAR_M,
    safe: car.laneWant === 1 ? !trf?.last?.unsafe : car.peekSafe,
    vanTop, season: SEASON, sun: SUN, reduce: reduceMotion.matches,
  }, drawWorld, dash && {
    frame: (g, x, y, ww, hh, b) => dashboard.windowFrame(g, dash, x, y, ww, hh, b),
    glass: (g, R) => dashboard.windowGlass(g, R),
  });
}

/** The van in world metres, for the look-ahead window: as drawVan draws it,
 *  its shadow along the sun. */
function drawVanInWorld() {
  const name = VAN_ID + '-rear';
  const aspect = vanImg && vanImg.width ? vanImg.height / vanImg.width : 2.0;
  const wm = VAN_W_M, hm = VAN_W_M * aspect, turn = (car.heading ?? 0) + Math.PI / 2;
  ctx.save();
  ctx.translate(car.x + SUN.x * 1.9, car.y + SUN.y * 1.9); ctx.rotate(turn);
  if (!look.shadow(ctx, name, vanImg, VAN_W_M, wm, hm)) {
    ctx.fillStyle = 'rgba(40,46,38,.22)';
    ctx.beginPath(); ctx.ellipse(0, 0, wm * 0.46, hm * 0.46, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.translate(car.x, car.y); ctx.rotate(turn);
  if (!look.body(ctx, name, vanImg, VAN_W_M, wm, hm, { key: 'van', odo: car.s, nose: 'up' })) {
    ctx.fillStyle = '#749c66'; ctx.fillRect(-wm / 2, -hm / 2, wm, hm);
  }
  ctx.restore();
}

/** Stroke the segment (ax,ay)-(bx,by) shifted sideways by off metres. The
 *  path is rebuilt at the offset: a canvas fixes a path's points when they
 *  are added, so translating before stroke() moves nothing — which is how the
 *  spike's first edge lines all landed on the centreline. */
function strokeOffset(ax, ay, bx, by, off) {
  const a = Math.atan2(by - ay, bx - ax) + Math.PI / 2;
  const ox = Math.cos(a) * off, oy = Math.sin(a) * off;
  ctx.beginPath(); ctx.moveTo(ax + ox, ay + oy); ctx.lineTo(bx + ox, by + oy); ctx.stroke();
}

/** Every edge whose midpoint is within the view radius, stroked by class. One
 *  pass over 970 edges per frame is nothing, so there is no spatial index. */
function drawRoads(cx, cy, radius) {
  // The painted surface and hand-painted lines; at ?road=0 the flat look below.
  if (roadPaint.draw(ctx, cx, cy, radius)) return;
  const r2 = radius * radius;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of ['surface', 'marking']) {
    for (let k = 0; k < graph.edges.length; k++) {
      const [i, j, cls] = graph.edges[k];
      if (i < 0 || j < 0 || i >= graph.nodes.length || j >= graph.nodes.length) continue;
      const a = graph.nodes[i], b = graph.nodes[j];
      const ax = a[0] * ASPECT * METRES_PER_UNIT, ay = a[1] * METRES_PER_UNIT;
      const bx = b[0] * ASPECT * METRES_PER_UNIT, by = b[1] * METRES_PER_UNIT;
      const mx = (ax + bx) / 2 - cx, my = (ay + by) / 2 - cy;
      if (mx * mx + my * my > r2 * 1.6) continue;
      const cw = cls === 'trunk' ? cwByEdge.get(k) ?? null : null;
      const kind = cls !== 'trunk' ? null : cw ? cw.kind : 'dual';
      const width = roadWidth(cls, cw);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      if (pass === 'surface') {
        ctx.strokeStyle = '#6c6f6b'; ctx.lineWidth = width; ctx.setLineDash([]); ctx.stroke();
        if (cls === 'track') continue;
        ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 0.3;
        strokeOffset(ax, ay, bx, by, width / 2 - 0.4);
        strokeOffset(ax, ay, bx, by, -(width / 2 - 0.4));
      } else if (kind === 'divided') {
        // A narrow kerbed island down the middle, a kerb line each side of
        // it, and with two lanes each way a dashed line between them.
        const half = ISLAND_M / 2;
        ctx.strokeStyle = '#b9b3a3'; ctx.lineWidth = ISLAND_M; ctx.stroke();
        ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 0.25;
        strokeOffset(ax, ay, bx, by, half); strokeOffset(ax, ay, bx, by, -half);
        if (cw.lanes >= 2) {
          ctx.strokeStyle = '#f7f2e4'; ctx.lineWidth = 0.28; ctx.setLineDash([3, 4]);
          strokeOffset(ax, ay, bx, by, half + LANE_M); strokeOffset(ax, ay, bx, by, -(half + LANE_M));
          ctx.setLineDash([]);
        }
      } else if (kind === 'dual') {
        // Two carriageways: a grass strip down the middle with a kerb line
        // each side, and a dashed line between each pair of lanes.
        const lw = TRUNK_LANE_M, half = RESERVATION_M / 2;
        ctx.strokeStyle = '#7fae5c'; ctx.lineWidth = RESERVATION_M; ctx.stroke();
        ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 0.25;
        strokeOffset(ax, ay, bx, by, half); strokeOffset(ax, ay, bx, by, -half);
        ctx.strokeStyle = '#f7f2e4'; ctx.lineWidth = 0.28; ctx.setLineDash([3, 4]);
        strokeOffset(ax, ay, bx, by, half + lw); strokeOffset(ax, ay, bx, by, -(half + lw));
        ctx.setLineDash([]);
      } else if (cls !== 'track') {
        ctx.strokeStyle = '#f7f2e4'; ctx.lineWidth = 0.28;
        ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }
}

/** The line Lily's game draws from the car's nose along the route ahead. Ours
 *  is the route we already compute for the GPS, drawn instead of spoken. */
function drawGuide() {
  const ahead = 90;
  ctx.beginPath();
  for (let d = 0; d <= ahead; d += 4) {
    const p = atDistance(Math.min(routeLen, car.s + d));
    const nx = Math.cos(p.h + Math.PI / 2), ny = Math.sin(p.h + Math.PI / 2);
    const lane = car.laneWant === 1 || (car.peek && car.peekSafe && car.laneT > 0.02) ? 1 : 0;
    const off = d < 12 ? car.lane : laneOffset(lane, car.s + d);
    const x = p.x + nx * off, y = p.y + ny * off;
    if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(70,120,210,.72)';
  ctx.lineWidth = 0.9; ctx.lineCap = 'round';
  ctx.stroke();
}

/** While she pokes out to look (37A): a small round sign by the centre
 *  line just ahead of the van, green with an arrow when the road allows an
 *  overtake, amber with a pause when it does not. No words. It fades in as
 *  she eases out and away as she comes back. */
function drawPeekSign(w, vanY, ppm) {
  if (!car.peek || !canOvertakeAt(car.s)) return;
  const off0 = laneOffset(0, car.s), off1 = laneOffset(1, car.s);
  if (Math.abs(off1 - off0) < 1e-3) return;
  const k = Math.min(1, Math.max(car.ask * 2.5, car.laneT / (PEEK_T * 0.5)));
  if (k < 0.02) return;
  const x = w * VAN_SX + ((off0 + off1) / 2 - car.lane) * ppm;
  const y = vanY - ((car.length || 4.8) / 2 + 2.4) * ppm;
  const r = Math.max(13, 0.62 * ppm);
  // An arrow up the road and over for go; two bars for wait.
  lookAhead.cue(ctx, x, y, r, car.peekSafe, k);
}

function drawVan(w, vanY, ppm) {
  const px = w * VAN_SX, py = vanY + lurchM() * ppm;   // a gear change's lurch
  const wpx = VAN_W_M * ppm;
  const aspect = vanImg && vanImg.width ? vanImg.height / vanImg.width : 2.0;
  const hpx = wpx * aspect;
  const name = VAN_ID + '-rear';
  // Only the difference between where the van points and where the camera
  // points, so it turns a little in the frame while the world turns a lot.
  const turn = wrapAngle((car.heading ?? 0) - (camH ?? 0));

  // The shadow falls along the world's sun, not a fixed screen offset, so it
  // agrees with every tree and roof shadow when the camera turns. Rotating
  // the sun vector by the camera turns it into screen space. The body is
  // ~1.9m tall. Cast from the outlined silhouette, as traffic's are.
  const rot = -(camH ?? 0) - Math.PI / 2;
  const sx = (SUN.x * Math.cos(rot) - SUN.y * Math.sin(rot)) * 1.9 * ppm;
  const sy = (SUN.x * Math.sin(rot) + SUN.y * Math.cos(rot)) * 1.9 * ppm;
  ctx.save();
  ctx.translate(px + sx, py + sy);
  ctx.rotate(turn);
  if (!look.shadow(ctx, name, vanImg, VAN_W_M, wpx, hpx)) {
    ctx.fillStyle = 'rgba(40,46,38,.22)';
    ctx.beginPath(); ctx.ellipse(0, 0, wpx * 0.46, hpx * 0.46, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(turn);
  // Outlined like the hedges, its tyres turning by the distance driven.
  if (!look.body(ctx, name, vanImg, VAN_W_M, wpx, hpx, { key: 'van', odo: car.s, nose: 'up' })) {
    ctx.fillStyle = '#749c66'; ctx.fillRect(-wpx / 2, -hpx / 2, wpx, hpx);
  }
  ctx.restore();
}


/** A one-off word over the road — "CLOSE!" for a clean overtake. Praise for
 *  skill, never a score. */
const TOAST_TEXT = { close: 'CLOSE! 😱', beep: 'beep beep!', camera: '📸 speed camera!' };
let toastTimer = 0;
function toast(ev) {
  const el = document.getElementById('toast');
  const label = document.createElement('span');
  label.textContent = TOAST_TEXT[ev] ?? ev;
  el.replaceChildren(label);
  // Over road already driven, between the van's tail and the dashboard; held
  // sideways there is no room there, so beside the van, over the left verge.
  // Never over the road ahead, where the animals and the traffic are.
  const v = car.view, r = canvas.getBoundingClientRect(), wrap = el.parentElement.getBoundingClientRect();
  if (v && v.ppm) {
    const x0 = r.left - wrap.left, y0 = r.top - wrap.top;
    const half = (car.length || 4.8) * v.ppm / 2, tail = v.vanY + half;
    const room = v.roadH - tail;
    if (room >= 56) {
      Object.assign(el.style, { left: x0 + 'px', width: r.width + 'px', top: (y0 + tail + room / 2) + 'px' });
    } else {
      const side = r.width * VAN_SX - VAN_W_M * v.ppm / 2 - 14;
      Object.assign(el.style, { left: x0 + 'px', width: Math.max(140, side) + 'px', top: (y0 + v.vanY) + 'px' });
    }
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1100);
}

/** The trip strip (trip-strip.js): up the left edge of the road view, below
 *  the chips and below where the look-ahead window opens, above the
 *  dashboard. Where the chips end is measured when they change size. */
const strip = tripStrip.create(document.getElementById('wrap'));
const stripAt = { chips: 0, left: 0, top: 0 };
function measureStrip() {
  const t = document.getElementById('top'), wrapTop = t.parentElement.getBoundingClientRect().top;
  stripAt.chips = Math.max(...[...t.children].map(e => e.hidden ? 0 : e.getBoundingClientRect().bottom)) - wrapTop;
  stripAt.left = canvas.offsetLeft; stripAt.top = canvas.offsetTop;
  strip.key = '';
}
const stripRO = new ResizeObserver(measureStrip);
stripRO.observe(document.getElementById('top')); stripRO.observe(canvas);
window.addEventListener('resize', measureStrip);
function updateTrip() {
  const v = car.view;
  if (!v) return;
  const w = parseFloat(canvas.style.width) || canvas.width, h = parseFloat(canvas.style.height) || canvas.height;
  const vanTop = v.vanY - (car.length || 4.8) * v.ppm / 2;
  tripStrip.layout(strip, {
    left: stripAt.left, top: stripAt.top, w, h, roadH: v.roadH, clearTop: stripAt.chips,
    look: lookAhead.rect({ q: 1 }, w, h, vanTop),
  });
  tripStrip.update(strip, { s: car.s, arrived: !!car.arrived, reduce: reduceMotion.matches });
}

/** The chips and the dev button fade while the look-ahead
 *  window (in the canvas's own px) is over any of them, and come back when
 *  it goes. */
const topEl = document.getElementById('top');
const topParts = ['hud', 'panel'].map(id => document.getElementById(id));
let topAway = false;
function giveWay(win) {
  let away = false;
  if (win) {
    const c = canvas.getBoundingClientRect();
    const L = c.left + win.x, T = c.top + win.y, R = L + win.w, B = T + win.h;
    away = topParts.some(el => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.left < R && r.right > L && r.top < B && r.bottom > T;
    });
  }
  if (away !== topAway) { topAway = away; topEl.classList.toggle('away', away); }
}

function updateHud(win) {
  updateTrip();
  giveWay(win);
  document.getElementById('gearChip').textContent = handbrake ? 'BRAKE' : String(car.gear);
  document.getElementById('speedChip').textContent = Math.round(car.v * 2.237) + ' mph';
  document.getElementById('laneChip').textContent = car.laneWant === 0 ? (car.peek && car.laneT > 0.02 ? 'looking' : 'left lane')
    : bigRoadAt(car.s) || (car.cw?.kind === 'divided' && car.cw.lanes >= 2) ? 'fast lane' : 'overtaking';

  const chip = document.getElementById('roadChip');
  const name = roadNameFor(car.road, car.cw);
  const verdict = gearVerdict(car.road, car.cw, car.gear, car.v);
  if (!verdict) {
    chip.textContent = name;
    chip.style.background = 'rgba(255,252,246,.92)'; chip.style.color = '#3a3226';
  } else {
    const over = verdict === 'fast';
    chip.textContent = name + ' — ' + (over ? (TOO_FAST[car.road] ?? 'too fast') : (TOO_SLOW[car.road] ?? 'too slow'));
    chip.style.background = over ? '#c4562f' : '#d8a21e'; chip.style.color = '#fff';
  }
}

// --------------------------------------------------------------------- input

// Each finger is tracked on its own, so she can hold the road with one and
// pull the handbrake or change gear with another. A touch that starts on the
// dashboard is for the dashboard and is never "go"; only one that starts on
// the road holds the throttle or swipes between lanes.
//
// At a computer (Marcus, from Lily's play, 2026-10-12: "The Handbrake should
// be the Space bar, and pressing the touch pad / clicking the mouse down is
// Go"): the mouse button or a touchpad press held on the road is go, exactly
// as a finger is, and dragging it sideways is the same swipe. A click on the
// dashboard's gears, horn, handbrake or guide switch does only that. Space
// held is the handbrake, and so is B. → held eases out to look and then
// overtakes, ← comes back, 1–3 pick a gear, H is the horn, G the guide line.
// Only the main button counts, so a right-click is never go. Each press is
// captured to the canvas, so letting go outside the window still stops the
// van, and the window losing focus lets go of everything.
const goPointers = new Set();
const brakeKeys = new Set();   // ' ' and 'b' while held
let brakePointer = null;
let dragId = null, dragX = null, dragLane = 0;
function setThrottle() { throttle = goPointers.size > 0; }
function setHandbrake() { handbrake = brakeKeys.size > 0 || brakePointer !== null; }
function honk() { if (dash) dashboard.honk(dash); toast('beep'); }
function hold(e) { try { canvas.setPointerCapture(e.pointerId); } catch { /* already gone */ } }

function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const what = dash ? dashboard.hit(dash, x, y) : null;
  if (what) {
    if (what === 'handbrake') { brakePointer = e.pointerId; hold(e); setHandbrake(); }
    else if (what === 'horn') honk();
    else if (what === 'guide') setGuide(!showGuide);
    else if (what.startsWith('gear')) setGear(Number(what.slice(4)));
    return;
  }
  hold(e);
  goPointers.add(e.pointerId); setThrottle();
  if (dragId === null) { dragId = e.pointerId; dragX = e.clientX; dragLane = car.laneWant; }
}
function onMove(e) {
  if (e.pointerId !== dragId || dragX === null) return;
  // The swipe is measured from where it started, or from where the van last
  // changed lane under it, or from as far left as it has been.
  if (car.laneWant !== dragLane) { dragLane = car.laneWant; dragX = e.clientX; }
  let dx = (e.clientX ?? dragX) - dragX;
  if (car.laneWant === 1) {
    if (dx < -26) { car.laneWant = 0; dragLane = 0; dragX = e.clientX; }
    return;
  }
  if (dx < 0) { dragX = e.clientX; dx = 0; }
  if (!car.returning) car.ask = Math.min(1, dx / SWIPE_FULL_PX);
}
function onUp(e) {
  goPointers.delete(e.pointerId); setThrottle();
  if (e.pointerId === dragId) { dragId = null; dragX = null; letGo(); }
  if (e.pointerId === brakePointer) { brakePointer = null; setHandbrake(); }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('lostpointercapture', onUp);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
// A ctrl-click or two-finger click would open a menu that swallows the
// release, so the road has none.
canvas.addEventListener('contextmenu', e => e.preventDefault());

/** Space or B, as the set of held handbrake keys knows them. */
function brakeKey(e) {
  if (e.key === ' ' || e.code === 'Space') return ' ';
  if (e.key === 'b' || e.key === 'B') return 'b';
  return null;
}
window.addEventListener('keydown', e => {
  const brake = brakeKey(e);
  if (brake) { brakeKeys.add(brake); setHandbrake(); }
  // Space would scroll the page or press whichever button last had focus.
  if (brake === ' ') e.preventDefault();
  if (e.key === 'ArrowRight') keyRight = true;   // held: eases out to look, then overtakes
  if (e.key === 'ArrowLeft') { keyRight = false; car.ask = 0; car.laneWant = 0; }
  if ((e.key === 'h' || e.key === 'H') && !e.repeat) honk();
  if ((e.key === 'g' || e.key === 'G') && !e.repeat && !e.ctrlKey && !e.metaKey) setGuide(!showGuide);
  if (['1', '2', '3'].includes(e.key) && !e.repeat) setGear(Number(e.key));
});
window.addEventListener('keyup', e => {
  const brake = brakeKey(e);
  if (brake) { brakeKeys.delete(brake); setHandbrake(); }
  if (brake === ' ') e.preventDefault();
  if (e.key === 'ArrowRight') { keyRight = false; letGo(); }
});
window.addEventListener('blur', () => {
  keyRight = false; brakeKeys.clear(); goPointers.clear(); brakePointer = null;
  dragId = null; dragX = null; letGo(); setThrottle(); setHandbrake();
});

document.getElementById('devBtn').onclick = (e) => {
  const tools = document.getElementById('devTools');
  tools.hidden = !tools.hidden;
  document.getElementById('note').hidden = tools.hidden;
  e.currentTarget.setAttribute('aria-pressed', String(!tools.hidden));
};
document.getElementById('routeBtn').onclick = () => { pickRoute(); car.s = 0; car.v = 0; car.base = null; };

/** Jump to a route that uses the dual carriageway, starting just before it,
 *  so the zoom-out can be judged without hunting for one; "to A28 town" does
 *  the same for its divided and single stretches, in turn. */
function jumpTo(want) {
  for (let tries = 0; tries < 120; tries++) {
    pickRoute();
    const k = route.findIndex(p => p.cls === 'trunk' && want(p.cw?.kind ?? 'dual'));
    if (k > 0) {
      car.s = Math.max(0, route[k - 1].s - 60); car.v = 0; car.base = null; camH = null;
      return;
    }
  }
}
document.getElementById('trunkBtn').onclick = () => jumpTo(kind => kind === 'dual');
/** Each press the other of the A28's town stretches: divided, then single. */
let a28Next = 'divided';
document.getElementById('a28Btn').onclick = () => {
  const want = a28Next;
  a28Next = want === 'divided' ? 'single' : 'divided';
  jumpTo(kind => kind === want);
};

// ---------------------------------------------------------------------- boot

async function boot() {
  const res = await fetch('/assets/driving/birchie-graph.json');
  graph = await res.json();
  try {
    const cr = await fetch('/assets/driving/trunk-carriageways.json');
    if (cr.ok) loadCarriageways(await cr.json());
  } catch { /* without it every trunk edge is a dual carriageway, as before */ }
  adj = buildAdjacency(graph);
  await tripStrip.load(strip);
  pickRoute();
  // Both learn each A28 edge's carriageway by its index into graph.edges.
  const carriagewayOf = k => (graph.edges[k]?.[2] === 'trunk' ? cwByEdge.get(k) ?? null : null);
  scn = await scenery.load({ graph, mapToWorld, metresPerMapPx: METRES_PER_MAP_PX,
    roadHalf: (k, cls) => roadWidth(cls, carriagewayOf(k)) / 2 });
  roadPaint.load({ graph, ctx, roadWidth, carriagewayOf, season: SEASON,
    trunk: { lane: TRUNK_LANE_M, reservation: RESERVATION_M, island: ISLAND_M },
    nodeXY: n => [n[0] * ASPECT * METRES_PER_UNIT, n[1] * METRES_PER_UNIT] });
  roads = graph.edges
    .filter(([i, j]) => i >= 0 && j >= 0 && i < graph.nodes.length && j < graph.nodes.length)
    .map(([i, j, cls]) => {
      const a = graph.nodes[i], b = graph.nodes[j];
      return [a[0] * ASPECT * METRES_PER_UNIT, a[1] * METRES_PER_UNIT,
        b[0] * ASPECT * METRES_PER_UNIT, b[1] * METRES_PER_UNIT, cls];
    });
  dash = await dashboard.load();
  await look.load();
  window.__dash = dash;   // its layout and needle, for a test

  vanImg = new Image();
  vanImg.src = '/assets/driving/topdown/vehicle-topdown-' + VAN_ID + '-rear.png';
  tripStrip.setVan(strip, vanImg.src);
  await new Promise(r => { vanImg.onload = r; vanImg.onerror = () => { vanImg = null; r(); }; });

  resize();
  window.addEventListener('resize', resize);

  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); draw();
    requestAnimationFrame(frame);
  })(last);
}
boot();
</script>
