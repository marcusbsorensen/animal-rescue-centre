<body>

<div class="vp-bar">
  <strong>Friends v1</strong>
  <span>·</span>
  <button data-size="iphone">📱 iPhone (390×844)</button>
  <button data-size="ipad-p" class="on">📱 iPad P (768×1024)</button>
  <button data-size="ipad-l">📱 iPad L (1024×768)</button>
  <button data-size="desktop">🖥 Desktop (1280×800)</button>
  <a href="/admin/menu.html">→ Main menu</a>
  <span class="hint">(real logo + contextual animals)</span>
</div>

<div class="device-frame">
  <div class="device" id="device" data-size="ipad-p">
    <div class="welcome">

      <div class="welcome-inner">

        <div class="top-strip">
          <button class="audio-btn" aria-label="Toggle sound">🔊</button>
        </div>

        <div class="welcome-content">
          <div class="logo-wrap">
            <img class="logo-img" src="/assets/logo/arc-logo-portrait.png" alt="A.R.C. — Animal Rescue Centre">
            <img class="logo-bunny" src="/assets/animals/bunny-dutch-sheltered.png" alt="">
          </div>

          <div class="text-block">
            <div class="signs-on-stake">
              <div class="intro">
                <img class="intro-cat" src="/assets/animals/cat-black-sleeping.png" alt="">
                <img class="play-parrot" src="/assets/animals/parrot-grey-sheltered.png" alt="">
                <button class="back-tab" id="back-btn">← Menu</button>
                <img class="sign-logo" src="/assets/logo/arc-logo-portrait.png" alt="A.R.C.">
                <div class="sign-title">Your A.R.C. Friends</div>
                <div class="friends-list" id="friends-list"><!-- friend cards injected by JS --></div>
              </div>

              <div class="cta-stack">
                <!-- Single combined invite panel — the old separate
                     INVITE A FRIEND button did nothing useful (no
                     handler beyond posting an unused 'invite-friend'
                     event), so we fold it into the share-your-code
                     pill so the kid sees ONE clear action: "share
                     this code with a friend so they can play with
                     you". Tap to copy. -->
                <button class="invite-share-panel" id="copy-code-btn" type="button" aria-label="Tap to copy your friend code">
                  <span class="invite-share-stamp">📮</span>
                  <span class="invite-share-text">
                    <span class="invite-share-line1">Invite a friend!</span>
                    <span class="invite-share-line2">
                      <span class="invite-share-prefix">Your code:</span>
                      <!-- Was SUNNY-FOX-2026. The copy button below reads
                           this element's textContent, so a session without a
                           joinCode had the child sharing a code that belongs
                           to nobody. See the copy guard in the script. -->
                      <span class="invite-share-code" id="friend-code">—</span>
                    </span>
                  </span>
                  <span class="invite-share-icon" aria-hidden="true">📋</span>
                </button>

                <!-- Their code, typed here: the other half of the panel above.
                     The page tidies what is typed (fox428 is FOX-428); the
                     game asks the server and says how it went. -->
                <form class="add-friend" id="add-friend-form" novalidate autocomplete="off">
                  <p class="add-friend-title">Add a friend!</p>
                  <p class="add-friend-msg" id="add-friend-msg" role="status" aria-live="polite"></p>
                  <div class="add-friend-row">
                    <input class="add-friend-input" id="add-friend-input" type="text" maxlength="16"
                           placeholder="Friend's code" aria-label="Type your friend's code"
                           aria-describedby="add-friend-msg"
                           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
                           enterkeyhint="go">
                    <button class="link-btn plank-sage" id="add-friend-btn" type="submit">Add</button>
                  </div>
                </form>
              </div>

              <!-- Bunny sitting on the ground at the foot of the garden post -->
              <img class="ground-bunny" src="/assets/animals/bunny-lop-sheltered.png" alt="">

              <!-- Painted grass clump with ladybird, daisies, clover (from Manus) -->
              <img class="foreground-fox" src="/assets/animals/fox-cross-walking.png" alt="">
              <img class="grass-clump" src="/admin/scene-assets/grass-clump.png" alt="" aria-hidden="true">

              <!-- Flying bee on its own animated layer above the grass -->
              <img class="bee-flyer" src="/admin/scene-assets/bee-flying.png" alt="" aria-hidden="true">
            </div>
          </div>
        </div>

        <div class="credits">
          <span class="credit-scrawl credit-left">Designed by Lily age 8</span>
          <span class="credit-scrawl credit-right">Built by Dad and Claude Code</span>
        </div>

      </div>

      <!-- Foreground corner animals — the 'cast' welcoming the player.
           Only the dog: the cross-fox already peeks out from behind the
           leftmost grass blade (foxPeek animation), so a second arctic
           fox in the corner reads as a duplicate. -->
      <img class="foreground-dog" src="/assets/animals/dog-husky-sheltered.png" alt="">

    </div>
  </div>
</div>

<script>
  const device = document.getElementById('device');
  for (const btn of document.querySelectorAll('.vp-bar button[data-size]')) {
    btn.addEventListener('click', () => {
      for (const b of document.querySelectorAll('.vp-bar button[data-size]')) b.classList.remove('on');
      btn.classList.add('on');
      device.dataset.size = btn.dataset.size;
    });
  }
  // Sample friends data — shown in the screen preview AND as the default
  // when the host hasn't sent an 'init' payload yet. Three of these are
  // SAMPLE_FRIENDS for design preview ONLY — never render apprentices
  // here because they're a separate recruitment flow, not real player
  // friends. Real friends come from the host init payload (p.friends).
  // Empty by default so live test players don't see fake friends or
  // misleading "Recruit!" buttons.
  const SAMPLE_FRIENDS = [];

  // Set of apprentice ids already recruited — populated from host init.
  let RECRUITED = new Set();

  // Progressive bond levels — 1=Sprout (just starting) through 5=Champion.
  // Single medal on the right of each row replaces the old 5-paw meter.
  const BOND_LEVELS = [
    { emoji: '🌱', label: 'Sprout' },     // 1
    { emoji: '🌿', label: 'Bud' },        // 2
    { emoji: '🌸', label: 'Bloom' },      // 3
    { emoji: '🌺', label: 'Flourish' },   // 4
    { emoji: '🏆', label: 'Champion' },   // 5
  ];

  // Render friend cards with document.createElement + textContent only —
  // every string field comes from untrusted host payloads, so we never
  // touch innerHTML. Click handlers only fire in embed mode (closures).
  //
  // A card is a group, not a button: it holds Recruit and Remove, and a
  // button inside a button is two controls a screen reader cannot tell
  // apart. Tapping the card itself still sends 'open-friend'.
  function renderFriends(friends, onOpen, onRecruit, onRemove) {
    const list = document.getElementById('friends-list');
    if (!list) return;
    list.textContent = '';  // clear
    CONFIRMING = null;
    // Empty state — no friends yet.
    if (!friends || friends.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'friends-empty';
      const line1 = document.createElement('div');
      line1.className = 'friends-empty-line1';
      line1.textContent = 'No friends here yet!';
      const line2 = document.createElement('div');
      line2.className = 'friends-empty-line2';
      line2.textContent = 'Share your code below, or type a friend\'s code.';
      empty.appendChild(line1);
      empty.appendChild(line2);
      list.appendChild(empty);
      return;
    }
    for (const f of friends) list.appendChild(friendCard(f, onOpen, onRecruit, onRemove));
  }

  const nameOf = (f) => (typeof f.displayName === 'string' ? f.displayName : '');

  // A display name is two words run together (CuriousDormouse99). On a
  // narrow card it may break between the two, and nowhere else: a zero-width
  // space marks the place, which keeps the name one run of text.
  const nameWithBreaks = (name) => name.split(/(?=[A-Z])/).join('\u200B');

  function friendAvatar(f) {
    const avatarWrap = document.createElement('div');
    avatarWrap.className = 'friend-avatar-wrap';
    const avatar = document.createElement('span');
    avatar.className = 'friend-avatar';
    avatar.textContent = typeof f.emoji === 'string' ? f.emoji : '🐾';
    if (typeof f.bg === 'string') avatar.style.background = f.bg;
    avatarWrap.appendChild(avatar);
    if (f.online) {
      const dot = document.createElement('span');
      dot.className = 'online-dot';
      dot.setAttribute('aria-label', 'online');
      avatarWrap.appendChild(dot);
    }
    return avatarWrap;
  }

  function friendCard(f, onOpen, onRecruit, onRemove) {
    const card = document.createElement('div');
    card.className = 'friend-card';
    card.setAttribute('role', 'group');
    card.setAttribute('aria-label', nameOf(f));
    if (typeof f.id === 'string') card.dataset.friendId = f.id;

    card.appendChild(friendAvatar(f));

    const info = document.createElement('div');
    info.className = 'friend-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'friend-name';
    // The friend's display name from the word lists, never their login.
    nameEl.textContent = nameWithBreaks(nameOf(f));
    info.appendChild(nameEl);

    // Last visit — only when the host sent one. None does yet, and a line
    // that read "Last visit: —" on every card said something was missing.
    if (typeof f.lastVisit === 'string' && f.lastVisit.trim() !== '') {
      const visitEl = document.createElement('div');
      visitEl.className = 'friend-visit';
      visitEl.textContent = 'Last visit: ' + f.lastVisit;
      info.appendChild(visitEl);
    }

    // Apprentice-able hint — shown only on the three recruitable kids
    // (Rhubarb / Amara / Kofi). Once they're recruited, we swap the
    // chip copy to a quiet "⭐ Apprentice" confirmation instead.
    if (typeof f.apprenticeId === 'string') {
      const recruited = RECRUITED.has(f.apprenticeId);
      const chip = document.createElement('div');
      chip.className = 'apprentice-chip';
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent = '⭐';
      chip.appendChild(star);
      const chipText = document.createElement('span');
      chipText.textContent = recruited ? 'Apprentice' : 'Apprentice-able';
      chip.appendChild(chipText);
      info.appendChild(chip);
    }
    card.appendChild(info);

    // Recruit button — right-aligned, only for apprentice-able friends
    // who haven't been recruited yet. Stops card click from also firing.
    if (typeof f.apprenticeId === 'string' && !RECRUITED.has(f.apprenticeId)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'recruit-btn';
      btn.textContent = 'Recruit!';
      btn.setAttribute('aria-label', 'Recruit ' + nameOf(f) + ' as an apprentice');
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (typeof onRecruit === 'function') onRecruit(f.apprenticeId);
      });
      card.appendChild(btn);
    }

    // Single progressive bond medal on the right — 1..5 → Sprout..Champion —
    // only for a friend the host sent a bond for. None does yet: with the
    // bond missing, the old arithmetic floored it to level 1 and every friend
    // wore a Sprout, a level nobody had earned.
    if (Number.isInteger(f.bond) && f.bond >= 1) {
      const level = BOND_LEVELS[Math.min(5, f.bond) - 1];
      const medalWrap = document.createElement('div');
      medalWrap.className = 'friend-medal-wrap';
      const medal = document.createElement('span');
      medal.className = 'friend-medal';
      medal.setAttribute('aria-label', 'Bond: ' + level.label);
      medal.textContent = level.emoji;
      medalWrap.appendChild(medal);
      const medalLabel = document.createElement('span');
      medalLabel.className = 'friend-medal-label';
      medalLabel.textContent = level.label;
      medalWrap.appendChild(medalLabel);
      card.appendChild(medalWrap);
    }

    // Remove (146A) — on a real friend only: one the server knows by id,
    // not an apprentice. It asks first, on the card.
    if (typeof onRemove === 'function' && typeof f.id === 'string' && typeof f.apprenticeId !== 'string') {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'remove-btn';
      btn.setAttribute('aria-label', 'Remove ' + nameOf(f) + ' from your friends');
      const plank = document.createElement('span');
      plank.className = 'remove-plank';
      plank.textContent = 'Remove';
      btn.appendChild(plank);
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        askToRemove(card, f, onOpen, onRecruit, onRemove);
      });
      card.appendChild(btn);
    }

    if (typeof onOpen === 'function') {
      card.addEventListener('click', () => {
        if (!card.classList.contains('confirming')) onOpen(f.displayName);
      });
    }
    return card;
  }

  // The card asking "Remove MossyOtter from your friends?". One at a time.
  // Keep is the default: it has the focus, and Escape or a tap anywhere
  // else on the screen is Keep too. Only the Remove plank removes.
  let CONFIRMING = null;

  function askToRemove(card, f, onOpen, onRecruit, onRemove) {
    keepFriend(false);
    card.classList.add('confirming');
    card.textContent = '';
    card.appendChild(friendAvatar(f));

    const body = document.createElement('div');
    body.className = 'confirm-body';
    const question = document.createElement('div');
    question.className = 'confirm-question';
    question.id = 'confirm-question';
    question.textContent = 'Remove ' + nameWithBreaks(nameOf(f)) + ' from your friends?';
    body.appendChild(question);

    const row = document.createElement('div');
    row.className = 'confirm-row';
    const keep = document.createElement('button');
    keep.type = 'button';
    keep.className = 'keep-btn';
    keep.textContent = 'Keep';
    keep.setAttribute('aria-describedby', 'confirm-question');
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'confirm-remove-btn';
    remove.textContent = 'Remove';
    remove.setAttribute('aria-describedby', 'confirm-question');
    row.appendChild(keep);
    row.appendChild(remove);
    body.appendChild(row);

    const error = document.createElement('div');
    error.className = 'confirm-error';
    error.setAttribute('role', 'status');
    body.appendChild(error);
    card.appendChild(body);

    keep.addEventListener('click', (ev) => { ev.stopPropagation(); keepFriend(true); });
    remove.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (!CONFIRMING || CONFIRMING.waiting) return;
      CONFIRMING.waiting = true;
      keep.disabled = true;
      remove.disabled = true;
      card.setAttribute('aria-busy', 'true');
      error.textContent = '';
      onRemove(f.id);
    });

    CONFIRMING = {
      card, f, keep, remove, error, waiting: false,
      rebuild: () => friendCard(f, onOpen, onRecruit, onRemove),
    };
    keep.focus({ preventScroll: true });
    card.scrollIntoView({ block: 'nearest' });
  }

  /** Put the card back as it was. `refocus` when the child chose Keep. */
  function keepFriend(refocus) {
    if (!CONFIRMING || CONFIRMING.waiting) return;
    const { card, rebuild } = CONFIRMING;
    CONFIRMING = null;
    const fresh = rebuild();
    card.replaceWith(fresh);
    if (refocus) fresh.querySelector('.remove-btn')?.focus({ preventScroll: true });
  }

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && CONFIRMING) keepFriend(true);
  });
  document.addEventListener('pointerdown', (ev) => {
    if (CONFIRMING && !CONFIRMING.card.contains(ev.target)) keepFriend(false);
  });

  // Design-review preview (no ?embed): paint the sample friends at once.
  // In the game, the list waits for the host, which always sends one, so a
  // child with friends never sees "No friends here yet!" while it loads.
  const params = new URLSearchParams(location.search);
  if (!params.has('embed')) {
    renderFriends(SAMPLE_FRIENDS);
    // There is no game to ask here, and a form with no handler reloads the page.
    document.getElementById('add-friend-form')?.addEventListener('submit', (ev) => ev.preventDefault());
  }

  // Embed mode — when loaded inside the game as an overlay, drop the
  // simulator chrome and have the device fill the viewport. Clicks on the
  // primary CTAs postMessage up to the host scene instead of being dead.
  if (params.has('embed')) {
    document.body.classList.add('embed');
    const send = (type, payload) => {
      try { parent.postMessage({ source: 'arc-auth', type, payload }, '*'); } catch (_) {}
    };
    // The friends the host sent, or null until it has.
    let FRIENDS = null;

    // Add a friend by their code: the box beside the player's own. The page
    // makes what was typed a code (fox428, FOX 428 and fox-428 are FOX-428)
    // and says so when it cannot; the host asks the server and answers with
    // the friend, or with why not.
    const addForm = document.getElementById('add-friend-form');
    const addInput = document.getElementById('add-friend-input');
    const addBtn = document.getElementById('add-friend-btn');
    const addMsg = document.getElementById('add-friend-msg');
    // The code being asked about while the host answers; null otherwise.
    let ADDING = null;
    // What a child reads, by the reason the host (or this page) gives.
    const ADD_WORDS = {
      empty: "Type your friend's code.",
      'bad-code': 'A code is like OTTER-428.',
      'own-code': "That's your own code!",
      'not-found': 'No one has that code.',
      'already-friends': "You're already friends!",
      'too-many-tries': 'Too many tries. Wait a bit.',
      failed: "That didn't work. Try again.",
    };
    // How it went, in the title's place. `kind` is 'ok' for good news; anything
    // else is a reason it did not work, and marks the box as wrong.
    const say = (text, kind) => {
      addMsg.textContent = text || '';
      addMsg.classList.toggle('ok', kind === 'ok');
      if (text && kind !== 'ok') addInput.setAttribute('aria-invalid', 'true');
      else addInput.removeAttribute('aria-invalid');
    };
    // The host has answered: the box and the plank work again.
    const stopAdding = () => {
      ADDING = null;
      addInput.disabled = false;
      addBtn.disabled = false;
      addForm.removeAttribute('aria-busy');
    };
    // An animal's name (three to seven letters) then three numbers, however
    // they were typed: "OTTER-428", or null when what was typed is not that.
    const normaliseCode = (raw) => {
      const m = /^([A-Z]{3,7})([0-9]{3})$/.exec(String(raw).toUpperCase().replace(/[^A-Z0-9]/g, ''));
      return m ? m[1] + '-' + m[2] : null;
    };
    addForm.addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (ADDING) return;
      const typed = addInput.value;
      const code = typed.trim() === '' ? null : normaliseCode(typed);
      const problem = typed.trim() === '' ? 'empty' : (!code ? 'bad-code' : null);
      if (problem) { say(ADD_WORDS[problem]); addInput.focus({ preventScroll: true }); return; }
      addInput.value = code;
      // Their own code is answered here: the page knows it, and the server need not be asked.
      const own = normaliseCode(document.getElementById('friend-code')?.textContent || '');
      if (own && code === own) { say(ADD_WORDS['own-code']); addInput.focus({ preventScroll: true }); addInput.select(); return; }
      say('');
      ADDING = code;
      addInput.disabled = true;
      addBtn.disabled = true;
      addForm.setAttribute('aria-busy', 'true');
      send('add-friend', { joinCode: code });
    });
    // A new try starts with the last answer gone.
    addInput.addEventListener('input', () => { if (!ADDING) say(''); });
    const paint = () => {
      if (!FRIENDS) return;
      renderFriends(
        FRIENDS,
        (displayName) => send('open-friend', { displayName }),
        (id) => send('recruit-apprentice', { id }),
        (id) => send('remove-friend', { id }),
      );
    };
    // Handshake — parent sends the join code and recruited apprentices
    // ('init'), then the friends list ('friends') once it has loaded, and
    // the answer to each removal. We only render safe fields via
    // textContent so no sanitisation needed.
    window.addEventListener('message', (e) => {
      const m = e.data;
      if (m?.source !== 'arc-auth-host') return;
      const p = m.payload ?? {};
      if (m.type === 'init') {
        const codeEl = document.getElementById('friend-code');
        if (codeEl && typeof p.joinCode === 'string') codeEl.textContent = p.joinCode;
        if (Array.isArray(p.recruited)) {
          RECRUITED = new Set(p.recruited.filter((x) => typeof x === 'string'));
        }
        if (Array.isArray(p.friends)) FRIENDS = p.friends.filter((f) => f && typeof f === 'object');
        paint();
      }
      if (m.type === 'friends' && Array.isArray(p.friends)) {
        FRIENDS = p.friends.filter((f) => f && typeof f === 'object');
        paint();
      }
      // Gone for both players: off the list. The last one leaves the
      // "No friends here yet!" board.
      if (m.type === 'friend-removed' && typeof p.id === 'string' && FRIENDS) {
        FRIENDS = FRIENDS.filter((f) => f.id !== p.id);
        CONFIRMING = null;
        paint();
      }
      // A friend added by code. The host sends the friend, and the list as
      // the server now holds it when it could get that; the board shows the
      // list (or the list it had, with the friend on the end, which is where
      // the server puts a newer friend) and the new card is brought into view.
      if (m.type === 'friend-added' && p.friend && typeof p.friend === 'object' && typeof p.friend.id === 'string') {
        const base = Array.isArray(p.friends)
          ? p.friends.filter((f) => f && typeof f === 'object')
          : (FRIENDS || []);
        FRIENDS = base.some((f) => f.id === p.friend.id) ? base : [...base, p.friend];
        paint();
        stopAdding();
        // Done: an empty box, and the keyboard put away so the board shows.
        addInput.value = '';
        addInput.blur();
        say('You have a new friend!', 'ok');
        const fresh = Array.from(document.querySelectorAll('.friend-card')).find((c) => c.dataset.friendId === p.friend.id);
        fresh?.scrollIntoView({ block: 'nearest' });
      }
      // Not added: the reason, in the words below. Nothing on the board changes.
      if (m.type === 'friend-add-failed' && ADDING) {
        stopAdding();
        say(Object.prototype.hasOwnProperty.call(ADD_WORDS, p.reason) ? ADD_WORDS[p.reason] : ADD_WORDS.failed);
        addInput.focus({ preventScroll: true });
        addInput.select();
      }
      // Still friends: the question stays, with Keep and Remove back.
      if (m.type === 'friend-remove-failed' && CONFIRMING && CONFIRMING.f.id === p.id) {
        CONFIRMING.waiting = false;
        CONFIRMING.card.removeAttribute('aria-busy');
        CONFIRMING.keep.disabled = false;
        CONFIRMING.remove.disabled = false;
        CONFIRMING.error.textContent = "That didn't work. Try again.";
        CONFIRMING.keep.focus({ preventScroll: true });
      }
    });

    document.getElementById('back-btn')?.addEventListener('click', () => send('back-to-menu'));
    document.getElementById('invite-btn')?.addEventListener('click', () => send('invite-friend'));
    document.getElementById('copy-code-btn')?.addEventListener('click', () => {
      const code = (document.getElementById('friend-code')?.textContent || '').trim();
      // Refuse to copy the em-dash placeholder. Copying whatever happens to
      // be in the element is how the old hardcoded SUNNY-FOX-2026 could have
      // reached a real child's clipboard and then a real friend.
      if (!code || code === '—') return;
      try { navigator.clipboard?.writeText(code); } catch (_) {}
      send('copy-code', { code });
    });
  }
</script>
</body>
</html>
