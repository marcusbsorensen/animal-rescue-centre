<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Welcome</title>
<script>
  // Iframe-context detection — flips html.iframed before first paint
  // so design-preview chrome stays hidden when the page is mounted in-game.
  if (window.top !== window.self) document.documentElement.classList.add('iframed');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;600&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream-wash: #fef9ef;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --ink: #3a3a3a;
    --map-bg: #dec98a;
    --sea-bg: #bfdde3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream-wash);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 100vh;
    user-select: none;
  }
  html.iframed body { background: var(--cream-wash) !important; }

  .stage {
    flex: 1; position: relative;
    cursor: pointer;
    overflow: hidden;
    background: var(--map-bg);
  }
  .panel {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 500ms ease;
    pointer-events: none;
    overflow: hidden;
  }
  .panel.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ─── Map-zoom panels (1, 2, 3) ─────────────────────────────────────────
     Each uses the SAME OSM-derived Birchie map SVG as background, but at
     a different CSS scale + transform-origin so we get a smooth "camera
     pushing in" effect. The OSM SVG already includes the painted A.R.C.
     plot polygon at the right real-world position, so we just zoom toward
     its centre.

     Plot centre in the SVG is roughly (524, 348) of the 2400×721 canvas
     (= 21.8% from left, 48.3% from top of the canvas viewBox).
  */
  .panel.map-panel {
    background-image: url('/admin/scene-assets/birchie-map/birchie-roads.svg');
    background-size: cover;
    background-position: 21.8% 48.3%;  /* centred on A.R.C. plot */
  }
  .panel-1.active { animation: zoom-1 2.6s ease-in-out forwards; }
  .panel-2.active { animation: zoom-2 2.6s ease-in-out forwards; }
  .panel-3.active { animation: zoom-3 2.6s ease-in-out forwards; }

  @keyframes zoom-1 {
    /* Panel 1: zoomed-out — see Birchie + the sea + the plot pinned */
    from { background-size: 200%; }
    to   { background-size: 220%; }
  }
  @keyframes zoom-2 {
    /* Panel 2: zoom into the plot — building visible */
    from { background-size: 360%; }
    to   { background-size: 400%; }
  }
  @keyframes zoom-3 {
    /* Panel 3: even closer — life on the site, Henry van etc. */
    from { background-size: 600%; }
    to   { background-size: 660%; }
  }

  /* ─── Pin overlay on panel 1 ────────────────────────────────────────── */
  .panel .arc-pin {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -100%);
    width: 7%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
    pointer-events: none;
  }
  .panel .pin-bubble {
    position: absolute;
    left: 50%; top: 38%;
    transform: translate(-50%, 0);
    background: var(--honey-amber);
    border: 2.5px solid var(--honey-shadow);
    border-radius: 22px;
    padding: 6px 18px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(15px, 3vw, 24px);
    color: var(--ink);
    box-shadow: 2px 4px 0 rgba(0,0,0,0.18);
    white-space: nowrap;
  }

  /* ─── Painted building stamp on panels 2, 3 + 4 ─────────────────────── */
  .panel .building-stamp {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.25));
    pointer-events: none;
  }
  .panel-2 .building-stamp { width: 22%; }
  .panel-3 .building-stamp { width: 36%; }
  .panel-4 .building-stamp {
    width: 60%;
    top: 52%;
    animation: bldg-bob 2.6s ease-in-out infinite;
  }
  @keyframes bldg-bob {
    0%, 100% { transform: translate(-50%, -50%); }
    50%      { transform: translate(-50%, calc(-50% - 4px)); }
  }

  /* ─── "Life on site" overlay on panel 3 ─────────────────────────────── */
  .panel-3 .henry-van {
    position: absolute;
    left: 38%; top: 64%;
    width: 8%;
    filter: drop-shadow(1px 3px 4px rgba(0,0,0,0.3));
    pointer-events: none;
  }
  .panel-3 .site-anim {
    position: absolute;
    width: 5%;
    filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.3));
    pointer-events: none;
    animation: anim-bob 1.2s ease-in-out infinite;
  }
  @keyframes anim-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  /* ─── Panel 4 — final close-up + tap prompt ─────────────────────────── */
  .panel-4 {
    background: linear-gradient(180deg, #f6e8c2 0%, #e0c8a0 100%);
  }
  .panel-4 .tap-prompt {
    position: absolute;
    bottom: 6%; left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 249, 239, 0.92);
    border: 2.5px solid var(--honey-shadow);
    border-radius: 24px;
    padding: 10px 24px;
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(16px, 3.6vw, 22px);
    color: var(--ink);
    animation: tap-pulse 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes tap-pulse {
    0%, 100% { opacity: 0.88; transform: translateX(-50%) scale(1); }
    50%      { opacity: 1;    transform: translateX(-50%) scale(1.05); }
  }

  /* ─── Corner controls (speaker + skip) ──────────────────────────────── */
  .corner {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 20;
  }
  .corner-btn {
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid var(--honey-shadow);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 1px 2px 3px rgba(0,0,0,0.15);
  }
  .corner-btn.active {
    background: var(--honey-amber);
  }
  .skip-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid var(--honey-shadow);
    border-radius: 22px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .skip-row input { cursor: pointer; }

  /* Subtitle band at the bottom of map panels — labels what we're looking at */
  .panel .subtitle {
    position: absolute;
    bottom: 4%; left: 50%;
    transform: translateX(-50%);
    background: rgba(58, 58, 58, 0.78);
    color: #fef9ef;
    padding: 5px 14px;
    border-radius: 14px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: clamp(11px, 2vw, 14px);
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Panel 1: zoomed-out Birchie map with A.R.C. pinned -->
  <div class="panel map-panel panel-1" id="panel-1">
    <img class="arc-pin" src="/admin/scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2" alt="">
    <div class="pin-bubble">A.R.C. — that's your place!</div>
    <div class="subtitle">Birchie-on-Sea</div>
  </div>

  <!-- Panel 2: zoom into the plot, see the building stamp at its real position -->
  <div class="panel map-panel panel-2" id="panel-2">
    <img class="building-stamp" src="/admin/scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2" alt="">
    <div class="subtitle">Your A.R.C. plot, just south of The Dip</div>
  </div>

  <!-- Panel 3: closer in, life on the site (Henry van + a couple of animals) -->
  <div class="panel map-panel panel-3" id="panel-3">
    <img class="building-stamp" src="/admin/scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2" alt="">
    <img class="henry-van" src="/assets/driving/vehicle-henry.png" alt="" onerror="this.style.display='none'">
    <img class="site-anim" id="site-anim-1" src="" alt="" style="left: 28%; top: 70%;" onerror="this.style.display='none'">
    <img class="site-anim" id="site-anim-2" src="" alt="" style="left: 60%; top: 72%;" onerror="this.style.display='none'">
    <div class="subtitle">A quiet morning at the centre</div>
  </div>

  <!-- Panel 4: building close-up + tap to enter -->
  <div class="panel panel-4" id="panel-4">
    <img class="building-stamp" src="/admin/scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2" alt="A.R.C. main building">
    <div class="tap-prompt" id="tap-prompt">Tap to go inside →</div>
  </div>

  <div class="corner">
    <button class="corner-btn active" id="speaker-btn" aria-label="Toggle sound">🔊</button>
    <label class="skip-row">
      <input type="checkbox" id="skip-checkbox">
      <span>Skip next time</span>
    </label>
  </div>
</div>

<script>
  (function () {
    const stage = document.getElementById('stage');
    const panels = [
      document.getElementById('panel-1'),
      document.getElementById('panel-2'),
      document.getElementById('panel-3'),
      document.getElementById('panel-4'),
    ];
    const speakerBtn = document.getElementById('speaker-btn');
    const skipCheckbox = document.getElementById('skip-checkbox');

    let current = 0;
    let autoTimer = null;
    let skipIntro = false;
    let musicOn = true;
    let species = 'cat';

    function send(type, payload) {
      try { parent.postMessage({ source: 'arc-auth', type: type, payload: payload }, '*'); } catch (_) {}
    }

    function showPanel(idx) {
      panels.forEach(function (p, i) { p.classList.toggle('active', i === idx); });
      current = idx;
      clearTimeout(autoTimer);
      // Auto-advance for panels 0..2; panel 3 (the 4th) waits for tap.
      if (idx < 3) {
        autoTimer = setTimeout(function () { showPanel(idx + 1); }, 2500);
      }
    }

    function start() {
      if (skipIntro) {
        showPanel(3);
      } else {
        showPanel(0);
      }
    }

    // Tap on panel body advances early (or completes on panel 4).
    stage.addEventListener('click', function (e) {
      if (e.target.closest('.corner')) return;
      if (current === 3) {
        send('intro-climactic-sfx', { species: species });
        setTimeout(function () { send('intro-complete'); }, 100);
        return;
      }
      if (current < 3) {
        showPanel(current + 1);
      }
    });

    speakerBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      send('toggle-music');
    });

    skipCheckbox.addEventListener('change', function (e) {
      e.stopPropagation();
      send('set-skip-intro', { value: skipCheckbox.checked });
    });

    // Receive init payload + music-state updates from parent.
    window.addEventListener('message', function (e) {
      const m = e.data;
      if (!m || m.source !== 'arc-auth-host') return;
      if (m.type === 'init' && m.payload) {
        skipIntro = !!m.payload.skipIntro;
        musicOn = !!m.payload.musicOn;
        species = (typeof m.payload.speciesForArrival === 'string') ? m.payload.speciesForArrival : 'cat';
        skipCheckbox.checked = skipIntro;
        speakerBtn.textContent = musicOn ? '🔊' : '🔇';
        speakerBtn.classList.toggle('active', musicOn);

        // Panel 3 "life on site" sprites — one is the species the kid will
        // welcome at arrival; the second is a friendly cat (or dog if the
        // kid's first species is cat, just for variety) sleeping in the garden.
        const a1 = document.getElementById('site-anim-1');
        const a2 = document.getElementById('site-anim-2');
        if (a1 && m.payload.arrivingSpriteSrc) {
          a1.src = m.payload.arrivingSpriteSrc;
        } else if (a1) {
          a1.src = '/assets/animals/cat-ginger-arriving.png';
        }
        if (a2) {
          a2.src = species === 'dog'
            ? '/assets/animals/cat-ginger-sleeping.png'
            : '/assets/animals/dog-golden-sleeping.png';
        }
        start();
      }
      if (m.type === 'music-state' && m.payload) {
        musicOn = !!m.payload.enabled;
        speakerBtn.textContent = musicOn ? '🔊' : '🔇';
        speakerBtn.classList.toggle('active', musicOn);
      }
    });

    // Standalone preview (no parent window) — start immediately for design review
    if (window.top === window.self) {
      const a1 = document.getElementById('site-anim-1');
      const a2 = document.getElementById('site-anim-2');
      if (a1) a1.src = '/assets/animals/cat-ginger-arriving.png';
      if (a2) a2.src = '/assets/animals/dog-golden-sleeping.png';
      start();
    }
  })();
</script>

</body>
</html>
