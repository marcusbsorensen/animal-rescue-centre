<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A.R.C. — Welcome</title>
<script>
  // Iframe-context detection — flips html.iframed before first paint
  // so design-preview chrome stays hidden when the page is mounted in-game.
  if (window.top !== window.self) document.documentElement.classList.add('iframed');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;600&family=Kalam:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<!--
  A.R.C. intro — town-map zoom-in sequence.

  4 panels, each a progressive CSS-transform zoom of the live Birchie
  OSM map SVG (the same one used by /admin/map.html). The kid sees
  the whole town first, then we push the camera in toward the A.R.C.
  plot, ending on a tap-to-enter close-up of the building.

  The SVG is embedded with <object> so its baked-in CSS animations
  (Thames cargo ships, southern-field tractors) keep playing through
  the zoom. Zoom mechanics: a single .zoom-stage wrapper holds the
  SVG and we set CSS variables --scale + --origin-x/y per panel,
  with a 1500ms ease transition for smooth pushes.

  Plot centre in the SVG viewBox (1800x1121) is (326, 376) → 18.1%
  from left, 33.5% from top → that's the transform-origin we zoom
  toward.

  Iframe handshake (unchanged from previous intro):
    - parent posts {source: 'arc-auth-host', type: 'init', payload}
    - this page posts {source: 'arc-auth', type: <action>, payload}
      with actions: intro-complete, intro-climactic-sfx,
      set-skip-intro, toggle-music.
-->
<style>
  :root {
    --cream-wash: #fef9ef;
    --honey-amber: #e3b04b;
    --honey-shadow: #b88a37;
    --trellis-brown: #7b5c3a;
    --ink: #3a3a3a;
    --map-bg: #dec98a;
    --sea-bg: #bfdde3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream-wash);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 100vh;
    user-select: none;
  }
  html.iframed body { background: var(--cream-wash) !important; }

  .stage {
    flex: 1;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    /* The SVG letterboxes (preserveAspectRatio="meet"); show the
       SVG's own sea-blue / land-tan split underneath so bands read
       as 'more sea above / more countryside below'. */
    background: linear-gradient(to bottom,
      var(--sea-bg) 0%, var(--sea-bg) 50%,
      var(--map-bg) 50%, var(--map-bg) 100%);
  }

  /* ─── Zoom stage — one wrapper, transform-driven push-in ───────── */
  .zoom-stage {
    position: absolute; inset: 0;
    /* Origin = A.R.C. plot in viewBox %: 326/1800, 397/1121 */
    transform-origin: var(--origin-x, 18.1%) var(--origin-y, 35.4%);
    transform: scale(var(--scale, 1));
    transition: transform 1500ms cubic-bezier(0.45, 0.05, 0.55, 0.95);
    will-change: transform;
  }
  .zoom-stage .osm-svg {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  /* Painted main-building stamp dropped on the A.R.C. plot — sits
     inside .zoom-stage so the CSS scale magnifies it along with the
     SVG. Position is computed on SVG load (same maths as map.html)
     so it follows the SVG's letterboxed render across aspect ratios. */
  .zoom-stage .building-stamp {
    position: absolute;
    transform: translate(-50%, -82%);
    width: 5%;          /* relative to .zoom-stage (= viewport at scale 1) */
    min-width: 38px;
    pointer-events: none;
    filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.3));
    opacity: 0;
    transition: opacity 400ms ease;
  }
  .zoom-stage .building-stamp.placed { opacity: 1; }

  /* Per-panel zoom levels. transform-origin stays locked on the
     A.R.C. plot so all zooms push toward the same point. */
  body[data-panel="1"] .zoom-stage { --scale: 1;   }
  body[data-panel="2"] .zoom-stage { --scale: 2;   }
  body[data-panel="3"] .zoom-stage { --scale: 3.5; }
  body[data-panel="4"] .zoom-stage { --scale: 5;   }

  /* ─── Caption (painted speech bubble) ──────────────────────────── */
  .caption {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    background: var(--cream-wash);
    border: 3px solid var(--honey-amber);
    border-radius: 22px;
    padding: 10px 22px;
    font-family: 'Kalam', 'Patrick Hand', cursive;
    font-weight: 700;
    font-size: clamp(15px, 3.4vw, 24px);
    color: var(--ink);
    box-shadow: 2px 4px 0 rgba(184,138,55,0.35), 0 6px 18px rgba(0,0,0,0.18);
    max-width: 86%;
    text-align: center;
    line-height: 1.25;
    opacity: 0;
    transition: opacity 600ms ease 200ms;
    pointer-events: none;
    z-index: 10;
  }
  .caption.show { opacity: 1; }
  /* Painted "tail" pointing up toward the map */
  .caption::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -14px;
    transform: translateX(-50%) rotate(45deg);
    width: 18px; height: 18px;
    background: var(--cream-wash);
    border-left: 3px solid var(--honey-amber);
    border-top: 3px solid var(--honey-amber);
    border-top-left-radius: 4px;
  }

  /* ─── Tap-to-enter prompt (panel 4 only) ──────────────────────── */
  .tap-prompt {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    background: var(--honey-amber);
    border: 3px solid var(--honey-shadow);
    border-radius: 26px;
    padding: 12px 28px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(16px, 3.8vw, 22px);
    color: var(--ink);
    box-shadow: 2px 4px 0 rgba(0,0,0,0.18), 0 6px 18px rgba(0,0,0,0.22);
    opacity: 0;
    pointer-events: none;
    z-index: 11;
  }
  body[data-panel="4"] .tap-prompt {
    opacity: 1;
    animation: tap-pulse 1.4s ease-in-out infinite;
  }
  @keyframes tap-pulse {
    0%, 100% { transform: translateX(-50%) scale(1);    opacity: 0.95; }
    50%      { transform: translateX(-50%) scale(1.07); opacity: 1;    }
  }

  /* ─── Corner controls (speaker + skip) ─────────────────────────── */
  .corner {
    position: absolute;
    top: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 20;
  }
  .corner-btn {
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid var(--honey-shadow);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 18px;
    box-shadow: 1px 2px 3px rgba(0,0,0,0.18);
  }
  .corner-btn.active { background: var(--honey-amber); }
  .skip-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid var(--honey-shadow);
    border-radius: 22px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .skip-row input { cursor: pointer; }
</style>
</head>
<body data-panel="1">

<div class="stage" id="stage">

  <!-- Single zoom wrapper — its CSS scale drives all 4 "panels". -->
  <div class="zoom-stage" id="zoom-stage">
    <object class="osm-svg" id="osm-svg"
            data="scene-assets/birchie-map/birchie-roads.svg"
            type="image/svg+xml"
            aria-label="Birchington-on-Sea town map"></object>
    <img class="building-stamp" id="building-stamp"
         src="scene-assets/reference/arc-site-tier1-2026-04-29/arc-main-building.png?v=2"
         alt="A.R.C. main building">
  </div>

  <!-- Caption swaps text per panel; fades in 200ms after each zoom step. -->
  <div class="caption" id="caption">Welcome to Birchie-on-Sea!</div>

  <!-- Tap-to-enter prompt (only visible on panel 4). -->
  <div class="tap-prompt" id="tap-prompt">Tap to go inside →</div>

  <div class="corner">
    <button class="corner-btn active" id="speaker-btn" aria-label="Toggle sound">🔊</button>
    <label class="skip-row">
      <input type="checkbox" id="skip-checkbox">
      <span>Skip next time</span>
    </label>
  </div>
</div>

<script>
  (function () {
    const body         = document.body;
    const stage        = document.getElementById('stage');
    const captionEl    = document.getElementById('caption');
    const speakerBtn   = document.getElementById('speaker-btn');
    const skipCheckbox = document.getElementById('skip-checkbox');

    // Panel definitions — captions only; zoom levels live in CSS.
    const PANELS = [
      { caption: 'Welcome to Birchie-on-Sea!' },
      { caption: 'Out here on the cliffs near Minnis Bay…' },
      { caption: '…is the Animal Rescue Centre!' },
      { caption: '' }   // panel 4 — building close-up; tap prompt instead
    ];
    const AUTO_MS = 2500;

    let current   = 0;       // 0..3 internal index → data-panel="1..4"
    let autoTimer = null;
    let skipIntro = false;
    let musicOn   = true;
    let species   = 'cat';

    // ─── Building stamp placement ───────────────────────────────────
    // The painted main-building PNG isn't part of the SVG — we drop
    // it on top, anchored to the A.R.C. plot's SVG coordinates,
    // following the same letterbox maths as /admin/map.html so it
    // stays glued to the plot as the viewport reflows.
    const SVG_VIEW_W = 1800;
    const SVG_VIEW_H = 1121;
    const ARC_PLOT_SVG_X = 326;
    const ARC_PLOT_SVG_Y = 397;

    function placeBuildingStamp() {
      const stage    = document.getElementById('zoom-stage');
      const obj      = document.getElementById('osm-svg');
      const stamp    = document.getElementById('building-stamp');
      if (!stage || !obj || !stamp) return;
      const stageR = stage.getBoundingClientRect();
      // The object's rect already includes the parent's transform —
      // back out to the unscaled box by dividing by the current scale.
      const cs     = getComputedStyle(stage);
      const m      = new DOMMatrixReadOnly(cs.transform);
      const scale  = m.a || 1;
      const objR   = obj.getBoundingClientRect();
      const baseW  = objR.width  / scale;
      const baseH  = objR.height / scale;
      if (baseW === 0 || baseH === 0) return;
      // SVG uses preserveAspectRatio="xMidYMid meet" → contain.
      const svgScale = Math.min(baseW / SVG_VIEW_W, baseH / SVG_VIEW_H);
      const renderedW = SVG_VIEW_W * svgScale;
      const renderedH = SVG_VIEW_H * svgScale;
      const offX = (baseW - renderedW) / 2;
      const offY = (baseH - renderedH) / 2;
      const px = offX + ARC_PLOT_SVG_X * svgScale;
      const py = offY + ARC_PLOT_SVG_Y * svgScale;
      // Express as % of stage box so the stamp scales smoothly.
      const leftPct = px / baseW * 100;
      const topPct  = py / baseH * 100;
      stamp.style.left = leftPct.toFixed(3) + '%';
      stamp.style.top  = topPct.toFixed(3) + '%';
      stamp.classList.add('placed');
      // Keep the zoom transform-origin glued to the same plot point so
      // every scale step pushes toward the building, not the viewport
      // centre.  CSS vars override the static fallback in the stylesheet.
      stage.style.setProperty('--origin-x', leftPct.toFixed(3) + '%');
      stage.style.setProperty('--origin-y', topPct.toFixed(3) + '%');
    }

    document.getElementById('osm-svg').addEventListener('load', placeBuildingStamp);
    window.addEventListener('resize', placeBuildingStamp);
    // Belt-and-braces: SVG load can fire before this listener attaches.
    setTimeout(placeBuildingStamp, 600);

    function send(type, payload) {
      try {
        parent.postMessage({ source: 'arc-auth', type: type, payload: payload }, '*');
      } catch (_) {}
    }

    function showPanel(idx) {
      if (idx < 0 || idx > 3) return;
      current = idx;
      body.setAttribute('data-panel', String(idx + 1));

      // Fade caption out, swap text, fade back in (handled by .show toggle).
      captionEl.classList.remove('show');
      const text = PANELS[idx].caption;
      if (text) {
        captionEl.textContent = text;
        // Re-trigger fade-in after the zoom transition starts.
        setTimeout(function () { captionEl.classList.add('show'); }, 50);
      }

      clearTimeout(autoTimer);
      if (idx < 3) {
        autoTimer = setTimeout(function () { showPanel(idx + 1); }, AUTO_MS);
      }
    }

    function start() {
      if (skipIntro) {
        showPanel(3);
      } else {
        showPanel(0);
      }
    }

    // Tap on the stage:
    //  - panels 0..2: skip ahead (advance early)
    //  - panel 3: fire climactic SFX, then complete after 400ms
    stage.addEventListener('click', function (e) {
      if (e.target.closest('.corner')) return;
      if (current === 3) {
        send('intro-climactic-sfx', { species: species });
        setTimeout(function () { send('intro-complete'); }, 400);
        return;
      }
      showPanel(current + 1);
    });

    speakerBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      send('toggle-music');
    });

    skipCheckbox.addEventListener('change', function (e) {
      e.stopPropagation();
      send('set-skip-intro', { value: skipCheckbox.checked });
    });

    // Receive init payload + music-state updates from parent.
    window.addEventListener('message', function (e) {
      const m = e.data;
      if (!m || m.source !== 'arc-auth-host') return;
      if (m.type === 'init' && m.payload) {
        skipIntro = !!m.payload.skipIntro;
        musicOn   = !!m.payload.musicOn;
        species   = (typeof m.payload.speciesForArrival === 'string')
                    ? m.payload.speciesForArrival : 'cat';
        skipCheckbox.checked = skipIntro;
        speakerBtn.textContent = musicOn ? '🔊' : '🔇';
        speakerBtn.classList.toggle('active', musicOn);
        start();
      }
      if (m.type === 'music-state' && m.payload) {
        musicOn = !!m.payload.enabled;
        speakerBtn.textContent = musicOn ? '🔊' : '🔇';
        speakerBtn.classList.toggle('active', musicOn);
      }
    });

    // Standalone preview (no parent window) — start immediately for
    // design review at /admin/intro.html.
    if (window.top === window.self) {
      start();
    }
  })();
</script>

</body>
</html>
