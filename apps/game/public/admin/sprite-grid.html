<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A.R.C. — Animal sprite grid</title>
<style>
  :root {
    --bg: #fff6eb;
    --panel: #ffffff;
    --ink: #3a2e20;
    --muted: #8a7864;
    --border: #eadbc5;
    --accent: #e67e22;
    --ok: #3D8A2E;
    --missing: #c0392b;
    --checker-a: #ffffff;
    --checker-b: #f0e6d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Nunito, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 16px 24px;
    background: #ffffffee;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap;
    gap: 16px; align-items: center;
  }
  h1 { margin: 0; font-size: 20px; }
  .status { font-size: 13px; color: var(--muted); }
  .status strong.ok { color: var(--ok); }
  .status strong.missing { color: var(--missing); }
  .controls { display: inline-flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .controls button {
    background: #fff; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .controls button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }

  section { padding: 20px 24px; }
  h2 {
    margin: 4px 0 14px 0;
    font-size: 17px; color: var(--accent);
    border-bottom: 2px dashed #f0d9b8; padding-bottom: 6px;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 6px;
    table-layout: fixed;
  }
  th, td {
    padding: 6px;
    text-align: center;
    vertical-align: middle;
    font-size: 12px;
  }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
  }
  th.variant, td.variant {
    text-align: right;
    width: 120px;
    font-weight: 600;
    color: var(--ink);
    font-size: 13px;
    padding-right: 10px;
  }
  td.variant.fallback {
    font-style: italic;
    color: var(--muted);
  }
  /* Vertical divider between basic states and emotional states */
  th.group-start, td.group-start {
    border-left: 2px dashed #f0d9b8;
    padding-left: 10px;
  }
  body[data-bg="dark"] th.group-start,
  body[data-bg="dark"] td.group-start { border-left-color: #555; }
  th.group-label {
    text-align: left;
    color: var(--accent);
    font-style: italic;
    padding-left: 10px;
  }

  .cell {
    background:
      linear-gradient(45deg, var(--checker-b) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker-b) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker-b) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker-b) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: var(--checker-a);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 120px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .cell img {
    max-width: 100%;
    max-height: 100%;
    image-rendering: -webkit-optimize-contrast;
  }
  .cell.missing {
    border: 2px dashed var(--missing);
    color: var(--missing);
    font-weight: 700;
    background: #fff3f3;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Dark-background toggle for verifying transparency / light-coloured fur */
  body[data-bg="dark"] {
    background: #1c1c1c;
    color: #eee;
  }
  body[data-bg="dark"] section { color: #eee; }
  body[data-bg="dark"] .cell {
    --checker-a: #2a2a2a;
    --checker-b: #3a3a3a;
    border-color: #444;
  }
  body[data-bg="dark"] td.variant { color: #eee; }
  body[data-bg="dark"] td.variant.fallback { color: #bbb; }
  body[data-bg="dark"] th { color: #bbb; }

  /* Size toggle — render at in-game approximation */
  body[data-size="game"] .cell { height: 80px; }
  body[data-size="large"] .cell { height: 180px; }

  .legend {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .dot.ok { background: var(--ok); }
  .legend .dot.missing { background: var(--missing); }
</style>
</head>
<body data-bg="light" data-size="design">

<header>
  <div>
    <h1>A.R.C. — Animal sprite grid</h1>
    <div class="status" id="status">Counting sprites…</div>
  </div>
  <div class="controls">
    <span class="legend"><span class="dot ok"></span>Present</span>
    <span class="legend"><span class="dot missing"></span>Missing</span>
    <button data-size="design" class="active">Design size</button>
    <button data-size="game">In-game size</button>
    <button data-size="large">Large</button>
    <button data-bg="light" class="active">Light</button>
    <button data-bg="dark">Dark</button>
  </div>
</header>

<main id="grid-root"></main>

<script>
  const SPECIES_VARIANTS = {
    cat:    ['ginger', 'black', 'calico', 'grey', 'siamese', 'white', 'tuxedo', 'tortie'],
    dog:    ['golden', 'dalmatian', 'chocolate', 'beagle', 'husky', 'pug', 'collie', 'terrier'],
    fox:    ['red', 'arctic', 'silver', 'cross', 'marble', 'fennec'],
    bunny:  ['dutch', 'lop', 'lionhead', 'rex', 'angora', 'spotted'],
    bat:    ['brown', 'fruit', 'longeared', 'pipistrelle', 'white'],
    parrot: ['budgie', 'cockatiel', 'grey', 'macaw', 'lovebird'],
    snake:  ['corn', 'python', 'king', 'garter', 'hognose'],
  };
  // Two state groups — basic in-game states and emotional/conflict states.
  // The divider between them renders as a dashed left border on the first
  // emotional column, so it's easy to see at a glance which per-variant
  // sprites are for conflict/incident screens.
  const BASIC_STATES = ['arriving', 'sheltered', 'eating', 'sleeping', 'walking'];
  const EMOTIONAL_STATES = ['growling', 'grumpy', 'scared', 'sick'];
  const STATES = [...BASIC_STATES, ...EMOTIONAL_STATES];

  const root = document.getElementById('grid-root');
  const statusEl = document.getElementById('status');

  let totalCells = 0;
  let presentCells = 0;
  const pending = [];

  // Using <img> onload/onerror rather than HEAD — Vite (and Vercel's SPA
  // fallback) returns index.html with status 200 for missing asset paths,
  // which would falsely satisfy a HEAD check. The image decoder correctly
  // rejects HTML bytes and fires onerror.
  function cellFor(species, variant, state) {
    const prefix = variant ? species + '-' + variant : species;
    const src = '/assets/animals/' + prefix + '-' + state + '.png';

    const td = document.createElement('td');
    if (state === EMOTIONAL_STATES[0]) td.className = 'group-start';
    const cell = document.createElement('div');
    cell.className = 'cell';

    const img = document.createElement('img');
    img.alt = prefix + '-' + state;

    totalCells++;
    const done = new Promise((resolve) => {
      img.addEventListener('load', () => {
        presentCells++;
        resolve();
      });
      img.addEventListener('error', () => {
        cell.classList.add('missing');
        cell.textContent = 'missing';
        img.remove();
        resolve();
      });
    });
    img.src = src;
    pending.push(done);

    cell.appendChild(img);
    td.appendChild(cell);
    return td;
  }

  function renderSpecies(species, variants) {
    const section = document.createElement('section');

    const h2 = document.createElement('h2');
    h2.textContent = species[0].toUpperCase() + species.slice(1) + ' — ' + variants.length + ' variants';
    section.appendChild(h2);

    const table = document.createElement('table');

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headRow.appendChild(document.createElement('th'));
    for (const state of STATES) {
      const th = document.createElement('th');
      th.textContent = state;
      if (state === EMOTIONAL_STATES[0]) th.className = 'group-start';
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    const fallbackRow = document.createElement('tr');
    const fallbackLabel = document.createElement('td');
    fallbackLabel.className = 'variant fallback';
    fallbackLabel.textContent = '(fallback)';
    fallbackRow.appendChild(fallbackLabel);
    for (const state of STATES) {
      fallbackRow.appendChild(cellFor(species, null, state));
    }
    tbody.appendChild(fallbackRow);

    for (const variant of variants) {
      const row = document.createElement('tr');
      const label = document.createElement('td');
      label.className = 'variant';
      label.textContent = variant;
      row.appendChild(label);
      for (const state of STATES) {
        row.appendChild(cellFor(species, variant, state));
      }
      tbody.appendChild(row);
    }

    table.appendChild(tbody);
    section.appendChild(table);
    root.appendChild(section);
  }

  for (const [species, variants] of Object.entries(SPECIES_VARIANTS)) {
    renderSpecies(species, variants);
  }

  function renderStatus() {
    const missing = totalCells - presentCells;
    statusEl.textContent = '';

    const okNode = document.createElement('strong');
    okNode.className = 'ok';
    okNode.textContent = String(presentCells);

    const missingNode = document.createElement('strong');
    missingNode.className = 'missing';
    missingNode.textContent = String(missing);

    statusEl.append(okNode, ' present \u00A0/\u00A0 ', missingNode, ' missing \u00A0/\u00A0 ', String(totalCells) + ' total');
  }

  Promise.all(pending).then(renderStatus);

  for (const btn of document.querySelectorAll('.controls button')) {
    btn.addEventListener('click', () => {
      if (btn.dataset.size) {
        for (const b of document.querySelectorAll('.controls button[data-size]')) b.classList.remove('active');
        document.body.dataset.size = btn.dataset.size;
        btn.classList.add('active');
      }
      if (btn.dataset.bg) {
        for (const b of document.querySelectorAll('.controls button[data-bg]')) b.classList.remove('active');
        document.body.dataset.bg = btn.dataset.bg;
        btn.classList.add('active');
      }
    });
  }
</script>
</body>
</html>
