<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.R.C. — Lost animal!</title>
<style>
  :root {
    --bg: #fef9ef;
    --ink: #3a2e20;
    --muted: #8a7864;
    --accent: #e67e22;
    --green: #3D8A2E;
    --green-dark: #2f6b22;
    --cream: #fff6eb;
    --shadow: rgba(90, 60, 20, 0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Nunito, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 20%, #f5ead5 0%, transparent 30%),
      radial-gradient(circle at 85% 75%, #f5ead5 0%, transparent 30%),
      linear-gradient(180deg, #fff4df 0%, #fef9ef 70%);
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .code {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 12px 0;
    font-size: clamp(32px, 6vw, 56px);
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  p.sub {
    margin: 0 0 28px 0;
    font-size: clamp(16px, 2.5vw, 20px);
    color: var(--muted);
    max-width: 520px;
    line-height: 1.5;
  }
  .scene {
    position: relative;
    width: min(480px, 80vw);
    aspect-ratio: 16 / 9;
    margin: 20px 0 32px 0;
    border-radius: 24px;
    background: linear-gradient(180deg, #eaf3d8 0%, #cfe4a9 100%);
    box-shadow: 0 10px 30px var(--shadow), inset 0 -6px 12px rgba(60, 90, 40, 0.08);
    overflow: hidden;
  }
  .sun {
    position: absolute;
    top: 14%;
    right: 12%;
    width: 48px;
    height: 48px;
    background: #fcd676;
    border-radius: 50%;
    box-shadow: 0 0 24px rgba(252, 214, 118, 0.6);
  }
  .ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34%;
    background: linear-gradient(180deg, #b6d181 0%, #8cb15a 100%);
    border-top: 2px solid #92ba63;
  }
  .path {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: 12%;
    height: 28px;
    background: linear-gradient(180deg, #d9bc8d 0%, #b99968 100%);
    border-radius: 40px;
    transform: rotate(-3deg);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.08);
  }
  .tree {
    position: absolute;
    bottom: 34%;
    width: 42px;
    height: 60px;
  }
  .tree .trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 22px;
    background: #8a6a3e;
    border-radius: 3px;
  }
  .tree .leaves {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 44px;
    background: radial-gradient(circle at 35% 35%, #6fa84a 0%, #4a8a2f 100%);
    border-radius: 50%;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,0.08);
  }
  .tree.t1 { left: 8%; }
  .tree.t2 { right: 12%; transform: scale(1.3); }
  .tree.t3 { left: 26%; transform: scale(0.8); bottom: 36%; }
  .animal {
    position: absolute;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);
    width: 110px;
    animation: bob 1.4s ease-in-out infinite;
  }
  .animal img {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 6px 8px rgba(60, 40, 20, 0.2));
  }
  .bubble {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 2px solid #eadbc5;
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: 0 4px 10px rgba(80, 50, 20, 0.1);
    white-space: nowrap;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #fff;
    border-bottom: 0;
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: #eadbc5;
    border-bottom: 0;
  }
  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-4px); }
  }
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }
  a.btn.primary {
    background: var(--green);
    color: #fff;
    box-shadow: 0 4px 0 var(--green-dark), 0 8px 16px rgba(60, 100, 40, 0.18);
  }
  a.btn.primary:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--green-dark), 0 4px 8px rgba(60, 100, 40, 0.18);
  }
  a.btn.secondary {
    background: #fff;
    color: var(--ink);
    border: 1px solid #eadbc5;
    box-shadow: 0 2px 8px var(--shadow);
  }
  a.btn.secondary:hover { background: var(--cream); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">ERROR 404</div>
    <h1>This page has wandered off.</h1>
    <p class="sub">One of our animals got curious and followed the wrong scent. Let's help them back home.</p>

    <div class="scene">
      <div class="sun"></div>
      <div class="ground"></div>
      <div class="tree t3"></div>
      <div class="path"></div>
      <div class="tree t1"></div>
      <div class="tree t2"></div>
      <div class="animal" id="animal-slot"></div>
      <div class="bubble" id="bubble-slot">Where am I?</div>
    </div>

    <div class="actions">
      <a class="btn primary" href="/">Back to the Rescue Centre</a>
      <a class="btn secondary" href="javascript:history.back()">Go back</a>
    </div>
  </div>

  <script>
    // Pick a random lost animal from the cast. Arriving pose suits a lost look.
    const cast = [
      { src: '/assets/animals/dog-beagle-arriving.png', say: 'Sniff... this isn\u2019t home.' },
      { src: '/assets/animals/cat-ginger-arriving.png', say: 'Meow? Hello?' },
      { src: '/assets/animals/cat-calico-arriving.png', say: 'I seem to be lost.' },
      { src: '/assets/animals/dog-golden-arriving.png', say: 'Which way back?' },
      { src: '/assets/animals/fox-red-arriving.png', say: 'Oh dear, a wrong turn.' },
      { src: '/assets/animals/bunny-dutch-arriving.png', say: 'This place is new.' },
      { src: '/assets/animals/cat-black-arriving.png', say: 'I smell... nothing familiar.' },
      { src: '/assets/animals/dog-dalmatian-arriving.png', say: 'Where did everyone go?' },
      { src: '/assets/animals/bunny-lop-arriving.png', say: 'Hop hop... lost.' },
    ];
    const pick = cast[Math.floor(Math.random() * cast.length)];
    const img = document.createElement('img');
    img.src = pick.src;
    img.alt = 'Lost animal';
    // Fallback to a plain species sprite if the variant doesn't exist.
    img.onerror = () => {
      img.onerror = null;
      img.src = '/assets/animals/cat-arriving.png';
    };
    document.getElementById('animal-slot').appendChild(img);
    document.getElementById('bubble-slot').textContent = pick.say;
  </script>
</body>
</html>
