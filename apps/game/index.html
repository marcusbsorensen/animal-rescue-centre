<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>A.R.C. — Animal Rescue Centre</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Home-screen icon. Without this, "Add to Home Screen" gives a grey
      letter tile instead of the paw-heart — the manifest's icons are not
      consulted for a web clip. apple-mobile-web-app-title keeps the label
      short; the <title> is too long for a home-screen caption.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="A.R.C." />
    <!--
      Self-hosted — see public/fonts/fonts.css. Loading these from
      fonts.googleapis.com sent the device IP to a third party on every
      cold launch, which is a review risk for a Kids Category app, and
      left the game with fallback type whenever it opened offline.
    -->
    <link rel="preload" href="/fonts/nunito-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #fef9ef; }
      #game-container { width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
